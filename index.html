<title>Terminal</title>
<style>
  html,body{margin:0;padding:0;background:#000;color:#c9cbd0;font-family:ui-monospace,Menlo,monospace;}
  *{box-sizing:border-box;}
  ::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-thumb{background:#2a2b2e}
  @keyframes tape{from{transform:translateX(0)}to{transform:translateX(-50%)}}
  @keyframes blink{50%{opacity:0}}
  .tape{animation:tape 34s linear infinite;white-space:nowrap;display:inline-block}
  .caret{animation:blink 1s step-end infinite}
  #boot{padding:20px;font-size:14px;color:#ffb000;}
  #err{display:none;white-space:pre-wrap;padding:16px;margin:12px;border:1px solid #ff4d4d;color:#ff8a8a;font-size:12px;background:#140505;}
</style>

<body>
<div id="root"><div id="boot">◈ TERMINAL — lädt…<br><span style="color:#7f858f;font-size:12px">Wenn dieser Text hängen bleibt: Internet/Content-Blocker prüfen. Fehler erscheinen unten in Rot.</span></div></div>
<div id="err"></div>

<script>
  window.__err = function(msg){
    var e=document.getElementById('err'); if(!e)return;
    e.style.display='block'; e.textContent='FEHLER:\n'+msg+'\n\n(Screenshot an den Chat schicken.)';
  };
  window.addEventListener('error', function(ev){ window.__err((ev.error && ev.error.stack) || ev.message || String(ev)); });
  window.addEventListener('unhandledrejection', function(ev){ window.__err('Promise: '+((ev.reason && ev.reason.message) || ev.reason)); });
</script>

/* ================= LocalStorage persistence (standalone file, no window.storage) ================= */

/* ================= Data layer (nur Finnhub/US — läuft garantiert im Browser) ================= */
async function fhQuote(sym, k) { return jget(`${FH}/quote?symbol=${sym}&token=${k}`); }
async function tdQuote(sym, k) { return jget(`${TD}/quote?symbol=${sym}&apikey=${k}`); }
async function tdSeries(sym, k) {
  const r = await jget(`${TD}/time_series?symbol=${sym}&interval=1day&outputsize=140&apikey=${k}`);
  if (r?.status === "ok" && Array.isArray(r.values)) return { ok: true, series: r.values.map((v) => ({ t: v.datetime, p: +v.close })).reverse() };
  return { ok: false, series: [] };
}
async function yfGet(yticker, range) {
  const r = await jget(`${YF}?symbol=${encodeURIComponent(yticker)}${range ? `&range=${range}` : ""}`);
  if (r?.error) throw new Error(r.error);
  return r;
}
async function searchSymbol(query) {
  try { const r = await jget(`${YF}?search=${encodeURIComponent(query)}`); return r?.quotes || []; } catch { return []; }
}
function localPresetMatch(query) {
  const q = query.trim().toLowerCase(); if (!q) return null;
  const all = [...EU_PRESETS, ...ASIA_PRESETS];
  return all.find((p) => p.s.toLowerCase() === q || p.label.toLowerCase() === q) || all.find((p) => p.label.toLowerCase().includes(q)) || null;
}
async function resolveSymbol(query) {
  const q = query.trim(); if (!q) return null;
  const local = localPresetMatch(q);
  if (local) return { s: local.s, y: local.y };
  const hits = await searchSymbol(q);
  const hit = hits[0];
  if (!hit) return { s: q.toUpperCase() };
  const short = hit.symbol.split(".")[0].split("=")[0].replace(/^\^/, "").toUpperCase();
  return { s: short, y: hit.symbol };
}
const CHART_RANGES = [["1d", "1T"], ["5d", "5T"], ["1mo", "1M"], ["6mo", "6M"], ["1y", "1J"], ["5y", "5J"]];

  if (tdKey && !e.y) { const r = await tdSeries(e.s, tdKey); if (r.ok) return r; }
  return { ok: false, series: [] };
}

}
async function getDetail(e, fhKey) {

  if (!q || !q.c) throw new Error("Kein Kurs — US-Ticker prüfen, oder für Nicht-US den Preset/Börsen-Ticker nutzen (z.B. RHM.DE).");
  const [nm, sec] = US_NAME[e.s] || [e.s, "—"]; const now = Date.now();
  return {

    pe: yx?.pe ?? null, eps: yx?.eps ?? null, divYield: yx?.divYield ?? null, target: yx?.target ?? null,

    news: Array.isArray(news) ? news.slice(0, 8).map((n) => ({ headline: n.headline, source: (n.source || "NEWS").toUpperCase().slice(0, 10), ago: Math.max(1, Math.floor((now - n.datetime * 1000) / 6e4)), summary: n.summary || "", url: n.url, tags: [e.s] })) : [],
  };
}

/* ================= Groq AI (OpenAI-kompatibel, kostenlos, kein Kreditkarte nötig) ================= */
async function askGroq(groqKey, systemPrompt, historyMsgs, latest) {
  const messages = [
    { role: "system", content: systemPrompt },
    ...historyMsgs.map((m) => ({ role: m.role === "assistant" ? "assistant" : "user", content: m.content })),
    { role: "user", content: latest },
  ];
  const res = await fetch("https://api.groq.com/openai/v1/chat/completions", {
    method: "POST",
    headers: { "Content-Type": "application/json", "Authorization": `Bearer ${groqKey}` },
    body: JSON.stringify({ model: "llama-3.3-70b-versatile", messages, max_tokens: 700, temperature: 0.4 }),
  });
  const data = await res.json();
  if (data?.error) throw new Error(data.error.message || "Groq-Fehler");
  return data?.choices?.[0]?.message?.content?.trim() || "Keine Antwort.";
}

/* ================= Technische Indikatoren ================= */
function sma(vals, period) {
  const out = new Array(vals.length).fill(null);
  let sum = 0;
  for (let i = 0; i < vals.length; i++) {
    sum += vals[i];
    if (i >= period) sum -= vals[i - period];
    if (i >= period - 1) out[i] = sum / period;
  }
  return out;
}
function rsi(vals, period) {
  const out = new Array(vals.length).fill(null);
  if (vals.length < period + 1) return out;
  let gain = 0, loss = 0;
  for (let i = 1; i <= period; i++) { const d = vals[i] - vals[i - 1]; if (d >= 0) gain += d; else loss -= d; }
  gain /= period; loss /= period;
  out[period] = loss === 0 ? 100 : 100 - 100 / (1 + gain / loss);
  for (let i = period + 1; i < vals.length; i++) {
    const d = vals[i] - vals[i - 1]; const g = d > 0 ? d : 0, l = d < 0 ? -d : 0;
    gain = (gain * (period - 1) + g) / period; loss = (loss * (period - 1) + l) / period;
    out[i] = loss === 0 ? 100 : 100 - 100 / (1 + gain / loss);
  }
  return out;
}

/* ================= Chart (rendert Kursverlauf von Yahoo) ================= */
function SvgChart({ series, up, overlays }) {
  if (!series || series.length < 3) return null;
  const w = 600, h = 200, pad = 8;
  const vals = series.map((d) => d.p);
  const overlayVals = (overlays || []).flatMap((o) => o.vals.filter((v) => v != null));
  const allVals = [...vals, ...overlayVals];
  const min = Math.min(...allVals), max = Math.max(...allVals);
  const range = max - min || 1;
  const xAt = (i) => pad + (i / (series.length - 1)) * (w - pad * 2);
  const yAt = (v) => h - pad - ((v - min) / range) * (h - pad * 2);
  const pts = series.map((d, i) => [xAt(i), yAt(d.p)]);
  const line = pts.map((p, i) => (i === 0 ? `M${p[0]},${p[1]}` : `L${p[0]},${p[1]}`)).join(" ");
  const area = `${line} L${pts[pts.length - 1][0]},${h - pad} L${pts[0][0]},${h - pad} Z`;
  const col = up ? C.green : C.red;
  const gid = "grad" + Math.random().toString(36).slice(2, 8);
  return (
    <svg viewBox={`0 0 ${w} ${h}`} style={{ width: "100%", height: 210, display: "block" }} preserveAspectRatio="none">
      <defs><linearGradient id={gid} x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stopColor={col} stopOpacity="0.35" /><stop offset="100%" stopColor={col} stopOpacity="0" /></linearGradient></defs>
      <path d={area} fill={`url(#${gid})`} />
      <path d={line} fill="none" stroke={col} strokeWidth="1.6" />
      {(overlays || []).map((o, oi) => {
        const segs = []; let cur = [];
        o.vals.forEach((v, i) => { if (v == null) { if (cur.length > 1) segs.push(cur); cur = []; return; } cur.push([xAt(i), yAt(v)]); });
        if (cur.length > 1) segs.push(cur);
        return segs.map((seg, si) => <path key={oi + "-" + si} d={seg.map((p, i) => (i === 0 ? `M${p[0]},${p[1]}` : `L${p[0]},${p[1]}`)).join(" ")} fill="none" stroke={o.color} strokeWidth="1.2" opacity="0.9" />);
      })}
    </svg>
  );
}
function VolumeChart({ series }) {
  const vols = series.map((d) => d.v).filter((v) => v != null);
  if (vols.length < 3) return null;
  const w = 600, h = 44;
  const max = Math.max(...vols) || 1;
  const bw = w / series.length;
  return (
    <svg viewBox={`0 0 ${w} ${h}`} style={{ width: "100%", height: 44, display: "block", marginTop: 4 }} preserveAspectRatio="none">
      {series.map((d, i) => d.v == null ? null : <rect key={i} x={i * bw} y={h - (d.v / max) * h} width={Math.max(bw - 1, 0.5)} height={(d.v / max) * h} fill={C.muted} opacity="0.55" />)}
    </svg>
  );
}
function RSIChart({ vals }) {
  const pts = vals.map((v, i) => (v == null ? null : [i, v])).filter(Boolean);
  if (pts.length < 3) return null;
  const w = 600, h = 46;
  const xAt = (i) => (i / (vals.length - 1)) * w;
  const yAt = (v) => h - (v / 100) * h;
  const line = pts.map((p, i) => `${i === 0 ? "M" : "L"}${xAt(p[0])},${yAt(p[1])}`).join(" ");
  return (
    <svg viewBox={`0 0 ${w} ${h}`} style={{ width: "100%", height: 46, display: "block", marginTop: 4 }} preserveAspectRatio="none">
      <line x1="0" y1={yAt(70)} x2={w} y2={yAt(70)} stroke={C.red} strokeWidth="0.6" strokeDasharray="3,3" opacity="0.5" />
      <line x1="0" y1={yAt(30)} x2={w} y2={yAt(30)} stroke={C.green} strokeWidth="0.6" strokeDasharray="3,3" opacity="0.5" />
      <path d={line} fill="none" stroke={C.blue} strokeWidth="1.3" />
    </svg>
  );
}

function FinancialsChart({ data }) {
  if (!data || data.length < 2) return null;
  const w = 600, h = 130, pad = 18;
  const vals = data.flatMap((d) => [d.revenue, d.earnings]).filter((v) => v != null);
  if (!vals.length) return null;
  const max = Math.max(...vals, 0), min = Math.min(...vals, 0);
  const range = (max - min) || 1;
  const zeroY = h - pad - ((0 - min) / range) * (h - pad * 2);
  const bw = (w - pad * 2) / data.length;
  return (
    <svg viewBox={`0 0 ${w} ${h}`} style={{ width: "100%", height: 130, display: "block" }} preserveAspectRatio="none">
      <line x1={pad} y1={zeroY} x2={w - pad} y2={zeroY} stroke={C.line} strokeWidth="1" />
      {data.map((d, i) => {
        const x0 = pad + i * bw;
        const rH = d.revenue != null ? (Math.abs(d.revenue) / range) * (h - pad * 2) : 0;
        const eH = d.earnings != null ? (Math.abs(d.earnings) / range) * (h - pad * 2) : 0;
        return (
          <g key={i}>
            {d.revenue != null && <rect x={x0 + bw * 0.15} y={d.revenue >= 0 ? zeroY - rH : zeroY} width={bw * 0.3} height={rH} fill={C.blue} opacity="0.85" />}
            {d.earnings != null && <rect x={x0 + bw * 0.55} y={d.earnings >= 0 ? zeroY - eH : zeroY} width={bw * 0.3} height={eH} fill={d.earnings >= 0 ? C.green : C.red} opacity="0.85" />}
            <text x={x0 + bw / 2} y={h - 4} fontSize="9" fill={C.muted} textAnchor="middle">{d.year}</text>
          </g>
        );
      })}
    </svg>
  );
}

/* ================= Atoms ================= */
const Panel = ({ title, right, children, style }) => (
  <div style={{ background: C.panel, border: `1px solid ${C.line}`, ...style }}>
    {title && <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", padding: "5px 9px", borderBottom: `1px solid ${C.line}`, background: C.panel2 }}><span style={{ color: C.orange, fontSize: 10.5, letterSpacing: 1.5, fontWeight: 700 }}>{title}</span>{right}</div>}
    <div style={{ padding: 9 }}>{children}</div>
  </div>
);
const Stat = ({ k, v, color }) => (<div style={{ borderBottom: `1px solid ${C.line}`, padding: "4px 0", display: "flex", justifyContent: "space-between" }}><span style={{ color: C.muted, fontSize: 10.5 }}>{k}</span><span style={{ color: color || C.white, fontSize: 12 }}>{v}</span></div>);
function DayRange({ d }) {
  if (d.low == null || d.high == null || d.high <= d.low) return <div style={{ color: C.muted, fontSize: 11 }}>Keine Tagesdaten.</div>;
  const pos = (v) => Math.max(0, Math.min(100, ((v - d.low) / (d.high - d.low)) * 100));
