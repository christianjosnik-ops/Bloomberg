function GeoPanel({ geo, geoBusy, geoErr, geoSel, setGeoSel, loadGeo, diag, diagBusy, diagErr, runDiag }) {
  const countries = geo ? Object.values(geo.countries) : [];
  const sorted = countries.slice().sort((a, b) => {
    const d = geoLevelMeta(b.level).order - geoLevelMeta(a.level).order;
    return d !== 0 ? d : b.gdeltCount - a.gdeltCount;
  });
  const selCountry = geoSel ? countries.find((c) => c.iso3 === geoSel) : null;

  return (
    <div className="page">
      <div className="toolbar">
        <span className="muted">Geopolitische Risikoübersicht · GDELT (Nachrichtenvolumen) + UCDP (Konfliktdaten)</span>
        <div className="spacer" />
        <button className="btn btn--ghost" onClick={loadGeo} disabled={geoBusy}>{geoBusy ? "…" : "↻ AKTUALISIEREN"}</button>
      </div>

      <div className="note" style={{ marginBottom: 8 }}>
        <div>Beobachtete Länder: aktive UCDP-Konfliktländer + eine von Hand kuratierte, kurze Liste geopolitisch dauerhaft relevanter Staaten (max. 20). <b style={{ color: C.text }}>Keine erschöpfende Weltabdeckung.</b></div>
        <div>Stufe kombiniert: GDELT-Artikelvolumen (Konflikt-Schlagwörter, 7 Tage) + ob UCDP aktuell einen Konflikt für das Land führt. {geo?.generatedAt && <span>Stand: {new Date(geo.generatedAt).toLocaleString("de-DE")}</span>}</div>
        {/* Zwei verschiedene Dinge, die nicht gleich aussehen duerfen: ein
            echter Ausfall verlangt Aufmerksamkeit, eine bewusst uebersprungene
            Zusatzquelle nicht. UCDP verlangt seit Kurzem einen kostenlosen
            Zugangstoken - ohne ihn wird die Quelle absichtlich ausgelassen und
            die Laenderliste kommt vollstaendig aus der kuratierten Liste. */}
        {geo?.ucdpError && (/übersprungen/.test(geo.ucdpError)
          ? <div className="muted" style={{ marginTop: 3 }}>UCDP-Konfliktdaten nicht aktiviert ({geo.ucdpError}) — die Länderauswahl kommt aus der kuratierten Liste, GDELT ist unabhängig davon aktiv.</div>
          : <div style={{ color: C.amber, marginTop: 3 }}>⚠ UCDP nicht erreichbar ({geo.ucdpError}) — nur feste Länderliste + GDELT aktiv.</div>
        )}
      </div>

      {geoErr && <div className="note note--err" style={{ marginBottom: 8 }}>Fehler beim Laden: {geoErr}</div>}
      {geoBusy && !geo && <div className="muted" style={{ padding: 12 }}>lädt…</div>}

      {/* Nur bei tatsaechlichem Problem einblenden - genau dann ist die Frage
          "warum kommt hier nichts an?" offen, und genau die beantwortet das Panel.
          UCDPs Skip-Meldung ("übersprungen: kein Zugangstoken") ist erwartetes
          Verhalten, kein Ausfall - loest das Panel deshalb nicht aus. */}
      {(geoErr
        || (geo?.ucdpError && !/übersprungen/.test(geo.ucdpError))) && (
        <DiagPanel diag={diag} diagBusy={diagBusy} diagErr={diagErr} runDiag={runDiag} />
      )}

      {sorted.length > 0 && <GeoWorldMap geo={geo} geoSel={geoSel} setGeoSel={setGeoSel} />}

      {sorted.length > 0 && (
        <div className="grid-auto grid-auto--sm" style={{ marginBottom: 8 }}>
          {sorted.map((c) => {
            const meta = geoLevelMeta(c.level); const on = geoSel === c.iso3;
            return (
              <div key={c.iso3} className="card" onClick={() => setGeoSel(on ? null : c.iso3)}
                style={{ borderColor: on ? meta.color : null, borderLeft: `4px solid ${meta.color}` }}>
                <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline", gap: 6 }}>
                  <span style={{ fontSize: "var(--fs-lg)" }}>{c.flag}</span>
                  <span style={{ fontSize: "var(--fs-2xs)", color: meta.color, fontWeight: 700, letterSpacing: 0.6 }}>{meta.label}</span>
                </div>
                <div style={{ color: C.white, fontSize: "var(--fs-sm)", marginTop: 4, whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }}>{c.name}</div>
                <div className="muted" style={{ marginTop: 3 }}>{c.gdeltCount} Meldungen{c.ucdpActive ? " · UCDP aktiv" : ""}</div>
              </div>
            );
          })}
        </div>
      )}
      {!geoBusy && geo && !sorted.length && <div className="empty">Keine Länderdaten verfügbar.</div>}

      {selCountry && (
        <Panel title={`${selCountry.flag} ${selCountry.name} · Details`} right={<span onClick={() => setGeoSel(null)} className="muted" style={{ cursor: "pointer" }}>× schließen</span>}>
          {selCountry.level === "nicht geprüft" && <div className="muted" style={{ marginBottom: 8 }}>Für dieses Land konnte innerhalb des Zeitbudgets keine GDELT-Abfrage abgeschlossen werden — bitte "AKTUALISIEREN" erneut versuchen.</div>}
          {selCountry.ucdpActive && (
            <div className="note note--warn" style={{ marginBottom: 10 }}>
              <div style={{ fontSize: "var(--fs-2xs)", letterSpacing: 1.2, marginBottom: 4, fontWeight: 700 }}>UCDP · KONFLIKTEREIGNIS ERFASST</div>

              {selCountry.ucdpDate && <div className="muted" style={{ marginTop: 4 }}>{selCountry.ucdpDate}</div>}
            </div>
          )}
          {selCountry.gdeltTrend?.length >= 2 && (<>
            <div style={{ color: C.orange, fontSize: "var(--fs-2xs)", letterSpacing: 1.2, marginBottom: 5, fontWeight: 700 }}>GDELT · TRENDVERLAUF (2 WOCHEN)</div>
            <GdeltTrendChart data={selCountry.gdeltTrend} />
            <div className="muted" style={{ marginTop: 4, marginBottom: 12 }}>Artikelvolumen zu Konflikt-Schlagwörtern je Zeitpunkt · {selCountry.gdeltTrend[0].date} – {selCountry.gdeltTrend[selCountry.gdeltTrend.length - 1].date}</div>
          </>)}
          <div style={{ color: C.orange, fontSize: "var(--fs-2xs)", letterSpacing: 1.2, marginBottom: 5, fontWeight: 700 }}>GDELT · JÜNGSTE MELDUNGEN ({selCountry.gdeltCount} insgesamt gefunden)</div>
          {selCountry.headlines?.length ? selCountry.headlines.map((h, i) => (
            <div key={i} style={{ padding: "7px 0", borderBottom: i < selCountry.headlines.length - 1 ? `1px solid ${C.line}` : "none" }}>
              <a href={h.url} target="_blank" rel="noreferrer" className="link" style={{ fontSize: "var(--fs-sm)" }}>{h.title}</a>
              <div className="muted" style={{ marginTop: 3 }}>{h.source}{h.date ? " · " + h.date : ""}</div>
            </div>
          )) : <div className="muted">Keine GDELT-Meldungen zu Konflikt-Schlagwörtern in den letzten 7 Tagen.</div>}
        </Panel>
      )}
    </div>
  );
}

  const loadDetail = async (e, fk = fhKey, tk = tdKey) => {

  // Kommandozeilen-Grammatik: "<TICKER/NAME> RATIO", "<TICKER/NAME> RATIO 5Y",

  const goCmd = async (q) => {
    const raw = (q ?? cmd).trim(); if (!raw) return; setCmd(""); setSuggestions([]);
    const tokens = raw.split(/\s+/); const upper = tokens.map((t) => t.toUpperCase());
    const ratioIdx = upper.indexOf("RATIO");

    if (ratioIdx > 0) {

      if (resolved) openRatio([resolved], upper[ratioIdx + 1] === "5Y" ? "series" : "single");
      return;
    }
    if (compsIdx > 0) {
      const queries = [tokens.slice(0, compsIdx).join(" "), ...tokens.slice(compsIdx + 1)].filter(Boolean);
      const resolvedAll = (await Promise.all(queries.map((t) => resolveSymbol(t)))).filter(Boolean);
      if (resolvedAll.length) openRatio(resolvedAll.slice(0, 6), "comps");

  useEffect(() => {

    suggestSeq.current += 1; const mySeq = suggestSeq.current;

      // BEDINGUNGSLOS setzen, auch wenn `local` leer ist. Mit einem

      setSuggestions(local);

      const net = await searchSymbol(q);
      if (mySeq !== suggestSeq.current) return; // veraltete Antwort - neuere Eingabe existiert bereits
      const merged = [...local, ...net.filter((h) => !local.find((l) => l.symbol === h.symbol))].slice(0, 8);
      setSuggestions(merged); setSuggestDone(true);
    }, 300);
    return () => clearTimeout(t);
  }, [cmd]);
  const connect = async () => {

  const [scan, setScan] = useState([]); const [scanning, setScanning] = useState(false);
  const [scProgress, setScProgress] = useState(null); // {done, total} waehrend des Scans
  const [scSec, setScSec] = useState("Alle"); const [scChg, setScChg] = useState(""); const [scSort, setScSort] = useState("chg"); const [scDir, setScDir] = useState(-1);
  const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
  // Wellenbasiert statt ein Promise.all ueber alle Symbole: Finnhubs kostenloser
  // Plan begrenzt auf ~60 Aufrufe/Minute. Mit der auf ~60 Werte erweiterten Liste
  // haette ein einzelner Promise.all fast das ganze Monatsbudget in einer Sekunde
  // verbraucht - Finnhub antwortet dann mit HTTP 429, was still zu price:null
  // gefangen wird und wie "Kurse falsch/aendern sich nicht" aussieht. Mit Wellen

  const SCAN_WAVE = 8, SCAN_WAVE_DELAY = 900;

        } catch { return { s: sym, name, sector: sec, price: null, chg: null, absChg: null }; }
      }));
      rows.push(...settled);
      setScProgress({ done: rows.length, total: US_UNIVERSE.length });
      if (i + SCAN_WAVE < US_UNIVERSE.length) await sleep(SCAN_WAVE_DELAY);
    }
    setScan(rows); setScanning(false); setScProgress(null);
  };
  // Schnellfilter: setzen nur die Sortierung, die Daten sind schon geladen.
  const scanPreset = (sort, dir) => { setScSort(sort); setScDir(dir); };
  const scanView = useMemo(() => { let r = scan.filter((x) => (scSec === "Alle" || x.sector === scSec) && (!scChg || (x.chg != null && x.chg >= +scChg))); r.sort((a, b) => ((a[scSort] ?? -9e9) > (b[scSort] ?? -9e9) ? scDir : (a[scSort] ?? -9e9) < (b[scSort] ?? -9e9) ? -scDir : 0)); return r; }, [scan, scSec, scChg, scSort, scDir]);
  const sectorHeat = useMemo(() => {
    const map = {};
    for (const r of scan) { if (r.chg == null) continue; if (!map[r.sector]) map[r.sector] = { sum: 0, n: 0 }; map[r.sector].sum += r.chg; map[r.sector].n++; }
    return Object.entries(map).map(([sector, v]) => ({ sector, avg: +(v.sum / v.n).toFixed(2), n: v.n })).sort((a, b) => b.avg - a.avg);
  }, [scan]);
  const heatColor = (v) => { const t = Math.max(-3, Math.min(3, v)) / 3; return t >= 0 ? `rgba(63,208,122,${0.12 + t * 0.5})` : `rgba(255,77,77,${0.12 + -t * 0.5})`; };

  /* News */
  const [nCat, setNCat] = useState("general"); const [nRows, setNRows] = useState([]); const [nBusy, setNBusy] = useState(false); const [nErr, setNErr] = useState("");

      setNRows(data.slice(0, 30).map((n) => ({ headline: n.headline, source: (n.source || "NEWS").toUpperCase().slice(0, 10), ago: Math.max(1, Math.floor((now - n.datetime * 1000) / 6e4)), summary: n.summary || "", url: n.url, tags: n.related ? n.related.split(",").slice(0, 3) : [] })));

  const genDigest = async () => { if (digBusy || !nRows.length) return;

  useEffect(() => { if (connected && tab === "news" && !nRows.length) loadNews(); }, [connected, tab]);

  /* Makro (FRED) */
  const [macro, setMacro] = useState({}); const [macroBusy, setMacroBusy] = useState(false); const [macroErr, setMacroErr] = useState("");

  /* F6 WELTLAGE: Geopolitische Risikoübersicht (UCDP + GDELT) */
  const [geo, setGeo] = useState(null); const [geoBusy, setGeoBusy] = useState(false); const [geoErr, setGeoErr] = useState("");

      setGeo(out);

    setGeoBusy(false);

  useEffect(() => { if (connected && tab === "geo" && !geo) loadGeo(); }, [connected, tab]);

  /* Diagnose: fragt jede externe Datenquelle einzeln ab und zeigt, was wirklich
     zurueckkommt. Hintergrund: In der Entwicklungsumgebung sind fred.stlouisfed.org,
     ucdpapi.pcr.uu.se und api.gdeltproject.org per Egress-Richtlinie gesperrt -
     Fehler wie "UCDP nicht erreichbar" lassen sich dort nicht nachstellen.

  const [diag, setDiag] = useState(null); const [diagBusy, setDiagBusy] = useState(false); const [diagErr, setDiagErr] = useState("");
  const runDiag = async () => {
    setDiagBusy(true); setDiagErr(""); setDiag(null);
    try {
      // Den FRED-Schluessel mitgeben: nur so kann die Diagnose beantworten, ob
      // der eingetragene Schluessel WIRKLICH funktioniert. Ohne ihn koennte sie
      // bloss melden, dass FRED ohne Schluessel ablehnt - was man auch vorher
      // schon wusste.
      const out = await jgetTimeout("/.netlify/functions/diag", 30000, fredKey ? { "X-FRED-Key": fredKey } : undefined);
      if (!out || !Array.isArray(out.proben)) throw new Error("Unerwartete Antwort vom Diagnose-Endpunkt");
      setDiag(out);
    } catch (e) { setDiagErr((e && e.message) || "Diagnose fehlgeschlagen"); }
    setDiagBusy(false);
  };

  /* F5 RATIO: Kennzahlen / Zeitreihe / Peer-Vergleich (COMPS) */
  const [ratioTickers, setRatioTickers] = useState([]); // [{s,y}, ...] - 1 Ticker (single/series) oder mehrere (comps)
  const [ratioData, setRatioData] = useState({}); // keyOf -> getDetail()-Ergebnis (inkl. fundamentals/isFinancial)
  const [ratioView, setRatioView] = useState("single"); // "single" | "series" | "comps"
  const [ratioBusy, setRatioBusy] = useState(false);
  const [ratioAddCmd, setRatioAddCmd] = useState("");
  const [chartCell, setChartCell] = useState(null); // { metric, colKey } - fuer Klick-auf-Zelle -> 5J-Chart
  const [dupontOpen, setDupontOpen] = useState(false);

  const loadRatioData = async (list) => {
    setRatioBusy(true);
    const out = {};
    await Promise.all(list.map(async (e) => {
      try { out[keyOf(e)] = await getDetail(e, fhKey); }
      catch (er) { out[keyOf(e)] = { s: e.s, error: er.message, fundamentals: [] }; }
    }));
    setRatioData((p) => ({ ...p, ...out }));
    setRatioBusy(false);
  };
  const openRatio = (list, view) => {
    setTab("ratio"); setRatioView(view); setRatioTickers(list); setChartCell(null);
    loadRatioData(list);
  };
  const addRatioPeer = async (q) => {
    const query = (q ?? ratioAddCmd).trim(); if (!query || ratioTickers.length >= 6) return; setRatioAddCmd("");
    const resolved = await resolveSymbol(query);
    if (resolved && !ratioTickers.find((x) => keyOf(x) === keyOf(resolved))) {
      const list = [...ratioTickers, resolved];
      setRatioTickers(list); setRatioView("comps"); loadRatioData([resolved]);
    }
  };
  const rmRatioPeer = (e) => setRatioTickers((p) => p.filter((x) => keyOf(x) !== keyOf(e)));

  /* Chart-Ableitungen memoisieren. Vorher standen sma()/rsi() direkt im JSX und
     liefen bei JEDEM Render ueber alle ~140 Punkte - zusammen mit dem alten
     Sekundentakt der Uhr also einmal pro Sekunde, obwohl sich die Kursreihe nur
     beim Laden aendert. */
  // Nur Eintraege mit echtem Kurs kommen ins Laufband (siehe Kommentar am Band).
  const idxTape = useMemo(() => INDEX_PRESETS.filter((e) => idxQ[e.s] && idxQ[e.s].chgPct != null), [idxQ]);
  const wlTape = useMemo(() => watch.filter((e) => wlQ[keyOf(e)] && wlQ[keyOf(e)].chgPct != null), [watch, wlQ]);

  const chartVals = useMemo(() => chart.series.map((s) => s.p), [chart.series]);
  // Veraenderung ueber den GEWAEHLTEN Zeitraum (erster vs. letzter Punkt der
  // geladenen Chart-Reihe). d.chgPct kommt dagegen direkt aus der Quote und ist
  // IMMER die Tagesveraenderung - blieb bisher beim Umschalten auf 1M/6M/1J
  // unveraendert stehen, obwohl der Chart einen ganz anderen Zeitraum zeigt.
  const periodChg = useMemo(() => {
    if (chartVals.length < 2) return null;
    const first = chartVals[0], last = chartVals[chartVals.length - 1];
    if (!first) return null;
    return { abs: +(last - first).toFixed(2), pct: +(((last - first) / first) * 100).toFixed(2) };
  }, [chartVals]);
  const chartRangeLabel = (CHART_RANGES.find(([r]) => r === chartRange) || [, chartRange])[1];
  const smaOverlays = useMemo(() => (
    showSMA && chartVals.length > 3
      ? [{ vals: sma(chartVals, 20), color: C.blue }, { vals: sma(chartVals, 50), color: C.amber }]
      : []
  ), [showSMA, chartVals]);
  const rsiVals = useMemo(() => (
    showRSI && chartVals.length > 3 ? rsi(chartVals, 14) : null
  ), [showRSI, chartVals]);

  // Kerzen brauchen Open/Hoch/Tief je Balken. Nicht jede Quelle liefert die:
  // Stooq schon, Finnhub-only-Werte nicht. Statt einer leeren Flaeche wird
  // deshalb geprueft, ob ueberhaupt genug vollstaendige Balken da sind - sonst
  // bleibt die Linie stehen und sagt warum.
  const hasOHLC = useMemo(() => {
    const s = chart.series || [];
    if (s.length < 3) return false;
    let voll = 0;
    for (let i = 0; i < s.length; i++) { if (s[i].o != null && s[i].h != null && s[i].l != null) voll++; }
    return voll >= Math.max(3, s.length * 0.5);
  }, [chart.series]);
  // Zusammenfassen erst ab zu vielen Balken - die Regel steckt in
  // indicators.js (groupSizeFor), damit sie testbar ist.
  const candleGroup = useMemo(
    () => groupSizeFor((chart.series || []).length, 160),
    [chart.series]);
  const candleSeries = useMemo(
    () => aggregateOHLC(chart.series || [], candleGroup),
    [chart.series, candleGroup]);

  if (!booted) return <div style={{ minHeight: "100dvh", color: C.amber, display: "flex", alignItems: "center", justifyContent: "center" }}>lädt…</div>;

  if (!connected) return (
    <div style={{ minHeight: "100dvh", display: "flex", alignItems: "center", justifyContent: "center", padding: "var(--sp-5)" }}>

        <div style={{ background: "#000", borderBottom: `1px solid ${C.amberDim}`, padding: "12px 16px", color: C.orange, fontWeight: 700, letterSpacing: 2, fontSize: "var(--fs-md)" }}>◈ TERMINAL — LOGIN</div>
        <div style={{ padding: "var(--sp-5)", lineHeight: 1.6, fontSize: "var(--fs-md)" }}>

          <div style={{ marginBottom: 14 }}>
            <div style={{ color: C.amber, fontSize: "var(--fs-xs)", marginBottom: 5 }}>1 · FINNHUB-KEY <span className="muted">(Pflicht · US-Kurse, Empfehlungen, News)</span></div>
            <input className="field" style={{ width: "100%" }} type="password" value={fhIn} onChange={(e) => setFhIn(e.target.value)} placeholder="finnhub.io – Gratis-Key" />
          </div>
          <div style={{ marginBottom: 14 }}>
            <div style={{ color: C.amber, fontSize: "var(--fs-xs)", marginBottom: 5 }}>2 · TWELVE-DATA-KEY <span className="muted">(empfohlen · für den Kursverlauf/Chart)</span></div>
            <input className="field" style={{ width: "100%" }} type="password" value={tdIn} onChange={(e) => setTdIn(e.target.value)} placeholder="twelvedata.com – Gratis-Key" />
          </div>
          <div style={{ marginBottom: 14 }}>
            <div style={{ color: C.amber, fontSize: "var(--fs-xs)", marginBottom: 5 }}>3 · GROQ-KEY <span className="muted">(optional · KI-Analyst)</span></div>
            <input className="field" style={{ width: "100%" }} type="password" value={groqIn} onChange={(e) => setGmIn(e.target.value)} placeholder="console.groq.com – Gratis-Key (keine Kreditkarte)" />
          </div>
          <div style={{ marginBottom: 16 }}>
            <div style={{ color: C.amber, fontSize: "var(--fs-xs)", marginBottom: 5 }}>4 · FRED-KEY <span className="muted">(optional · F4 MAKRO, Konjunkturdaten)</span></div>
            <input className="field" style={{ width: "100%" }} type="password" value={fredIn} onChange={(e) => setFredIn(e.target.value)} onKeyDown={(e) => e.key === "Enter" && connect()} placeholder="fredaccount.stlouisfed.org/apikey – Gratis-Key" />
            <div className="muted" style={{ marginTop: 4, fontSize: "var(--fs-2xs)" }}>
              FRED verlangt seit November 2025 einen Schlüssel. Leer lassen, wenn auf dem Server bereits <span style={{ color: C.amber }}>FRED_API_KEY</span> hinterlegt ist – dann gilt der.
            </div>
          </div>
          <button className="btn btn--solid btn--block" onClick={connect} disabled={connecting}>{connecting ? "VERBINDE…" : "▶ VERBINDEN"}</button>
          {connErr && <div className="note note--err" style={{ marginTop: 10 }}>{connErr}</div>}
        </div>
      </div>
    </div>
  );

  const d = detail || { s: active.s, name: "", recos: [], news: [] };
  const up = (d.chg ?? 0) >= 0; const cur = CUR[d.currency] || d.currency || "";
  const Fkey = (label, k, col) => <button onClick={() => setTab(k)} className="btn" style={tab === k ? { background: col, color: "#000", borderColor: col, fontWeight: 700 } : { color: col, borderColor: col, fontWeight: 700 }}>{label}</button>;
  const Th = ({ k, label, a }) => <th onClick={() => { setScSort(k); setScDir(scSort === k ? -scDir : -1); }} className={a === "right" ? "num" : null} style={{ color: scSort === k ? C.orange : null, cursor: "pointer" }}>{label}{scSort === k ? (scDir === -1 ? " ▼" : " ▲") : ""}</th>;

  const WL = (
    <Panel title="WATCHLIST" style={{ height: "100%" }}>
      {watch.map((e) => { const q = wlQ[keyOf(e)]; const on = keyOf(e) === keyOf(active); const u = (q?.chgPct ?? 0) >= 0;
        return <div key={keyOf(e)} onClick={() => loadDetail(e)} className={"wl-row" + (on ? " wl-row--on" : "")}>
          <span style={{ color: on ? C.orange : C.white, fontSize: "var(--fs-sm)" }}>{e.s}</span>

          <span style={{ fontSize: "var(--fs-xs)", color: u ? C.green : C.red }}>{q?.chgPct != null ? (u ? "+" : "") + q.chgPct + "%" : ""}</span>
          <span onClick={(ev) => { ev.stopPropagation(); rmWatch(e); }} style={{ color: C.muted, fontSize: "var(--fs-sm)", cursor: "pointer", padding: "0 4px" }}>×</span>
        </div>; })}
      {watch.length === 0 && <div className="muted">Leer.</div>}
    </Panel>
  );

  return (
    <div style={{ minHeight: "100dvh" }}>
      <div className="topbar">
        <span className="brand">◈ TERMINAL</span>
        <div className="cmdbox">
          <div className="cmdbox__in">
            <span style={{ color: C.orange }}>{">"}</span>
            <input className="field field--cmd" value={cmd} onChange={(e) => setCmd(e.target.value)} onKeyDown={(e) => e.key === "Enter" && goCmd()} onBlur={() => setTimeout(() => setSuggestions([]), 150)} placeholder="TICKER + GO, oder AAPL RATIO / AAPL COMPS MSFT" />
            <span className="caret" style={{ color: C.orange }}>▊</span>
          </div>
          {cmd.trim().length >= SUGGEST_MIN && (
            <div className="suggest">
              {suggestions.length === 0 && !suggestDone && <div className="muted" style={{ padding: "9px 10px" }}>sucht…</div>}
              {suggestions.length === 0 && suggestDone && <div className="muted" style={{ padding: "9px 10px" }}>Keine Treffer für "{cmd.trim()}".</div>}
              {suggestions.map((s, i) => (
                <div key={s.symbol + i} onMouseDown={() => selectSuggestion(s)} className="suggest__row">
                  <span style={{ color: C.white, fontSize: "var(--fs-sm)" }}>{s.name}</span>
                  <span className="muted" style={{ whiteSpace: "nowrap" }}>{s.symbol}{s.exchange ? " · " + s.exchange : ""}</span>
                </div>

            </div>
          )}
        </div>
        <span style={{ color: C.green, fontSize: "var(--fs-xs)", whiteSpace: "nowrap" }}>● WELT{groqKey ? " · AI" : ""}</span>
        <Clock />
        <span onClick={disconnect} className="btn" style={{ fontSize: "var(--fs-2xs)" }}>LOGOUT</span>
      </div>
      <div className="fbar">
        {Fkey("F1 MARKT", "markt", C.amber)}{Fkey("F2 SCANNER", "scanner", C.green)}{Fkey("F3 NEWS", "news", C.red)}{Fkey("F4 MAKRO", "makro", C.blue)}{Fkey("F5 RATIO", "ratio", C.violet)}{Fkey("F6 WELTLAGE", "geo", "#ff6b6b")}{Fkey("F7 MONTE CARLO", "mc", C.orange)}
        <span className="stat__k" style={{ marginLeft: 6 }}>EU:</span>
        {EU_PRESETS.slice(0, 8).map((p) => <button key={p.y} onClick={() => loadDetail(p)} title={p.label} className="btn" style={{ color: C.blue }}>{p.s}</button>)}
        <span className="stat__k" style={{ marginLeft: 6 }}>ASIA:</span>
        {ASIA_PRESETS.map((p) => <button key={p.y} onClick={() => loadDetail(p)} title={p.label} className="btn" style={{ color: C.blue }}>{p.label}</button>)}
      </div>
      {/* Nur zeigen, wenn wirklich ein Kurs drinsteht. Vorher reichte es, dass die

      {idxTape.length > 0 && (
        <div className="tape-wrap tape-wrap--idx">
          <div className="tape">{[...idxTape, ...idxTape].map((e, i) => { const q = idxQ[e.s]; const u = q.chgPct >= 0; return <span key={i} className="tape__item"><span style={{ color: C.blue }}>{e.label}</span> <span style={{ color: C.white }}>{q.price}</span> <span style={{ color: u ? C.green : C.red }}>{u ? "▲" : "▼"}{q.chgPct}%</span></span>; })}</div>
        </div>
      )}
      {wlTape.length > 0 && (
        <div className="tape-wrap tape-wrap--wl">
          <div className="tape">{[...wlTape, ...wlTape].map((e, i) => { const q = wlQ[keyOf(e)]; const u = q.chgPct >= 0; return <span key={i} className="tape__item"><span style={{ color: C.orange }}>{e.s}</span> <span style={{ color: C.white }}>{q.price}</span> <span style={{ color: u ? C.green : C.red }}>{u ? "▲" : "▼"}{q.chgPct}%</span></span>; })}</div>
        </div>
      )}

      {tab === "markt" && (
        <div className="layout page">
          {wide && <div>{WL}</div>}
          <div>
            <Panel style={{ marginBottom: 8 }}>
              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-end", flexWrap: "wrap", gap: 10 }}>
                <div style={{ minWidth: 0 }}>
                  <div style={{ color: C.orange, fontSize: "var(--fs-xl)", fontWeight: 700, letterSpacing: 0.5 }}>{d.s} <span className="muted" style={{ fontWeight: 400 }}>{d.name}</span></div>
                  <div className="muted" style={{ marginTop: 2 }}>{d.sector}{d.region === "US" ? " · US" : ""} {dLoad ? "· lädt…" : ""}</div>
                </div>
                <div style={{ display: "flex", alignItems: "flex-end", gap: 12 }}>
                  {d.price != null && <div style={{ textAlign: "right" }}>
                    <div style={{ fontSize: "var(--fs-hero)", color: up ? C.green : C.red, fontWeight: 700, lineHeight: 1.1 }}>{d.price} <span className="muted" style={{ fontWeight: 400 }}>{cur}</span></div>
                    <div style={{ fontSize: "var(--fs-md)", color: up ? C.green : C.red }}>{up ? "▲ +" : "▼ "}{d.chg} ({up ? "+" : ""}{d.chgPct}%) <span className="muted" style={{ fontSize: "var(--fs-2xs)" }}>HEUTE</span></div>
                    {d.currency && d.currency !== "EUR" && fxRates[d.currency] != null && <div className="muted" style={{ marginTop: 2 }}>≈ {(d.price * fxRates[d.currency]).toFixed(2)} €</div>}
                  </div>}
                  <button className="btn btn--ghost" onClick={() => addWatch({ s: d.s, y: active.y })}>+WL</button>
                </div>
              </div>
              {d.error && <div className="note note--err" style={{ marginTop: 10 }}>Fehler: {d.error} — Ticker/Börse prüfen.</div>}
              {d.partial && <div className="note note--warn" style={{ marginTop: 10 }}>⚠ {d.partial}</div>}
            </Panel>

            <Panel
              title={<>CHART · {d.s}{periodChg && (
                <span style={{ color: periodChg.pct >= 0 ? C.green : C.red, marginLeft: 8 }}>
                  {periodChg.pct >= 0 ? "▲ +" : "▼ "}{periodChg.pct}% <span className="muted" style={{ fontSize: "var(--fs-2xs)" }}>({chartRangeLabel})</span>
                </span>
              )}</>}
              right={<div style={{ display: "flex", gap: 3 }}>{CHART_RANGES.map(([r, l]) => <button key={r} onClick={() => changeChartRange(r)} className={"btn" + (chartRange === r ? " btn--on" : "")}>{l}</button>)}</div>}
              style={{ marginBottom: 8 }}>
              {chart.ok && chart.series.length > 3 ? (<>
                <div style={{ display: "flex", gap: 4, marginBottom: 8, flexWrap: "wrap" }}>
                  <button onClick={() => setChartMode((v) => (v === "line" ? "candle" : "line"))} className={"btn btn--tog" + (chartMode === "candle" ? " btn--on" : "")}>
                    {chartMode === "candle" ? "KERZEN" : "LINIE"}
                  </button>
                  <button onClick={() => setShowSMA((v) => !v)} className={"btn btn--tog" + (showSMA ? " btn--on" : "")}>SMA 20/50</button>
                  <button onClick={() => setShowVol((v) => !v)} className={"btn btn--tog" + (showVol ? " btn--on" : "")}>VOL</button>
                  <button onClick={() => setShowRSI((v) => !v)} className={"btn btn--tog" + (showRSI ? " btn--on" : "")}>RSI(14)</button>
                </div>
                {chartMode === "candle" && !hasOHLC && (
                  <div className="note note--warn" style={{ marginBottom: 8 }}>
                    Für diesen Ticker liefert die Quelle keine Open/Hoch/Tief-Werte — Kerzen sind hier nicht möglich, deshalb weiter als Linie.
                  </div>
                )}
                {chartMode === "candle" && hasOHLC
                  ? <CandleChart series={candleSeries} />
                  : <SvgChart series={chart.series} up={up} overlays={smaOverlays} />}
                {chartMode === "candle" && hasOHLC && candleGroup > 1 && (
                  <div className="muted" style={{ marginTop: 4 }}>
                    Je {candleGroup} Handelstage zu einer Kerze zusammengefasst ({candleSeries.length} von {chart.series.length} Balken) — sonst wäre jede Kerze unter einem Pixel breit.
                  </div>
                )}
                {showVol && <VolumeChart series={chartMode === "candle" && hasOHLC ? candleSeries : chart.series} />}
                {showRSI && rsiVals && <RSIChart vals={rsiVals} />}
              </>) : <div className="muted" style={{ padding: "8px 0" }}>Chart lädt / für diesen Ticker nicht verfügbar.</div>}
              <DayRange d={d} />
            </Panel>

            <div className="grid-pair" style={{ marginBottom: 8 }}>
              <Panel title="KENNZAHLEN">
                <Stat k="OPEN" v={d.open ?? "—"} /><Stat k="HOCH" v={d.high ?? "—"} color={C.green} /><Stat k="TIEF" v={d.low ?? "—"} color={C.red} /><Stat k="VORTAG" v={d.prevClose ?? "—"} /><Stat k="WÄHRUNG" v={d.currency || "—"} /><Stat k="MKT CAP" v={fmtCap(d.mktcap)} />
                <Stat k="52W HOCH" v={d.week52High ?? "—"} color={C.green} /><Stat k="52W TIEF" v={d.week52Low ?? "—"} color={C.red} />
                <Stat k="VOLUMEN" v={fmtVol(d.volume)} /><Stat k="Ø VOLUMEN" v={fmtVol(d.avgVolume)} /><Stat k="BETA" v={d.beta ?? "—"} />
                <Stat k="KGV" v={d.pe ?? "—"} /><Stat k="EPS" v={d.eps ?? "—"} /><Stat k="DIV.-RENDITE" v={d.divYield != null ? d.divYield + "%" : "—"} />
                <Stat k="KURSZIEL" v={d.target ?? "—"} /><Stat k="NÄCHSTE ZAHLEN" v={d.earningsDate || "—"} />
              </Panel>
              <Panel title="ANALYSTEN-EMPFEHLUNG"><RecoBar recos={d.recos} /></Panel>
            </div>
            {d.financials?.length > 1 && (
              <Panel title="UMSATZ & GEWINN (JÄHRLICH)" style={{ marginBottom: 8 }}>
                <div style={{ display: "flex", gap: 14, marginBottom: 6 }} className="muted">
                  <span><span style={{ color: C.blue }}>■</span> Umsatz</span>
                  <span><span style={{ color: C.green }}>■</span> Gewinn</span>
                </div>
                <FinancialsChart data={d.financials} />
              </Panel>
            )}
            <Panel title={`NEWS · ${d.s}`} style={{ marginBottom: 8 }}><NewsList items={d.news} onTag={loadDetail} /></Panel>
            {!wide && <div>{WL}</div>}
          </div>

          <Panel title="◆ AI-ANALYST" right={<span className="stat__k">Groq</span>}>
            <div style={{ display: "flex", flexDirection: "column", minHeight: 340 }}>
              <div style={{ display: "flex", gap: 4, flexWrap: "wrap", marginBottom: 8 }}>{["Zusammenfassung", "Chart deuten", "Bull vs. Bear"].map((c) => <button key={c} onClick={() => askAI(`${c} für ${d.s}`)} disabled={aiBusy} className="btn btn--ghost">{c}</button>)}</div>
              <div style={{ flex: 1, overflowY: "auto", fontSize: "var(--fs-sm)", lineHeight: 1.55, minHeight: 180, maxHeight: 340 }}>
                {msgs.length === 0 && <div className="muted">Frag zu {d.s}. Analyse, keine Anlageberatung.{!groqKey && " (Groq-Key im Login nötig)"}</div>}
                {msgs.map((m, i) => <div key={i} style={{ marginBottom: 10 }}><div style={{ color: m.role === "user" ? C.blue : C.orange, fontSize: "var(--fs-2xs)", letterSpacing: 0.8, marginBottom: 3 }}>{m.role === "user" ? "YOU" : "ANALYST"}</div><div style={{ whiteSpace: "pre-wrap" }}>{m.content}</div></div>)}
                {aiBusy && <div style={{ color: C.orange }}>▍analysiere…</div>}<div ref={chatEnd} />
              </div>
              <div style={{ display: "flex", gap: 6, marginTop: 10 }}>
                <input className="field" value={aiIn} onChange={(e) => setAiIn(e.target.value)} onKeyDown={(e) => e.key === "Enter" && askAI()} placeholder="Frage…" style={{ flex: 1, minWidth: 0 }} />
                <button className="btn btn--solid" onClick={() => askAI()} disabled={aiBusy} style={{ padding: "0 14px" }}>➤</button>
              </div>
            </div>
          </Panel>
        </div>
      )}

      {tab === "scanner" && (
        <div className="page">
          <div className="panel" style={{ display: "flex", gap: 10, alignItems: "flex-end", flexWrap: "wrap", padding: 12, marginBottom: 8 }}>
            <div style={{ display: "flex", flexDirection: "column", gap: 4 }}><span className="stat__k">SEKTOR</span><select className="field" value={scSec} onChange={(e) => setScSec(e.target.value)}>{SECTORS.map((s) => <option key={s} style={{ background: C.panel }}>{s}</option>)}</select></div>
            <div style={{ display: "flex", flexDirection: "column", gap: 4 }}><span className="stat__k">%CHG MIN</span><input className="field" value={scChg} onChange={(e) => setScChg(e.target.value)} placeholder="-99" style={{ width: 100 }} /></div>
            <button className="btn btn--go" onClick={runScan} disabled={scanning}>{scanning ? `SCANNE… (${scProgress ? scProgress.done : 0}/${scProgress ? scProgress.total : US_UNIVERSE.length})` : "▶ MARKT SCANNEN"}</button>
            <span className="muted">{scan.length ? scanView.length + " Treffer" : `US-Werte · ${US_UNIVERSE.length} Aufrufe`}</span>
          </div>
          {scan.length > 0 && (
            <div className="toolbar">
              <span className="stat__k">SCHNELLFILTER:</span>
              <button className="btn btn--tog" onClick={() => scanPreset("chg", -1)}>▲ TOP GEWINNER</button>
              <button className="btn btn--tog" onClick={() => scanPreset("chg", 1)}>▼ TOP VERLIERER</button>
              <button className="btn btn--tog" onClick={() => scanPreset("absChg", -1)}>◆ GRÖSSTE BEWEGUNG</button>
            </div>
          )}
          {sectorHeat.length > 0 && (
            <div className="grid-auto grid-auto--sm" style={{ marginBottom: 8 }}>
              {sectorHeat.map((s) => (
                <div key={s.sector} onClick={() => setScSec(s.sector)} title="Nach Sektor filtern" className="card" style={{ background: heatColor(s.avg), textAlign: "center" }}>
                  <div style={{ fontSize: "var(--fs-xs)", color: C.white, marginBottom: 5 }}>{s.sector}</div>
                  <div style={{ fontSize: "var(--fs-lg)", fontWeight: 700, color: s.avg >= 0 ? C.green : C.red }}>{s.avg >= 0 ? "+" : ""}{s.avg}%</div>
                  <div className="stat__k">{s.n} Werte</div>
                </div>
              ))}
            </div>
          )}
          <div className="tbl-wrap">
            <table className="tbl tbl--zebra tbl--rows">
              <thead><tr><Th k="s" label="SYM" /><Th k="name" label="NAME" /><Th k="sector" label="SEKTOR" /><Th k="price" label="PREIS" a="right" /><Th k="chg" label="%CHG" a="right" /></tr></thead>
              <tbody>{scanView.map((x) => <tr key={x.s} onClick={() => loadDetail({ s: x.s, m: "US" })}><td style={{ color: C.orange }}>{x.s}</td><td style={{ whiteSpace: "nowrap" }}>{x.name}</td><td style={{ color: C.blue }}>{x.sector}</td><td className="num">{x.price ?? "—"}</td><td className="num" style={{ color: (x.chg ?? 0) >= 0 ? C.green : C.red }}>{x.chg == null ? "—" : (x.chg >= 0 ? "+" : "") + x.chg + "%"}</td></tr>)}</tbody>
            </table>
            {!scan.length && <div className="empty" style={{ border: "none" }}>„MARKT SCANNEN" holt Live-Kurse. EU-Werte einzeln über Kommandozeile/Presets laden.</div>}
          </div>
        </div>
      )}

      {tab === "news" && (
        <div className="page">
          <div className="note note--warn" style={{ marginBottom: 8 }}>⚠ Information &amp; Analyse – KEINE Anlageberatung.</div>
          <div className="toolbar">
            {[["general", "MARKT"], ["crypto", "KRYPTO"], ["merger", "M&A"], ["forex", "FOREX"]].map(([k, l]) => <button key={k} onClick={() => { setNCat(k); loadNews(k); }} className={"btn" + (nCat === k ? " btn--on" : "")}>{l}</button>)}
            <div className="spacer" /><button className="btn btn--ghost" onClick={() => loadNews()} disabled={nBusy}>{nBusy ? "…" : "↻ AKTUALISIEREN"}</button>
          </div>
          {nErr && <div className="note note--err" style={{ marginBottom: 8 }}>{nErr}</div>}
          <div className="panel" style={{ borderColor: C.amberDim, padding: 12, marginBottom: 8 }}>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", gap: 8, flexWrap: "wrap", marginBottom: digest || digBusy ? 10 : 0 }}>
              <span style={{ color: C.orange, fontSize: "var(--fs-xs)", letterSpacing: 1.2, fontWeight: 700 }}>◆ KI-EINORDNUNG</span>
              <button className="btn btn--ghost" onClick={genDigest} disabled={digBusy || !nRows.length}>{digBusy ? "analysiere…" : "Einordnung generieren"}</button>
            </div>
            {digest && <div style={{ fontSize: "var(--fs-md)", lineHeight: 1.6, whiteSpace: "pre-wrap" }}>{digest}</div>}
          </div>
          <div className="panel" style={{ padding: "2px 12px" }}><NewsList items={nRows} onTag={loadDetail} /></div>
        </div>
      )}

      {tab === "makro" && (
        <div className="page">
          <div className="toolbar">
            <span className="muted">Konjunkturdaten USA + Euro-Raum · Quelle: FRED (St. Louis Fed, spiegelt auch Eurostat-/EZB-Reihen)</span>
            <div className="spacer" />
            <button className="btn btn--ghost" onClick={loadMacro} disabled={macroBusy}>{macroBusy ? "…" : "↻ AKTUALISIEREN"}</button>
          </div>
          {macroErr && <div className="note note--err" style={{ marginBottom: 8 }}>Fehler beim Laden der Makrodaten: {macroErr}</div>}
          {/* Diagnose nur einblenden, wenn es tatsaechlich klemmt - im Normalbetrieb
              soll das Panel den Blick auf die Daten nicht verstellen. */}
          {(macroErr || Object.values(macro).some((m) => m && m.error)) && (
            <DiagPanel diag={diag} diagBusy={diagBusy} diagErr={diagErr} runDiag={runDiag} />
          )}
          <MacroGroup title="USA" presets={US_MACRO_PRESETS} macro={macro} macroBusy={macroBusy} />
          <MacroGroup title="EURO-RAUM" presets={EURO_MACRO_PRESETS} macro={macro} macroBusy={macroBusy} />
        </div>
      )}

      {tab === "ratio" && (
        <div className="page">
          {(typeof window.Ratios === "undefined" || typeof window.Peers === "undefined") ? (
            <div className="note note--err">
              Kennzahlen-Modul (ratios.js/peers.js) konnte nicht geladen werden.
            </div>
          ) : (
            <RatioPanel
              ratioTickers={ratioTickers} ratioData={ratioData} ratioView={ratioView} ratioBusy={ratioBusy}
              ratioAddCmd={ratioAddCmd} setRatioAddCmd={setRatioAddCmd} addRatioPeer={addRatioPeer} rmRatioPeer={rmRatioPeer}
              openRatio={openRatio} loadDetail={loadDetail} chartCell={chartCell} setChartCell={setChartCell}
              dupontOpen={dupontOpen} setDupontOpen={setDupontOpen}
            />
          )}
        </div>
      )}

      {tab === "mc" && <MonteCarloPanel d={d} />}

      {tab === "geo" && <GeoPanel geo={geo} geoBusy={geoBusy} geoErr={geoErr} geoSel={geoSel} setGeoSel={setGeoSel} loadGeo={loadGeo}
        diag={diag} diagBusy={diagBusy} diagErr={diagErr} runDiag={runDiag} />}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>

<script>
  (function(){
    function fail(m){ window.__err(m); var b=document.getElementById('boot'); if(b) b.textContent='◈ TERMINAL — Start fehlgeschlagen (siehe Fehler unten).'; }
    if (typeof React==='undefined' || typeof ReactDOM==='undefined') { fail('React konnte nicht geladen werden (CDN blockiert?). Ohne Internet/mit Content-Blocker startet die App nicht.'); return; }
    if (typeof Babel==='undefined') { fail('Babel (Compiler) konnte nicht geladen werden (CDN blockiert?).'); return; }
    try {
      var src = document.getElementById('app-src').textContent;
      var out = Babel.transform(src, { presets: ['react'] }).code;
      (0, eval)(out);
    } catch(e){ fail((e && e.stack) || (e && e.message) || String(e)); }
  })();
</script>
</body>
</html>
