<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="color-scheme" content="dark" />
<title>Terminal</title>
<style>
/* ============================================================================
   DESIGN-TOKENS
   Einzige Stelle, an der Farben, Schriftgroessen und Abstaende definiert sind.
   Die Farbwerte sind mit theme.js (Konstante C) gespiegelt - dort werden sie
   fuer die SVG-Charts gebraucht, wo CSS-Variablen nicht greifen. Beide Stellen
   muessen zusammen gepflegt werden.
   ========================================================================= */
:root{
  /* Flaechen: vier Ebenen statt vorher zwei, damit sich Panel, Panelkopf und
     Tabellenzeilen sichtbar voneinander abheben. */
  --bg:#000000;
  --surface:#0b0c0e;
  --surface-2:#07080a;
  --surface-3:#121316;
  --surface-4:#17191d;

  --line:#24262b;
  --line-strong:#34373d;

  --accent:#ff8a1e;
  --accent-2:#ffb000;
  --accent-dim:#7a5416;
  --accent-bg:#17140a;

  --up:#3fd07a;
  --down:#ff5252;
  --info:#4ea3ff;
  --violet:#c07af0;

  /* Vordergrund: --fg-3 ist bewusst heller als vorher (#7f858f), weil die
     kleinen Beschriftungen darin auf schwarzem Grund kaum lesbar waren. */
  --fg:#e8e9ec;
  --fg-2:#c9cbd0;
  --fg-3:#8f959f;

  /* Typo-Skala. Vorher gab es 13 willkuerliche Groessen von 8.5px bis 25px;
     jetzt sieben Stufen, die konsequent benutzt werden. */
  --fs-2xs:10px;
  --fs-xs:11px;
  --fs-sm:12px;
  --fs-md:13px;
  --fs-lg:15px;
  --fs-xl:19px;
  --fs-hero:26px;

  --sp-1:4px; --sp-2:6px; --sp-3:8px; --sp-4:12px; --sp-5:16px; --sp-6:24px;

  --mono:ui-monospace,'SF Mono','DejaVu Sans Mono',Menlo,monospace;
  --tap:26px;          /* Mindesthoehe klickbarer Elemente */
  --dur:120ms;
}

/* Handy: eine Stufe groesser und groessere Tap-Ziele. Die alten 8.5-10px
   waren auf einem 360px-Display praktisch nicht lesbar. */
@media (max-width:700px){
  :root{
    --fs-2xs:11px; --fs-xs:12px; --fs-sm:13px; --fs-md:14px;
    --fs-lg:16px; --fs-xl:20px; --fs-hero:30px;
    --tap:34px;
    --sp-3:10px; --sp-4:14px;
  }
}

*{box-sizing:border-box;}
html,body{
  margin:0; padding:0;
  background:var(--bg); color:var(--fg-2);
  font-family:var(--mono);
  /* 100dvh statt 100vh: auf Mobil zaehlt vh die ein-/ausblendende Adressleiste
     mit, wodurch das Layout beim Scrollen springt. */
  min-height:100vh; min-height:100dvh;
  -webkit-text-size-adjust:100%;
}
/* Zahlen mit fester Zeichenbreite - sonst "zappeln" Kurse bei jedem Tick,
   weil eine 1 schmaler ist als eine 8. Fuer ein Terminal essenziell. */
body{font-variant-numeric:tabular-nums;}

::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-track{background:var(--surface-2)}
::-webkit-scrollbar-thumb{background:var(--line-strong)}
::-webkit-scrollbar-thumb:hover{background:var(--fg-3)}

/* Sichtbarer Fokus fuer Tastaturbedienung - vorher war outline pauschal
   abgeschaltet, ohne Ersatz. */
:focus-visible{outline:2px solid var(--accent-2); outline-offset:1px;}

@keyframes tape{from{transform:translateX(0)}to{transform:translateX(-50%)}}
@keyframes blink{50%{opacity:0}}
.tape{animation:tape 46s linear infinite;white-space:nowrap;display:inline-block}
.tape-wrap:hover .tape{animation-play-state:paused}
.caret{animation:blink 1.1s step-end infinite}
/* Nutzer, die reduzierte Bewegung eingestellt haben, bekommen keine
   Dauerlaufschrift - die beiden Baender zeichnen sonst permanent neu. */
@media (prefers-reduced-motion:reduce){
  .tape{animation:none}
  .caret{animation:none}
  *{transition:none !important}
}

#boot{padding:var(--sp-6);font-size:var(--fs-lg);color:var(--accent-2);line-height:1.6}
#err{display:none;white-space:pre-wrap;padding:var(--sp-5);margin:var(--sp-4);
     border:1px solid var(--down);border-left:3px solid var(--down);
     color:#ff9c9c;font-size:var(--fs-sm);background:#140505;line-height:1.5}

/* ============================================================================
   BAUSTEINE
   ========================================================================= */

/* --- Panel ---------------------------------------------------------------- */
.panel{background:var(--surface);border:1px solid var(--line);}
.panel__hd{
  display:flex;justify-content:space-between;align-items:center;gap:var(--sp-3);
  padding:var(--sp-2) var(--sp-3);
  background:var(--surface-2);
  border-bottom:1px solid var(--line);
  /* Schmaler Akzentstreifen links - gibt jedem Panel eine klare Kante,
     ohne dass ein zweiter Rahmen noetig ist. */
  box-shadow:inset 2px 0 0 var(--accent-dim);
}
.panel__title{
  color:var(--accent);font-size:var(--fs-2xs);font-weight:700;
  letter-spacing:1.4px;text-transform:uppercase;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis;
}
.panel__bd{padding:var(--sp-3);}

/* --- Kennzahlen-Zeile ----------------------------------------------------- */
.stat{
  display:flex;justify-content:space-between;align-items:baseline;gap:var(--sp-3);
  padding:var(--sp-1) 0;border-bottom:1px solid var(--line);
}
.stat:last-child{border-bottom:none;}
.stat__k{color:var(--fg-3);font-size:var(--fs-2xs);letter-spacing:.4px;}
.stat__v{color:var(--fg);font-size:var(--fs-sm);text-align:right;}

/* --- Buttons -------------------------------------------------------------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;
  min-height:var(--tap);
  background:transparent;color:var(--fg-3);
  border:1px solid var(--line);
  font-family:var(--mono);font-size:var(--fs-2xs);
  padding:var(--sp-1) var(--sp-3);
  cursor:pointer;white-space:nowrap;
  transition:background var(--dur),color var(--dur),border-color var(--dur);
}
.btn:hover:not(:disabled){border-color:var(--accent-dim);color:var(--accent-2);}
.btn:disabled{opacity:.45;cursor:default;}
.btn--on{background:var(--accent-2);color:#000;border-color:var(--accent-2);font-weight:700;}
.btn--on:hover:not(:disabled){color:#000;}
/* Ein-/Ausschalter fuer Chart-Indikatoren: aktiv, aber bewusst leiser als die
   Zeitraum-Auswahl - sonst konkurrieren fuenf gleich laute Elemente ueber dem
   Chart um die Aufmerksamkeit. */
.btn--tog.btn--on{background:var(--accent-bg);color:var(--accent-2);border-color:var(--accent-dim);}
.btn--tog.btn--on:hover:not(:disabled){color:var(--accent-2);}
.btn--ghost{color:var(--accent-2);border-color:var(--accent-dim);}
.btn--solid{background:var(--accent);color:#000;border-color:var(--accent);font-weight:700;font-size:var(--fs-xs);}
.btn--solid:hover:not(:disabled){background:var(--accent-2);color:#000;}
.btn--go{background:var(--up);color:#000;border-color:var(--up);font-weight:700;font-size:var(--fs-sm);padding:var(--sp-2) var(--sp-5);}
.btn--block{width:100%;padding:var(--sp-3);font-size:var(--fs-md);}

/* --- Eingabefelder -------------------------------------------------------- */
.field{
  background:var(--surface-2);border:1px solid var(--line);
  color:var(--fg);font-family:var(--mono);
  /* 16px auf Mobil verhindert, dass iOS beim Antippen ins Feld hineinzoomt. */
  font-size:var(--fs-sm);
  padding:var(--sp-2) var(--sp-3);min-height:var(--tap);outline:none;
}
.field:focus{border-color:var(--accent-dim);}
.field::placeholder{color:var(--fg-3);opacity:.75;}
@media (max-width:700px){ .field, .field--cmd{font-size:16px;} }

/* --- Hinweisboxen --------------------------------------------------------- */
.note{
  padding:var(--sp-2) var(--sp-4);font-size:var(--fs-xs);line-height:1.5;
  border:1px solid var(--line);border-left:3px solid var(--line-strong);
  background:var(--surface-2);color:var(--fg-3);
}
.note--warn{background:var(--accent-bg);border-color:var(--accent-dim);border-left-color:var(--accent-2);color:var(--accent-2);}
.note--err{background:#140505;border-color:var(--down);border-left-color:var(--down);color:#ff9c9c;}
.note--info{border-left-color:var(--info);}

/* --- Tabellen ------------------------------------------------------------- */
.tbl-wrap{background:var(--surface);border:1px solid var(--line);overflow-x:auto;}
.tbl{width:100%;border-collapse:separate;border-spacing:0;font-size:var(--fs-sm);}
.tbl th{
  position:sticky;top:0;z-index:2;
  background:var(--surface-2);
  padding:var(--sp-2) var(--sp-3);
  color:var(--fg-3);font-size:var(--fs-2xs);font-weight:700;
  letter-spacing:.8px;text-align:left;white-space:nowrap;
  border-bottom:1px solid var(--accent-dim);
}
.tbl td{padding:var(--sp-2) var(--sp-3);border-bottom:1px solid var(--line);}
.tbl tbody tr:last-child td{border-bottom:none;}
.tbl .num{text-align:right;}
.tbl th.num{text-align:right;}
.tbl--zebra tbody tr:nth-child(even) td{background:var(--surface-3);}
.tbl--rows tbody tr{cursor:pointer;}
.tbl--rows tbody tr:hover td{background:var(--surface-4);}
/* Erste Spalte beim Querscrollen stehen lassen. Ohne das verliert man beim
   Peer-Vergleich sofort, welche Kennzahl man gerade liest. */
.tbl--stick-first th:first-child,
.tbl--stick-first td:first-child{
  position:sticky;left:0;z-index:1;
  background:var(--surface);
  border-right:1px solid var(--line);
}
.tbl--stick-first th:first-child{z-index:3;background:var(--surface-2);}
.tbl--stick-first.tbl--zebra tbody tr:nth-child(even) td:first-child{background:var(--surface-3);}
/* Auf dem Handy darf die stehenbleibende Spalte nicht die halbe Breite fressen,
   sonst bleibt fuer die eigentlichen Werte kaum Platz. Lange Bezeichnungen
   werden abgeschnitten - der volle Text steht im title-Attribut. */
@media (max-width:700px){
  .tbl--stick-first th:first-child,
  .tbl--stick-first td:first-child{max-width:38vw;overflow:hidden;text-overflow:ellipsis;}
}
.tbl__group td{
  background:var(--surface-2) !important;
  color:var(--info);font-size:var(--fs-2xs);letter-spacing:1.2px;font-weight:700;
  padding:var(--sp-2) var(--sp-3);
}

/* --- Chips / Tags --------------------------------------------------------- */
.chip{
  display:inline-block;color:var(--accent-2);font-size:var(--fs-2xs);
  border:1px solid var(--accent-dim);padding:1px var(--sp-2);white-space:nowrap;
}
.chip--btn{cursor:pointer;}
.chip--btn:hover{background:var(--accent-bg);}

/* --- Kopfleisten ---------------------------------------------------------- */
.topbar{
  display:flex;align-items:center;gap:var(--sp-3);flex-wrap:wrap;
  background:#000;border-bottom:1px solid var(--accent-dim);
  padding:var(--sp-2) var(--sp-4);
  padding-left:max(var(--sp-4),env(safe-area-inset-left));
  padding-right:max(var(--sp-4),env(safe-area-inset-right));
}
.brand{color:var(--accent);font-weight:700;letter-spacing:2px;font-size:var(--fs-md);white-space:nowrap;}
.cmdbox{position:relative;flex:1;min-width:0;}
.cmdbox__in{display:flex;align-items:center;gap:6px;background:var(--surface-2);border:1px solid var(--accent-dim);padding:0 var(--sp-3);}
/* min-width:0 ist hier zwingend: Flex-Kinder haben per Default min-width:auto
   und schrumpfen deshalb nicht unter ihre Inhaltsbreite - das lange Platzhalter-
   Wort hat die Statusanzeige daneben ueberlappt. */
.cmdbox__in input{flex:1;min-width:0;background:transparent;border:none;color:var(--accent-2);padding:var(--sp-2) 0;}
/* Auf dem Handy bekommt die Kommandozeile eine eigene volle Zeile, statt sich
   mit Uhr und Statusanzeige um dieselbe Zeile zu streiten. */
@media (max-width:700px){
  .cmdbox{flex-basis:100%;order:10;}
}
.fbar{
  display:flex;align-items:center;gap:var(--sp-2);flex-wrap:wrap;
  background:#000;border-bottom:1px solid var(--line);
  padding:var(--sp-2) var(--sp-4);
}
/* Auf dem Handy sind die F-Tasten das Wichtigste - sie duerfen scrollen,
   statt in vier Zeilen umzubrechen und den halben Schirm zu fressen. */
@media (max-width:700px){
  .fbar{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;}
  .fbar::-webkit-scrollbar{display:none;}
  .fbar > *{flex:0 0 auto;}
}
.tape-wrap{overflow:hidden;padding:var(--sp-1) 0;border-bottom:1px solid var(--line);}
.tape-wrap--idx{background:#050810;border-bottom-color:#16324d;}
.tape-wrap--wl{background:var(--surface-2);}
.tape__item{margin:0 var(--sp-5);font-size:var(--fs-xs);}

/* --- Layout --------------------------------------------------------------- */
.page{padding:var(--sp-3);
      padding-left:max(var(--sp-3),env(safe-area-inset-left));
      padding-right:max(var(--sp-3),env(safe-area-inset-right));}
.layout{display:grid;grid-template-columns:1fr;gap:var(--sp-3);}
@media (min-width:981px){
  .layout{grid-template-columns:200px minmax(0,1fr) 320px;}
}
/* minmax(0,1fr) statt 1fr: sonst sprengt ein breites Chart-SVG die Spalte,
   weil Grid-Elemente per Default min-width:auto haben. */
.layout > *{min-width:0;}

.grid-auto{display:grid;gap:var(--sp-3);grid-template-columns:repeat(auto-fill,minmax(260px,1fr));}
.grid-auto--sm{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));}
.grid-pair{display:grid;gap:var(--sp-3);grid-template-columns:1fr 1fr;}
/* Auf schmalen Schirmen war das hier fix zweispaltig - Kennzahlen und ihre
   Werte sind dadurch ineinandergelaufen. */
@media (max-width:700px){ .grid-pair{grid-template-columns:1fr;} }

.toolbar{display:flex;gap:var(--sp-2);align-items:center;flex-wrap:wrap;margin-bottom:var(--sp-3);}
.spacer{flex:1;}
.muted{color:var(--fg-3);font-size:var(--fs-xs);}
.empty{
  color:var(--fg-3);font-size:var(--fs-sm);padding:var(--sp-6);text-align:center;
  background:var(--surface);border:1px solid var(--line);
}

/* --- Watchlist ------------------------------------------------------------ */
.wl-row{
  display:grid;grid-template-columns:1fr auto auto auto auto;
  gap:var(--sp-2);align-items:center;
  padding:var(--sp-1) var(--sp-1);margin:0 calc(-1 * var(--sp-1));
  min-height:var(--tap);
  border-left:2px solid transparent;cursor:pointer;
}
.wl-row:hover{background:var(--surface-3);}
.wl-row--on{background:var(--accent-bg);border-left-color:var(--accent);}

/* --- Suchvorschlaege ------------------------------------------------------ */
.suggest{
  position:absolute;top:100%;left:0;right:0;z-index:30;
  background:var(--surface);border:1px solid var(--accent-dim);border-top:none;
  max-height:min(60vh,320px);overflow-y:auto;
}
.suggest__row{
  display:flex;justify-content:space-between;gap:var(--sp-3);
  padding:var(--sp-2) var(--sp-3);min-height:var(--tap);align-items:center;
  cursor:pointer;border-bottom:1px solid var(--line);
}
.suggest__row:last-child{border-bottom:none;}
.suggest__row:hover{background:var(--surface-3);}

/* --- Karten (Sektoren, Laender) ------------------------------------------- */
.card{background:var(--surface);border:1px solid var(--line);padding:var(--sp-3);cursor:pointer;
      transition:border-color var(--dur);}
.card:hover{border-color:var(--line-strong);}

/* --- Links ---------------------------------------------------------------- */
.link{color:var(--fg);text-decoration:none;line-height:1.4;}
.link:hover{color:var(--accent-2);text-decoration:underline;}
</style>
</head>
<body>
<div id="root"><div id="boot">◈ TERMINAL — lädt…<br><span style="color:#7f858f;font-size:12px">Wenn dieser Text hängen bleibt: Internet/Content-Blocker prüfen. Fehler erscheinen unten in Rot.</span></div></div>
<div id="err"></div>

<script>
  window.__err = function(msg){
    var e=document.getElementById('err'); if(!e)return;
    e.style.display='block'; e.textContent='FEHLER:\n'+msg+'\n\n(Screenshot an den Chat schicken.)';
  };
  window.addEventListener('error', function(ev){ window.__err((ev.error && ev.error.stack) || ev.message || String(ev)); });
  window.addEventListener('unhandledrejection', function(ev){ window.__err('Promise: '+((ev.reason && ev.reason.message) || ev.reason)); });
</script>

<!-- CDNs (jsdelivr – meist zuverlässiger auf Mobil) -->
<script src="https://cdn.jsdelivr.net/npm/react@18.2.0/umd/react.production.min.js" crossorigin></script>
<script src="https://cdn.jsdelivr.net/npm/react-dom@18.2.0/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://cdn.jsdelivr.net/npm/@babel/standalone@7.24.7/babel.min.js"></script>

<!-- Reine Rechenlogik: eigenstaendige, nicht transpilierte Dateien (kein Babel),
     Dual-Export fuer Wiederverwendung in Node-Tests. Siehe ratios.js/peers.js. -->
<script src="assets/js/ratios.js"></script>
<script src="assets/js/peers.js"></script>
<script src="assets/js/theme.js"></script>
<script src="assets/js/indicators.js"></script>
<script src="assets/js/market-data.js"></script>
<script src="assets/js/mc.js"></script>
<script src="assets/js/geo-quakes.js"></script>

<!-- App-Quelltext (wird unten kontrolliert kompiliert) -->
<script type="text/plain" id="app-src">
const { useState, useMemo, useRef, useEffect } = React;

/* ================= Aus theme.js / indicators.js / market-data.js importiert ================= */
// mono/inp werden nicht mehr importiert: Schriftart und Feld-Optik kommen jetzt
// aus den CSS-Klassen (--mono bzw. .field). C bleibt noetig, weil die SVG-Charts
// Farben als Attributwerte brauchen, wo CSS-Variablen nicht greifen.
const { C, CUR, fmtCap, fmtVol, fmtMoney, fmtRatio, pctColor, ago, METRIC_META, RATIO_SUPPRESS_FOR_FINANCIALS, GEO_LEVEL_META, geoLevelMeta } = Theme;
const { sma, rsi, aggregateOHLC, groupSizeFor } = Indicators;
const {
  EU_PRESETS, ASIA_PRESETS, MACRO_PRESETS, US_MACRO_PRESETS, EURO_MACRO_PRESETS, INDEX_PRESETS, US_UNIVERSE, US_NAME, SECTORS,
  FH, TD, YF, FRED_FN,
  jget, jgetTimeout, keyOf, fredGetBatch,
  fhQuote, tdQuote, tdSeries, yfGet, searchSymbol, localPresetMatch, resolveSymbol,
  CHART_RANGES, getChart, getQuoteLite, getDetail, askGroq,
} = MarketData;

// Ab wie vielen eingetippten Zeichen Vorschlaege erscheinen. Bewusst EINE
// Konstante: die Schwelle wird an zwei Stellen gebraucht (im Sucheffekt und
// beim Einblenden der Liste). Standen dort zwei Zahlen, fuehrte jede Aenderung
// an nur einer Stelle zu einem Suchfeld, das entweder rechnet ohne anzuzeigen
// oder eine leere Liste einblendet.
const SUGGEST_MIN = 3;

/* ================= LocalStorage persistence (standalone file, no window.storage) ================= */
const LS = {
  get(k) { try { const v = localStorage.getItem("term_" + k); return v == null ? null : JSON.parse(v); } catch { return null; } },
  set(k, v) { try { localStorage.setItem("term_" + k, JSON.stringify(v)); } catch {} },
  del(k) { try { localStorage.removeItem("term_" + k); } catch {} },
};

/* ================= Hooks =================
   useMediaQuery: reagiert wirklich auf Groessenaenderungen. Vorher wurde
   window.innerWidth direkt im Render gelesen - React rendert bei einem Resize
   aber nicht von sich aus neu, das Layout hing also zufaellig daran, dass
   irgendein anderer State-Update (bis eben der Sekundentakt der Uhr) einen
   Re-Render ausloeste. Beim Drehen des Handys sprang das Layout deshalb
   verzoegert um. */
function useMediaQuery(query) {
  const [match, setMatch] = useState(() =>
    typeof window !== "undefined" && window.matchMedia ? window.matchMedia(query).matches : false);
  useEffect(() => {
    if (!window.matchMedia) return;
    const mq = window.matchMedia(query);
    const on = (e) => setMatch(e.matches);
    setMatch(mq.matches);
    // addEventListener erst ab Safari 14; addListener als Rueckfallebene.
    if (mq.addEventListener) { mq.addEventListener("change", on); return () => mq.removeEventListener("change", on); }
    mq.addListener(on); return () => mq.removeListener(on);
  }, [query]);
  return match;
}

/* Uhr als eigene Komponente: vorher lag der Sekundentakt als State in App und
   hat damit 1x pro Sekunde den kompletten Baum neu gerendert - inklusive
   Neuberechnung von SMA/RSI und Neuzeichnen aller Charts. Jetzt rendert nur
   noch dieses eine <span> neu. */
function Clock() {
  const [t, setT] = useState(() => new Date().toLocaleTimeString("de-DE"));
  useEffect(() => {
    const iv = setInterval(() => setT(new Date().toLocaleTimeString("de-DE")), 1000);
    return () => clearInterval(iv);
  }, []);
  return <span className="muted">{t}</span>;
}

/* ================= Chart (rendert Kursverlauf von Yahoo) ================= */
// height: Anzeigehoehe in px. Die Makro-Uebersicht zeigt zehn Kacheln
// nebeneinander und braucht flachere Verlaeufe, damit man sie ohne Scrollen
// vergleichen kann; im F1-Detailchart bleibt es bei der vollen Hoehe.
function SvgChart({ series, up, overlays, height }) {
  if (!series || series.length < 3) return null;
  const w = 600, h = 200, pad = 8;
  const px = height || 210;
  const vals = series.map((d) => d.p);
  const overlayVals = (overlays || []).flatMap((o) => o.vals.filter((v) => v != null));
  const allVals = [...vals, ...overlayVals];
  const min = Math.min(...allVals), max = Math.max(...allVals);
  const range = max - min || 1;
  const xAt = (i) => pad + (i / (series.length - 1)) * (w - pad * 2);
  const yAt = (v) => h - pad - ((v - min) / range) * (h - pad * 2);
  const pts = series.map((d, i) => [xAt(i), yAt(d.p)]);
  const line = pts.map((p, i) => (i === 0 ? `M${p[0]},${p[1]}` : `L${p[0]},${p[1]}`)).join(" ");
  const area = `${line} L${pts[pts.length - 1][0]},${h - pad} L${pts[0][0]},${h - pad} Z`;
  const col = up ? C.green : C.red;
  const gid = "grad" + Math.random().toString(36).slice(2, 8);
  return (
    <svg viewBox={`0 0 ${w} ${h}`} style={{ width: "100%", height: px, display: "block" }} preserveAspectRatio="none">
      <defs><linearGradient id={gid} x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stopColor={col} stopOpacity="0.35" /><stop offset="100%" stopColor={col} stopOpacity="0" /></linearGradient></defs>
      <path d={area} fill={`url(#${gid})`} />
      <path d={line} fill="none" stroke={col} strokeWidth="1.6" />
      {(overlays || []).map((o, oi) => {
        const segs = []; let cur = [];
        o.vals.forEach((v, i) => { if (v == null) { if (cur.length > 1) segs.push(cur); cur = []; return; } cur.push([xAt(i), yAt(v)]); });
        if (cur.length > 1) segs.push(cur);
        return segs.map((seg, si) => <path key={oi + "-" + si} d={seg.map((p, i) => (i === 0 ? `M${p[0]},${p[1]}` : `L${p[0]},${p[1]}`)).join(" ")} fill="none" stroke={o.color} strokeWidth="1.2" opacity="0.9" />);
      })}
    </svg>
  );
}
// Kerzenchart. Zeichnet bewusst NUR mit <rect>, keine <line>: das SVG laeuft
// wie alle anderen hier mit preserveAspectRatio="none" (es wird also horizontal
// gestreckt). Eine Strichstaerke wuerde dabei mitverzerrt, eine Rechteckbreite
// nicht - Dochte und Koerper bleiben so in jeder Fensterbreite sauber.
//
// Balken ohne o/h/l (Yahoo-Luecken) werden uebersprungen statt als Kerze mit
// Nullwerten gezeichnet. Die Skala kommt trotzdem aus ALLEN Balken, damit das
// Bild nicht springt, wenn zwischen Linie und Kerzen umgeschaltet wird.
function CandleChart({ series, height }) {
  if (!series || series.length < 3) return null;
  const w = 600, h = 200, pad = 8;
  const px = height || 210;

  const hochs = series.map((d) => (d.h != null ? d.h : d.p));
  const tiefs = series.map((d) => (d.l != null ? d.l : d.p));
  const min = Math.min.apply(null, tiefs), max = Math.max.apply(null, hochs);
  const range = max - min || 1;
  const yAt = (v) => h - pad - ((v - min) / range) * (h - pad * 2);

  const slot = (w - pad * 2) / series.length;
  // Mindestens ein halber Nutzer-Pixel Koerperbreite, sonst verschwindet die
  // Kerze bei vielen Balken ganz. Der Docht ist ein Drittel davon.
  const bodyW = Math.max(slot * 0.7, 0.6);
  const wickW = Math.max(bodyW / 3, 0.3);

  return (
    <svg viewBox={`0 0 ${w} ${h}`} style={{ width: "100%", height: px, display: "block" }} preserveAspectRatio="none">
      {series.map((d, i) => {
        if (d.o == null || d.h == null || d.l == null) return null;
        const x = pad + i * slot + slot / 2;
        const steigt = d.p >= d.o;
        const col = steigt ? C.green : C.red;
        const yO = yAt(d.o), yC = yAt(d.p);
        const top = Math.min(yO, yC);
        // Doji (Open == Close): ohne Mindesthoehe waere der Koerper unsichtbar.
        const bodyH = Math.max(Math.abs(yC - yO), 0.8);
        return (
          <g key={i}>
            <rect x={x - wickW / 2} y={yAt(d.h)} width={wickW} height={Math.max(yAt(d.l) - yAt(d.h), 0.5)} fill={col} opacity="0.85" />
            <rect x={x - bodyW / 2} y={top} width={bodyW} height={bodyH} fill={col} />
          </g>
        );
      })}
    </svg>
  );
}
function VolumeChart({ series }) {
  const vols = series.map((d) => d.v).filter((v) => v != null);
  if (vols.length < 3) return null;
  const w = 600, h = 44;
  const max = Math.max(...vols) || 1;
  const bw = w / series.length;
  return (
    <svg viewBox={`0 0 ${w} ${h}`} style={{ width: "100%", height: 44, display: "block", marginTop: 4 }} preserveAspectRatio="none">
      {series.map((d, i) => d.v == null ? null : <rect key={i} x={i * bw} y={h - (d.v / max) * h} width={Math.max(bw - 1, 0.5)} height={(d.v / max) * h} fill={C.muted} opacity="0.55" />)}
    </svg>
  );
}
function GdeltTrendChart({ data }) {
  if (!data || data.length < 2) return null;
  const w = 600, h = 44;
  const vals = data.map((d) => d.value);
  const max = Math.max(...vals) || 1;
  const bw = w / data.length;
  return (
    <svg viewBox={`0 0 ${w} ${h}`} style={{ width: "100%", height: 44, display: "block", marginTop: 4 }} preserveAspectRatio="none">
      {data.map((d, i) => <rect key={i} x={i * bw} y={h - (d.value / max) * h} width={Math.max(bw - 1, 0.5)} height={(d.value / max) * h} fill={C.orange} opacity="0.55" />)}
    </svg>
  );
}
function RSIChart({ vals }) {
  const pts = vals.map((v, i) => (v == null ? null : [i, v])).filter(Boolean);
  if (pts.length < 3) return null;
  const w = 600, h = 46;
  const xAt = (i) => (i / (vals.length - 1)) * w;
  const yAt = (v) => h - (v / 100) * h;
  const line = pts.map((p, i) => `${i === 0 ? "M" : "L"}${xAt(p[0])},${yAt(p[1])}`).join(" ");
  return (
    <svg viewBox={`0 0 ${w} ${h}`} style={{ width: "100%", height: 46, display: "block", marginTop: 4 }} preserveAspectRatio="none">
      <line x1="0" y1={yAt(70)} x2={w} y2={yAt(70)} stroke={C.red} strokeWidth="0.6" strokeDasharray="3,3" opacity="0.5" />
      <line x1="0" y1={yAt(30)} x2={w} y2={yAt(30)} stroke={C.green} strokeWidth="0.6" strokeDasharray="3,3" opacity="0.5" />
      <path d={line} fill="none" stroke={C.blue} strokeWidth="1.3" />
    </svg>
  );
}

function FinancialsChart({ data }) {
  if (!data || data.length < 2) return null;
  const w = 600, h = 130, pad = 18;
  const vals = data.flatMap((d) => [d.revenue, d.earnings]).filter((v) => v != null);
  if (!vals.length) return null;
  const max = Math.max(...vals, 0), min = Math.min(...vals, 0);
  const range = (max - min) || 1;
  const zeroY = h - pad - ((0 - min) / range) * (h - pad * 2);
  const bw = (w - pad * 2) / data.length;
  return (
    <svg viewBox={`0 0 ${w} ${h}`} style={{ width: "100%", height: 130, display: "block" }} preserveAspectRatio="none">
      <line x1={pad} y1={zeroY} x2={w - pad} y2={zeroY} stroke={C.line} strokeWidth="1" />
      {data.map((d, i) => {
        const x0 = pad + i * bw;
        const rH = d.revenue != null ? (Math.abs(d.revenue) / range) * (h - pad * 2) : 0;
        const eH = d.earnings != null ? (Math.abs(d.earnings) / range) * (h - pad * 2) : 0;
        return (
          <g key={i}>
            {d.revenue != null && <rect x={x0 + bw * 0.15} y={d.revenue >= 0 ? zeroY - rH : zeroY} width={bw * 0.3} height={rH} fill={C.blue} opacity="0.85" />}
            {d.earnings != null && <rect x={x0 + bw * 0.55} y={d.earnings >= 0 ? zeroY - eH : zeroY} width={bw * 0.3} height={eH} fill={d.earnings >= 0 ? C.green : C.red} opacity="0.85" />}
            <text x={x0 + bw / 2} y={h - 4} fontSize="9" fill={C.muted} textAnchor="middle">{d.year}</text>
          </g>
        );
      })}
    </svg>
  );
}

/* ================= Atoms =================
   Optik steckt in den CSS-Klassen (siehe <style> im Kopf). Inline bleiben nur
   Werte, die wirklich von den Daten abhaengen - z.B. Gruen/Rot je nach
   Vorzeichen oder eine berechnete Balkenbreite. */
const Panel = ({ title, right, children, style, className }) => (
  <div className={"panel" + (className ? " " + className : "")} style={style}>
    {title && <div className="panel__hd"><span className="panel__title">{title}</span>{right}</div>}
    <div className="panel__bd">{children}</div>
  </div>
);
const Stat = ({ k, v, color }) => (
  <div className="stat"><span className="stat__k">{k}</span><span className="stat__v" style={color ? { color } : null}>{v}</span></div>
);
function DayRange({ d }) {
  if (d.low == null || d.high == null || d.high <= d.low) return <div className="muted">Keine Tagesdaten.</div>;
  const pos = (v) => Math.max(0, Math.min(100, ((v - d.low) / (d.high - d.low)) * 100));
  const upCol = (d.chg ?? 0) >= 0 ? C.green : C.red;
  return (<div style={{ paddingTop: 4 }}>
    <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 6 }} className="muted"><span>T {d.low}</span><span>TAGESSPANNE</span><span>{d.high}</span></div>
    <div style={{ position: "relative", height: 12, background: C.panel3, border: `1px solid ${C.line}` }}>
      <div style={{ position: "absolute", left: 0, width: pos(d.price) + "%", height: "100%", background: C.amberDim, opacity: 0.45 }} />
      {d.prevClose != null && <div style={{ position: "absolute", left: pos(d.prevClose) + "%", top: -3, width: 1, height: 18, background: C.muted }} />}
      <div style={{ position: "absolute", left: `calc(${pos(d.price)}% - 4px)`, top: -3, width: 8, height: 18, background: upCol }} />
    </div>
    <div style={{ display: "flex", justifyContent: "space-between", marginTop: 5 }} className="muted"><span>Open {d.open}</span><span style={{ color: upCol }}>Kurs {d.price}</span><span>Vortag {d.prevClose}</span></div>
  </div>);
}
function RecoBar({ recos }) {
  if (!recos?.length) return <div className="muted">Keine Empfehlungsdaten verfügbar.</div>;
  const cur = recos[0]; const segs = [["strongSell", C.red, "S.Sell"], ["sell", "#ff7a45", "Sell"], ["hold", C.muted, "Hold"], ["buy", C.green, "Buy"], ["strongBuy", "#17a760", "S.Buy"]];
  const total = segs.reduce((a, [k]) => a + (cur[k] || 0), 0) || 1;
  const score = (cur.strongBuy * 2 + cur.buy - cur.sell - cur.strongSell * 2) / total;
  const con = score > 0.7 ? ["KAUFEN", "#17a760"] : score > 0.15 ? ["MOD. KAUFEN", C.green] : score > -0.15 ? ["HALTEN", C.amber] : score > -0.7 ? ["MOD. VERKAUF", "#ff7a45"] : ["VERKAUFEN", C.red];
  return (<div>
    <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline", marginBottom: 8 }}>
      <span style={{ color: con[1], fontSize: "var(--fs-lg)", fontWeight: 700, letterSpacing: 0.5 }}>{con[0]}</span>
      <span className="muted">{total} Analysten</span>
    </div>
    <div style={{ display: "flex", height: 18, border: `1px solid ${C.line}` }}>{segs.map(([k, col]) => { const w = ((cur[k] || 0) / total) * 100; return w > 0 ? <div key={k} style={{ width: w + "%", background: col }} /> : null; })}</div>
    <div style={{ display: "flex", justifyContent: "space-between", marginTop: 7 }}>{segs.slice().reverse().map(([k, col, l]) => <div key={k} style={{ textAlign: "center", flex: 1 }}><div style={{ color: col, fontSize: "var(--fs-md)", fontWeight: 700 }}>{cur[k] || 0}</div><div className="stat__k">{l}</div></div>)}</div>
  </div>);
}
function NewsList({ items, onTag }) {
  if (!items?.length) return <div className="muted">Keine Meldungen.</div>;
  return items.map((n, i) => (<div key={i} style={{ padding: "9px 0", borderBottom: i < items.length - 1 ? `1px solid ${C.line}` : "none" }}>

/* ================= F5 RATIO ================= */
function RatioPanel({ ratioTickers, ratioData, ratioView, ratioBusy, ratioAddCmd, setRatioAddCmd, addRatioPeer, rmRatioPeer, openRatio, loadDetail, chartCell, setChartCell, dupontOpen, setDupontOpen }) {
  const isComps = ratioView === "comps";

  // Spalten bestimmen: bei COMPS = Firmen (je letztes GJ), sonst = Jahre einer einzelnen Firma.
  let columns = [];
  if (isComps) {
    columns = ratioTickers.map((e) => {
      const d = ratioData[keyOf(e)];
      const series = d && d.fundamentals ? window.Ratios.computeSeries(d.fundamentals) : [];
      return { key: keyOf(e), label: e.s, ratios: series[0] || null, current: series[0] || null, prior: series[1] || null, isFinancial: !!(d && d.isFinancial), error: d && d.error, loaded: !!d };
    });
  } else if (ratioTickers.length) {
    const e = ratioTickers[0]; const d = ratioData[keyOf(e)];
    const series = d && d.fundamentals ? window.Ratios.computeSeries(d.fundamentals) : [];
    const years = ratioView === "series" ? series.slice(0, 5) : series.slice(0, 1);
    columns = years.map((row, i) => ({ key: String(row.year), label: String(row.year), ratios: row, current: row, prior: series[i + 1] || null, isFinancial: !!(d && d.isFinancial), error: d && d.error, loaded: !!d }));
    if (!columns.length && d) columns = [{ key: "—", label: "—", ratios: null, current: null, prior: null, isFinancial: !!d.isFinancial, error: d.error || "Keine Jahresabschlussdaten verfügbar.", loaded: true }];
  }

  const peerTable = (isComps && columns.length > 1) ? window.Peers.buildPeerTable(columns.map((c) => ({ id: c.key, ratios: c.ratios }))) : null;
  const anyFinancial = columns.some((c) => c.isFinancial);
  // Welche Quellen haben die geladenen Datensaetze tatsaechlich geliefert? Bei einem
  // Yahoo-Ausfall greift die Ersatzquelle (Stooq), die aber gar keine Jahresabschluesse
  // kennt - dann gibt es hier zwangslaeufig keine Kennzahlen, und das muss man sehen.
  const loadedDetails = ratioTickers.map((e) => ratioData[keyOf(e)]).filter(Boolean);
  const usedSources = Array.from(new Set(loadedDetails.map((d) => d.source).filter(Boolean)));
  const partialNote = loadedDetails.map((d) => d.partial).filter(Boolean)[0] || null;
  const groupOrder = ["Marge", "Liquidität", "Verschuldung", "Working Capital", "Rendite"];
  const groups = {}; Object.keys(METRIC_META).forEach((k) => { const g = METRIC_META[k].group; (groups[g] = groups[g] || []).push(k); });

  const chartFor = ratioTickers.length ? (isComps ? ratioTickers.find((e) => keyOf(e) === (chartCell && chartCell.colKey)) : ratioTickers[0]) : null;
  const chartSeries = (() => {
    if (!chartCell || !chartFor) return [];
    const d = ratioData[keyOf(chartFor)]; if (!d || !d.fundamentals) return [];
    return window.Ratios.computeSeries(d.fundamentals).slice().reverse()
      .filter((r) => r[chartCell.metric] != null).map((r) => ({ t: String(r.year), p: r[chartCell.metric] }));
  })();

  return (<>
    <div className="toolbar">
      <span className="muted">{isComps ? "PEER-VERGLEICH" : ratioView === "series" ? "ZEITREIHE" : "KENNZAHLEN · LETZTES GJ"}</span>
      {ratioTickers.length > 0 && <span style={{ color: C.text, fontSize: "var(--fs-xs)" }}>· {ratioTickers.map((e) => e.s).join(", ")}</span>}
      <div className="spacer" />
      {ratioTickers.length === 1 && (
        <button className="btn btn--ghost" onClick={() => openRatio(ratioTickers, ratioView === "series" ? "single" : "series")}>
          {ratioView === "series" ? "NUR LETZTES GJ" : "5J ZEITREIHE"}
        </button>
      )}
      {ratioTickers.length > 0 && ratioTickers.length < 6 && (<>
        <input className="field" value={ratioAddCmd} onChange={(e) => setRatioAddCmd(e.target.value)} onKeyDown={(e) => e.key === "Enter" && addRatioPeer()} placeholder="+ Ticker/Name für Vergleich" style={{ width: 200 }} />
        <button className="btn btn--solid" onClick={() => addRatioPeer()}>+ COMPS</button>
      </>)}
    </div>

    {!ratioTickers.length && !ratioBusy && (
      <div className="empty">
        Noch keine Werte geladen. Kommandozeile oben: <span style={{ color: C.amber }}>AAPL RATIO</span>, <span style={{ color: C.amber }}>AAPL RATIO 5Y</span> oder <span style={{ color: C.amber }}>AAPL COMPS MSFT GOOGL</span>.
      </div>
    )}
    {ratioBusy && <div className="muted" style={{ padding: 12 }}>lädt…</div>}

    {ratioTickers.length > 0 && !ratioBusy && (<>
      {/* Dauerhaft sichtbares Datenpanel: Quelle, Stichtag, Zeitkonvention, Rechnungslegungsstandard */}
      <div className="note note--info" style={{ marginBottom: 8, display: "flex", gap: 16, flexWrap: "wrap" }}>
        <span><b style={{ color: C.text }}>QUELLE</b> {usedSources.length ? usedSources.join(" + ").toUpperCase() : "—"} (Jahresabschluss)</span>
        <span><b style={{ color: C.text }}>ZEITKONVENTION</b> Geschäftsjahr, keine TTM-Werte gemischt</span>
        <span><b style={{ color: C.text }}>RECHNUNGSLEGUNG</b> je Unternehmen ggf. abweichend (US-GAAP/IFRS)</span>
        {columns.map((c) => <span key={c.key}><b style={{ color: C.text }}>{isComps ? c.label : "GJ"} STICHTAG</b> {c.ratios ? c.ratios.year : "—"}</span>)}
      </div>

      {partialNote && (
        <div className="note note--warn" style={{ marginBottom: 8 }}>
          ⚠ {partialNote} Kennzahlen lassen sich daraus nicht berechnen.
        </div>
      )}

      {isComps && columns.length > 1 && (
        <div className="note note--warn" style={{ marginBottom: 8 }}>
          ⚠ Rechnungslegungsstandards können zwischen den verglichenen Unternehmen abweichen (z.B. IFRS vs. US-GAAP) — Kennzahlen sind dadurch nur eingeschränkt direkt vergleichbar.
        </div>
      )}

      {/* tbl--stick-first: die Kennzahlen-Spalte bleibt beim Querscrollen stehen.

              <th key={c.key} className="num" style={{ color: C.orange, cursor: isComps ? "pointer" : "default" }}
                onClick={() => isComps && loadDetail(ratioTickers.find((e) => keyOf(e) === c.key))}>
                {c.label}{isComps && ratioTickers.length > 1 && <span onClick={(ev) => { ev.stopPropagation(); rmRatioPeer(ratioTickers.find((e) => keyOf(e) === c.key)); }} style={{ color: C.muted, marginLeft: 6, cursor: "pointer" }}>×</span>}
              </th>
            ))}
          </tr></thead>
          <tbody>
            {!columns.some((c) => c.ratios) && (
              <tr><td colSpan={columns.length + 1} style={{ padding: 20, textAlign: "center", color: C.muted }}>
                {columns.some((c) => c.error) ? "Fehler: " + columns.find((c) => c.error).error : "Keine Jahresabschlussdaten verfügbar."}
              </td></tr>
            )}
            {groupOrder.map((group) => {
              const keys = (groups[group] || []).filter((k) => !(anyFinancial && RATIO_SUPPRESS_FOR_FINANCIALS.includes(k)));
              if (!keys.length) return null;
              return (
                <React.Fragment key={group}>
                  <tr className="tbl__group"><td colSpan={columns.length + 1}>{group.toUpperCase()}</td></tr>
                  {keys.map((mk) => (
                    <tr key={mk}>
                      <td style={{ color: C.text, whiteSpace: "nowrap" }} title={METRIC_META[mk].label}>{METRIC_META[mk].label}</td>
                      {columns.map((c) => {
                        const v = c.ratios ? c.ratios[mk] : null;
                        const row = peerTable ? peerTable.rows.find((r) => r.id === c.key) : null;
                        const pct = row ? row.percentiles[mk] : null;
                        return (
                          <td key={c.key} className="num" onClick={() => v != null && setChartCell({ metric: mk, colKey: c.key })}
                            style={{ cursor: v != null ? "pointer" : "default", background: pctColor(pct), color: v == null ? C.muted : C.white }}>

                    </tr>
                  ))}
                </React.Fragment>
              );

        {anyFinancial && <div className="muted" style={{ padding: "7px 12px", borderTop: `1px solid ${C.line}` }}>Working-Capital- und Verschuldungskennzahlen sind für Banken/Versicherer ausgeblendet (für dieses Geschäftsmodell nicht aussagekräftig).</div>}
      </div>

      {/* DuPont-Zerlegung, aufklappbar */}
      <Panel title="DUPONT-ZERLEGUNG" right={<span onClick={() => setDupontOpen(!dupontOpen)} style={{ color: C.amber, fontSize: 11, cursor: "pointer" }}>{dupontOpen ? "▾ zu" : "▸ auf"}</span>} style={{ marginBottom: 8 }}>
        {!dupontOpen ? (
          <div className="muted">ROE = Nettomarge × Kapitalumschlag × EK-Multiplikator. Aufklappen für die Zerlegung je {isComps ? "Unternehmen" : "Jahr"}.</div>
        ) : (
          <div style={{ overflowX: "auto" }}>
            <table className="tbl tbl--stick-first">
              <thead><tr>
                <th>DUPONT</th>
                {columns.map((c) => <th key={c.key} className="num" style={{ color: C.orange }}>{c.label}</th>)}
              </tr></thead>
              <tbody>
                {[["netMargin", "Nettomarge", "pct"], ["assetTurnover", "Kapitalumschlag", "x"], ["equityMultiplier", "EK-Multiplikator", "x"], ["roe", "= ROE", "pct"]].map(([k, label, fmt]) => (
                  <tr key={k}>
                    <td style={{ color: C.text, whiteSpace: "nowrap" }}>{label}</td>
                    {columns.map((c) => {
                      if (!c.current) return <td key={c.key} className="num" style={{ color: C.muted }}>n/a</td>;

                    })}
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        )}
      </Panel>

      {chartCell && (
        <Panel title={`${METRIC_META[chartCell.metric].label} · ${chartFor ? chartFor.s : ""} · Verlauf`} right={<span onClick={() => setChartCell(null)} style={{ color: C.muted, fontSize: 11, cursor: "pointer" }}>× schließen</span>}>
          {chartSeries.length > 1 ? <SvgChart series={chartSeries} up={chartSeries[chartSeries.length - 1].p >= chartSeries[0].p} /> : <div style={{ color: C.muted, fontSize: 11 }}>Nicht genug Jahre für einen Verlauf (mind. 2 nötig).</div>}
        </Panel>
      )}
    </>)}
  </>);
}

   UI aber getrennt gruppiert - sonst waere die Erweiterung nur "mehr Kacheln

/* ================= F6 WELTLAGE ================= */
// Echte Weltkarte als Erweiterung: laedt oeffentliche Laendergrenzen (GeoJSON)
// zur Laufzeit im Browser per CDN, genau wie React/Babel schon per <script src>
// geladen werden. Kann hier nicht getestet werden (kein Netzwerkzugriff in der
// Entwicklungsumgebung) - faellt deshalb bei jedem Fehler (Netzwerk, falsches
// Format, leere Antwort) still auf world=false zurueck. Die Elternkomponente
// (GeoPanel) zeigt in dem Fall einfach nur die Laenderliste, die unabhaengig
// davon funktioniert.
// Zwei unabhaengige Quellen fuer die Laendergrenzen. Frueher gab es nur die
// erste; schlug sie fehl, verschwand die Karte KOMMENTARLOS (return null) und
// niemand konnte sehen, woran es lag - "die Karte geht nicht" ohne jeden
// Anhaltspunkt. Jetzt: zweite Quelle als Rueckfall, und wenn auch die nicht
// traegt, sagt die Komponente warum.
const GEO_MAP_SOURCES = [
  { name: "world.geo.json", url: "https://cdn.jsdelivr.net/gh/johan/world.geo.json@master/countries.geo.json" },
  // Natural Earth (gemeinfrei, aktiv gepflegt). Groesser, aber unabhaengiger
  // Anbieterpfad - faellt jsDelivr fuer das erste Repo aus, traegt oft noch dieser.
  { name: "Natural Earth 110m", url: "https://cdn.jsdelivr.net/gh/nvkelso/natural-earth-vector@master/geojson/ne_110m_admin_0_countries.geojson" },
];

function GeoWorldMap({ geo, geoSel, setGeoSel }) {
  const [world, setWorld] = useState(null);      // null=laedt, Array=Features
  const [mapErr, setMapErr] = useState(null);    // gesetzt, wenn KEINE Quelle trug
  const [beben, setBeben] = useState(null);      // null=laedt, [] = keine/Fehler
  const [bebenErr, setBebenErr] = useState(null);

  // Erdbeben des USGS: die einzige Geo-Quelle hier mit echten KOORDINATEN.
  // UCDP nennt Laendernamen, GDELT zaehlt Artikel je Land - beides laesst sich
  // nur flaechig einfaerben. Direkt aus dem Browser abgerufen (der USGS setzt
  // CORS-Kopfzeilen), aus zwei Gruenden:
  //   1. geopolitics.js laeuft schon am Anschlag seines Zeitbudgets.
  //   2. So erscheinen die Beben auch dann, wenn diese Function ganz ausfaellt.
  // Faellt der Abruf aus, bleibt die Karte vollstaendig funktionsfaehig - die
  // Beben sind eine Ergaenzung, keine Voraussetzung.
  useEffect(() => {
    let cancelled = false;
    const ctrl = new AbortController();
    const to = setTimeout(() => ctrl.abort(), 8000);
    (async () => {
      try {
        const res = await fetch(window.Quakes.feedUrl("4.5", "week"), { signal: ctrl.signal });
        if (!res.ok) throw new Error("HTTP " + res.status);
        const gj = await res.json();
        if (!cancelled) setBeben(window.Quakes.parseQuakes(gj));
      } catch (e) {
        if (!cancelled) {
          setBeben([]);
          setBebenErr(ctrl.signal.aborted ? "Zeitüberschreitung nach 8s" : (e && e.message) || String(e));
        }
      } finally { clearTimeout(to); }
    })();
    return () => { cancelled = true; ctrl.abort(); };
  }, []);

  useEffect(() => {
    let cancelled = false;
    (async () => {
      const fehler = [];
      for (const src of GEO_MAP_SOURCES) {
        const ctrl = new AbortController();
        // Ohne Timeout haengt "Weltkarte lädt…" ewig, falls der CDN nicht antwortet.
        const to = setTimeout(() => ctrl.abort(), 10000);
        try {
          const res = await fetch(src.url, { signal: ctrl.signal });
          if (!res.ok) throw new Error("HTTP " + res.status);
          const gj = await res.json();
          const features = gj && Array.isArray(gj.features) ? gj.features : null;
          if (!features || !features.length) throw new Error("keine Features in der Antwort");
          if (!cancelled) setWorld(features);
          return;
        } catch (e) {
          fehler.push(`${src.name}: ${ctrl.signal.aborted ? "Zeitüberschreitung nach 10s" : (e && e.message) || e}`);
        } finally { clearTimeout(to); }
      }
      if (!cancelled) setMapErr(fehler.join(" | "));
    })();
    return () => { cancelled = true; };
  }, []);

  if (mapErr) {
    return (
      <div className="note note--warn" style={{ marginBottom: 8, fontSize: "var(--fs-2xs)" }}>
        ⚠ Weltkarte nicht ladbar ({mapErr}). Die Länderliste unten ist davon nicht betroffen und zeigt dieselben Daten.
      </div>
    );
  }
  if (world === null) return <div className="muted" style={{ padding: "8px 0" }}>Weltkarte lädt…</div>;

  // Gleichwinklige Zylinderprojektion: 360° Laenge auf 180° Breite ergibt
  // zwingend ein 2:1-Verhaeltnis. Vorher stand hier H=500 bei W=960 - dadurch
  // war die Karte um gut 4% vertikal gestreckt.
  const W = 960, H = 480;
  const project = (lon, lat) => [((lon + 180) / 360) * W, ((90 - lat) / 180) * H];
  const ringPath = (ring) => {
    let d = "";
    for (let i = 0; i < ring.length; i++) {
      const pt = ring[i];
      if (!Array.isArray(pt)) continue;
      const [x, y] = project(pt[0], pt[1]);
      // Ein einziger fehlerhafter Punkt wuerde sonst "NaN,NaN" in den Pfad
      // schreiben und damit das GESAMTE Land unsichtbar machen.
      if (!isFinite(x) || !isFinite(y)) continue;
      d += (d === "" ? "M" : "L") + x.toFixed(1) + "," + y.toFixed(1);
    }
    return d ? d + "Z" : "";
  };
  const geomPath = (geom) => {
    if (!geom) return "";
    if (geom.type === "Polygon") return (geom.coordinates || []).map(ringPath).join(" ");
    if (geom.type === "MultiPolygon") return (geom.coordinates || []).map((poly) => (poly || []).map(ringPath).join(" ")).join(" ");
    return "";
  };
  // Der ISO3-Code steckt je nach Quelle woanders: world.geo.json fuehrt ihn als
  // feature.id, Natural Earth in den properties. Bei Natural Earth ist ISO_A3
  // ausserdem fuer einige Staaten (u.a. Frankreich und Norwegen) auf "-99"
  // gesetzt - der tatsaechliche Code steht dort nur in ISO_A3_EH. Ohne diese
  // Sonderbehandlung blieben genau diese Laender auf der Karte ungefaerbt.
  const isoOf = (f) => {
    const p = f.properties || {};
    for (const cand of [f.id, p.iso_a3, p.ISO_A3, p.ISO_A3_EH, p.ADM0_A3, p.iso3]) {
      const v = String(cand || "").toUpperCase();
      if (v && v !== "-99" && v.length === 3) return v;
    }
    return "";
  };

  return (
    <div className="panel" style={{ padding: 8, marginBottom: 8 }}>
      <svg viewBox={`0 0 ${W} ${H}`} style={{ width: "100%", height: "auto", display: "block", background: "#050608" }}>
        {world.map((f, i) => {
          const iso = isoOf(f);
          const entry = geo && geo.countries ? geo.countries[iso] : null;
          const d = geomPath(f.geometry);
          if (!d) return null;
          const on = iso === geoSel;
          return (
            <path key={i} d={d} fill={entry ? geoLevelMeta(entry.level).color : "#1b1d21"} fillOpacity={entry ? 0.85 : 0.5}
              stroke={on ? C.amber : "#000"} strokeWidth={on ? 1.2 : 0.4}
              onClick={() => entry && setGeoSel(on ? null : iso)} style={{ cursor: entry ? "pointer" : "default" }} />
          );
        })}

        {/* Erdbeben. NACH den Laenderflaechen gezeichnet, damit sie nicht
            verdeckt werden. Schwache Beben zuerst, damit die schweren oben
            liegen - sonst deckt eine Wolke aus M4.5-Punkten ein M7 zu. */}
        {(beben || []).slice().reverse().map((q) => {
          const [x, y] = project(q.lon, q.lat);
          if (!isFinite(x) || !isFinite(y)) return null;
          const r = window.Quakes.radius(q.mag);
          const schwer = q.mag >= 6;
          return (
            <circle key={q.id} cx={x} cy={y} r={r}
              fill={schwer ? C.red : C.amber} fillOpacity={schwer ? 0.55 : 0.35}
              stroke={schwer ? C.red : C.amber} strokeWidth={0.5} strokeOpacity={0.9}>
              <title>{"M" + q.mag.toFixed(1) + (q.ort ? " · " + q.ort : "") + (q.tsunami ? " · Tsunami-Warnung" : "")}</title>
            </circle>
          );
        })}
      </svg>
      <div style={{ display: "flex", gap: 14, flexWrap: "wrap", marginTop: 8 }}>
        {Object.entries(GEO_LEVEL_META).filter(([k]) => k !== "nicht geprüft").map(([k, m]) => (
          <span key={k} className="muted"><span style={{ display: "inline-block", width: 9, height: 9, background: m.color, marginRight: 5 }} />{m.label}</span>
        ))}
        {beben && beben.length > 0 && (<>
          <span className="muted"><span style={{ display: "inline-block", width: 9, height: 9, borderRadius: 9, background: C.amber, marginRight: 5 }} />Erdbeben M4.5+</span>
          <span className="muted"><span style={{ display: "inline-block", width: 11, height: 11, borderRadius: 11, background: C.red, marginRight: 5 }} />ab M6</span>
        </>)}
      </div>

      {beben === null && <div className="muted" style={{ marginTop: 4, fontSize: "var(--fs-2xs)" }}>Erdbeben laden…</div>}
      {beben && beben.length > 0 && (() => {
        const z = window.Quakes.zusammenfassung(beben);
        return (
          <div className="muted" style={{ marginTop: 4, fontSize: "var(--fs-2xs)", lineHeight: 1.5 }}>
            {z.anzahl} Erdbeben ab M4.5 in den letzten 7 Tagen · {z.abM6} davon ab M6
            {z.mitTsunami > 0 ? " · " + z.mitTsunami + " mit Tsunami-Warnung" : ""}
            {z.staerkstes ? " · stärkstes M" + z.staerkstes.mag.toFixed(1) + (z.staerkstes.ort ? " (" + z.staerkstes.ort + ")" : "") : ""}
            {" · Quelle: USGS, ohne Zugangsschlüssel"}
          </div>
        );
      })()}
      {bebenErr && (
        <div className="muted" style={{ marginTop: 4, fontSize: "var(--fs-2xs)", color: C.amber }}>
          ⚠ Erdbebendaten nicht ladbar ({bebenErr}). Karte und Länderliste sind davon nicht betroffen.
        </div>
      )}
    </div>
  );
}

/* ================= MONTE-CARLO-FENSTER =================
 *
 * Eigenes Fenster (Overlay ueber der App), in dem die Simulation LIVE ablaeuft:
 * jeder Durchlauf erscheint als einzelner Punkt.
 *
 * WARUM CANVAS UND NICHT SVG: Bei mehreren tausend Durchlaeufen waere ein
 * DOM-Knoten je Punkt zu teuer - React muesste bei jedem Bild eine wachsende
 * Elementliste abgleichen, und genau das ruckelt auf dem Handy. Auf Canvas wird
 * jeder Punkt EINMAL gezeichnet und nie wieder angefasst; die Zeichenlast ist
 * damit unabhaengig davon, wie viele Punkte schon dastehen.
 *
 * WARUM EIN OVERLAY UND KEIN ECHTES BROWSERFENSTER: window.open() wird von
 * Pop-up-Blockern regelmaessig verworfen (auf Mobilgeraeten fast immer), und
 * ein zweites Fenster braeuchte React, Babel und das CSS ein zweites Mal. Das
 * Overlay verhaelt sich wie ein Fenster (Titelzeile, Schliessen, Esc), geht
 * aber ueberall.
 */
// Eingabefelder der Annahmen. BEWUSST AUSSERHALB von MonteCarloPanel:
// Waeren sie im Rumpf der Komponente definiert, entstuende bei jedem Rendern
// ein NEUER Komponententyp. React kann den dann nicht wiedererkennen, haengt
// das <input> aus und neu ein - und der Fokus geht bei jedem Tastendruck
// verloren. Eine mehrstellige Zahl liesse sich gar nicht eintippen.
function MCFeld({ ann, setAnn, gruppe, schluessel, disabled }) {
  return (
    <input className="field" type="number" step="0.5" disabled={disabled}
      value={ann && ann[gruppe] ? +(ann[gruppe][schluessel] * 100).toFixed(2) : ""}
      onChange={(e) => {
        const v = parseFloat(e.target.value);
        if (isNaN(v)) return;
        setAnn((a) => Object.assign({}, a, { [gruppe]: Object.assign({}, a[gruppe], { [schluessel]: v / 100 }) }));
      }}
      style={{ width: 62, padding: "2px 4px" }} />
  );
}
function MCAnnahmeZeile({ label, gruppe, hinweis, ann, setAnn, disabled }) {
  return (
    <div style={{ display: "flex", alignItems: "center", gap: 6, marginBottom: 5, flexWrap: "wrap" }}>
      <span className="stat__k" style={{ width: 120, flexShrink: 0 }}>{label}</span>
      <MCFeld ann={ann} setAnn={setAnn} gruppe={gruppe} schluessel="min" disabled={disabled} /><span className="muted">–</span>
      <MCFeld ann={ann} setAnn={setAnn} gruppe={gruppe} schluessel="mode" disabled={disabled} /><span className="muted">–</span>
      <MCFeld ann={ann} setAnn={setAnn} gruppe={gruppe} schluessel="max" disabled={disabled} />
      <span className="muted" style={{ fontSize: "var(--fs-2xs)" }}>%{hinweis ? " · " + hinweis : ""}</span>
    </div>
  );
}

function MonteCarloPanel({ d }) {
  const canvasRef = useRef(null);
  const laufRef = useRef(null);   // Zustand des laufenden Simulationslaufs
  const rafRef = useRef(0);

  const [laeuft, setLaeuft] = useState(false);
  const [fortschritt, setFortschritt] = useState({ done: 0, skipped: 0 });
  const [ergebnis, setErgebnis] = useState(null);
  const [achse, setAchse] = useState(null);
  const [seed, setSeed] = useState(12345);
  // Von Hand eingetragener freier Cashflow (in Milliarden), fuer den Fall, dass
  // die Kapitalflussrechnung fehlt - siehe Kommentar bei `basis`.
  const [manuellMrd, setManuellMrd] = useState("");

  const GESAMT = 4000;
  const PILOT = 400;    // Vorlauf, nur um die Skala festzulegen (siehe unten)
  const PRO_BILD = 60;

  // ---- Ausgangsgroessen aus den echten Zahlen des Wertes -------------------
  //
  // Bewusst defensiv ueber window.*: faellt eine der Logikdateien aus, zeigt
  // der Reiter einen Hinweis statt die ganze App mitzureissen.
  //
  // WICHTIG - warum es hier eine Handeingabe gibt: Der freie Cashflow kommt aus
  // der Kapitalflussrechnung, und Yahoo liefert die nicht fuer jeden Titel.
  // mc.js hat dafuer schon eine Rueckfallebene (EBIT nach Steuern +
  // Abschreibungen), aber auch die braucht die Investitionen. Faellt beides
  // aus, war die ganze Bewertung frueher gesperrt - wegen fehlender Daten, die
  // man in zwei Sekunden aus dem Geschaeftsbericht abtippen kann. Deshalb: wenn
  // nichts abzuleiten ist, ein Eingabefeld statt einer Sackgasse.
  const basis = useMemo(() => {
    const MCmod = window.MC;
    if (!MCmod || !window.Ratios) return { fehler: "Rechenmodul nicht geladen (mc.js/ratios.js)." };
    const rows = (d && d.fundamentals) || [];
    const marketCap = (d && d.mktcap != null) ? d.mktcap * 1e9 : null;
    const r = rows.length ? window.Ratios.computeRatios(rows[0], rows[1] || null) : null;
    const netDebt = (r && r.netDebt != null) ? r.netDebt : 0;

    const handEingabe = parseFloat(manuellMrd);
    // Ein eingetragener Wert <= 0 wurde frueher einfach ignoriert und die
    // Anzeige fiel wortlos auf den Bilanzwert zurueck - der Nutzer sah nicht,
    // dass seine Eingabe verworfen wurde. Jetzt wird der Fall benannt.
    const handUngueltig = !isNaN(handEingabe) && handEingabe <= 0;
    const hand = (!isNaN(handEingabe) && handEingabe > 0) ? handEingabe * 1e9 : null;

    const p = rows.length ? MCmod.suggestParams(rows) : null;
    // Der freie Cashflow ueber ALLE vorhandenen Jahre - noetig, um ein
    // einzelnes Investitionsjahr von dauerhaftem Geldverbrennen zu trennen.
    const lage = rows.length ? MCmod.freeCashflowLage(rows) : null;

    // Handeingabe hat Vorrang: wer sie ausfuellt, will genau diesen Wert.
    if (hand != null) {
      const basisP = p || {
        years: 10,
        growth: { min: -0.01, mode: 0.03, max: 0.07 },
        discountRate: { min: 0.07, mode: 0.09, max: 0.11 },
        terminalGrowth: { min: 0.005, mode: 0.02, max: 0.03 },
        histGrowth: null,
      };
      return {
        p: Object.assign({}, basisP, { fcf0: hand, fcfBasis: "hand", fcfLabel: "von Hand eingetragen", fcfGenau: true }),
        netDebt: netDebt, marketCap: marketCap, handAktiv: true,
      };
    }

    if (!rows.length) return { fehler: "Für diesen Wert liegen keine Bilanzdaten vor.", brauchtHand: true, handUngueltig: handUngueltig, netDebt: 0, marketCap: marketCap };
    if (!p) return { fehler: "Yahoo liefert für diesen Wert keine verwertbare Kapitalflussrechnung (weder operativer Cashflow noch Investitionen).", brauchtHand: true, handUngueltig: handUngueltig, netDebt: netDebt, marketCap: marketCap };
    if (p.fcf0 <= 0) {
      // NEGATIVER FREIER CASHFLOW. Ein DCF setzt einen positiven Ausgangswert
      // voraus: ein negativer, mit Wachstum hochgerechnet, wird nur negativer,
      // und der Fortfuehrungswert ebenfalls - das Ergebnis waere eine Zahl ohne
      // Aussage. Die Bewertung wird deshalb nicht gerechnet.
      //
      // Wichtig ist aber die Unterscheidung, die frueher fehlte: EIN negatives
      // Jahr (Uebernahme, Investitionszyklus) ist etwas anderes als dauerhaft
      // negative Cashflows. Im ersten Fall wird der Mehrjahresschnitt als
      // Ausgangswert angeboten, im zweiten ist der DCF schlicht das falsche
      // Werkzeug - und das gehoert gesagt, nicht kaschiert.
      return {
        fehler: null, negativ: true, lage: lage, fcfLabel: p.fcfLabel,
        brauchtHand: true, handUngueltig: handUngueltig,
        netDebt: netDebt, marketCap: marketCap,
      };
    }

    return { p: p, netDebt: netDebt, marketCap: marketCap, lage: lage, handUngueltig: handUngueltig };
  }, [d, manuellMrd]);

  const [ann, setAnn] = useState(null);
  useEffect(() => { if (basis && basis.p) setAnn(basis.p); }, [basis]);

  // Handeingabe beim Wechsel des Wertes zuruecksetzen. Ohne das wuerde ein fuer
  // Firma A eingetragener Cashflow stillschweigend auch fuer Firma B verwendet -
  // die Anzeige saehe voellig normal aus ("Basis: von Hand eingetragen"), waere
  // aber eine Bewertung mit den Zahlen eines fremden Unternehmens. Genau die
  // Art stiller Falschauskunft, die das Modul sonst ueberall vermeidet.
  useEffect(() => { setManuellMrd(""); }, [d && d.s]);

  // Laufenden Lauf abbrechen, wenn der Reiter verlassen wird - sonst zeichnet
  // die Schleife auf ein Canvas, das es nicht mehr gibt.
  useEffect(() => () => { if (rafRef.current) cancelAnimationFrame(rafRef.current); }, []);

  function canvasSetup() {
    const cv = canvasRef.current;
    if (!cv) return null;
    const dpr = window.devicePixelRatio || 1;
    const br = cv.getBoundingClientRect();
    cv.width = Math.max(1, Math.round(br.width * dpr));
    cv.height = Math.max(1, Math.round(br.height * dpr));
    const ctx = cv.getContext("2d");
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, br.width, br.height);
    return { ctx: ctx, w: br.width, h: br.height };
  }

  function zeichneRahmen(g, lo, hi, marketCap, ausserhalb) {
    const { ctx, w, h } = g;
    ctx.clearRect(0, 0, w, h);
    if (marketCap == null || !(hi > lo)) return;
    // Linie des heutigen Boersenwerts: DIE Bezugsgroesse. Punkte darueber =
    // Durchlaeufe, in denen die Firma mehr wert waere als sie kostet.
    //
    // Liegt der Boersenwert ausserhalb der Skala, wird die Linie an den
    // entsprechenden Rand gelegt und dicker/durchgezogen gezeichnet - so ist
    // sofort erkennbar, dass sie eine Richtung anzeigt und keinen Ort. Eine
    // gestrichelte Linie am Rand haette wie ein echter Messwert ausgesehen.
    const y = ausserhalb === "oben" ? 1.5
      : ausserhalb === "unten" ? h - 1.5
        : h - ((marketCap - lo) / (hi - lo)) * h;
    ctx.strokeStyle = C.amber;
    ctx.lineWidth = ausserhalb ? 3 : 1;
    ctx.setLineDash(ausserhalb ? [] : [4, 4]);
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(w, y); ctx.stroke();
    ctx.setLineDash([]);
  }

  // Zeichnet die neuen Werte eines Stapels.
  //
  // Die X-Achse ist der VERSUCHSZAEHLER, nicht der Index in der Werteliste.
  // Sonst endete die Punktwolke bei verworfenen Durchlaeufen vor dem rechten
  // Rand (bei 50% Verwuerfen mittendrin) - es saehe aus, als waere der Lauf
  // haengengeblieben. Die gueltigen Werte eines Stapels werden deshalb ueber
  // die Versuchsspanne verteilt, aus der sie stammen.
  //
  // Werte AUSSERHALB der Skala werden weggelassen, nicht an den Rand geklemmt:
  // Klemmen erzeugt eine dichte Linie am oberen/unteren Rand, die wie eine
  // echte Haeufung aussieht, in Wahrheit aber nur "alles was drueber liegt"
  // bedeutet. Genau diese Art stiller Falschaussage soll die Anzeige nicht
  // machen. Die Kennzahlen unter dem Bild rechnen ohnehin mit ALLEN Werten.
  function zeichnePunkte(g, werte, vonIndex, versuchVon, versuchBis, lo, hi, marketCap) {
    const { ctx, w, h } = g;
    if (!(hi > lo)) return;
    const neu = werte.length - vonIndex;
    if (neu <= 0) return;
    const spanne = Math.max(versuchBis - versuchVon, 1);
    ctx.globalAlpha = 0.55;
    for (let k = 0; k < neu; k++) {
      const v = werte[vonIndex + k];
      if (v < lo || v > hi) continue;
      const versuch = versuchVon + ((k + 0.5) / neu) * spanne;
      const x = (versuch / GESAMT) * w;
      const y = h - ((v - lo) / (hi - lo)) * h;
      ctx.fillStyle = (marketCap != null && v > marketCap) ? C.green : C.red;
      ctx.fillRect(x, y, 1.6, 1.6);
    }
    ctx.globalAlpha = 1;
  }

  function start() {
    const MCmod = window.MC;
    if (!MCmod || !ann || !basis || basis.fehler) return;
    if (rafRef.current) cancelAnimationFrame(rafRef.current);

    const g = canvasSetup();
    if (!g) return;

    const params = {
      fcf0: basis.p.fcf0, netDebt: basis.netDebt, years: ann.years || 10,
      growth: ann.growth, discountRate: ann.discountRate, terminalGrowth: ann.terminalGrowth,
    };
    laufRef.current = {
      rng: MCmod.mulberry32(seed), params: params, g: g,
      werte: [], skipped: 0, gezeichnet: 0, versuche: 0, lo: null, hi: null, phase: "pilot",
    };
    setErgebnis(null); setAchse(null);
    setFortschritt({ done: 0, skipped: 0 });
    setLaeuft(true);
    rafRef.current = requestAnimationFrame(schritt);
  }

  function stop() {
    if (rafRef.current) cancelAnimationFrame(rafRef.current);
    rafRef.current = 0;
    setLaeuft(false);
    const L = laufRef.current;
    if (L && L.werte.length) setErgebnis(window.MC.summarize(L.werte, basis.marketCap));
  }

  function schritt() {
    const L = laufRef.current;
    const MCmod = window.MC;
    if (!L || !MCmod) return;

    // PHASE 1 (Pilot): Erst rechnen, dann Skala festlegen, DANN zeichnen.
    // Ohne diesen Vorlauf muesste die Achse mitwachsen und alle bereits
    // gezeichneten Punkte staenden an der falschen Stelle - man muesste bei
    // jedem Bild alles neu zeichnen, und die Anzeige wuerde springen.
    if (L.phase === "pilot") {
      const r = MCmod.runBatch(PILOT, L.params, L.rng);
      L.werte = r.values; L.skipped = r.skipped;
      if (!L.werte.length) { stop(); return; }
      const sortiert = L.werte.slice().sort((a, b) => a - b);
      // Robuste Grenzen: einzelne Extremwerte (sehr niedrige Abzinsung) wuerden
      // die Achse sonst so weit aufziehen, dass die Punktwolke zu einem Strich
      // zusammenfaellt. 2%/98% statt min/max.
      let lo = MCmod.percentile(sortiert, 0.02);
      let hi = MCmod.percentile(sortiert, 0.98);

      // Die Skala folgt den DATEN. Frueher wurde der Boersenwert bedingungslos
      // hineingezwungen (Math.min/Math.max) - liegt er weit weg, presste das
      // die ganze Punktwolke zu einem Strich zusammen. Live beobachtet bei
      // Tencent: Boersenwert 4,10 Bio. HKD gegen errechnete 143-256 Mrd., die
      // Verteilung war nicht mehr lesbar.
      //
      // Jetzt wird er nur einbezogen, wenn er in der Naehe liegt (halbe
      // Datenbreite Zugabe). Sonst bleibt die Wolke lesbar und der Boersenwert
      // wird als "ausserhalb" am Rand markiert - die Aussage steckt ohnehin
      // im Text darunter ("in N% der Durchlaeufe darueber").
      const breite = (hi - lo) || Math.abs(hi) || 1;
      let ausserhalb = null;
      if (basis.marketCap != null) {
        if (basis.marketCap < lo - breite * 0.5) ausserhalb = "unten";
        else if (basis.marketCap > hi + breite * 0.5) ausserhalb = "oben";
        else { lo = Math.min(lo, basis.marketCap); hi = Math.max(hi, basis.marketCap); }
      }
      const luft = (hi - lo) * 0.08 || Math.abs(hi) * 0.1 || 1;
      L.lo = lo - luft; L.hi = hi + luft; L.ausserhalb = ausserhalb;
      setAchse({ lo: L.lo, hi: L.hi, ausserhalb: ausserhalb });
      zeichneRahmen(L.g, L.lo, L.hi, basis.marketCap, ausserhalb);
      zeichnePunkte(L.g, L.werte, 0, 0, PILOT, L.lo, L.hi, basis.marketCap);
      L.gezeichnet = L.werte.length;
      L.versuche = PILOT;
      L.phase = "lauf";
      setFortschritt({ done: L.werte.length + L.skipped, skipped: L.skipped });
      rafRef.current = requestAnimationFrame(schritt);
      return;
    }

    // PHASE 2: stapelweise weiterrechnen und nur die NEUEN Punkte zeichnen.
    const offen = GESAMT - L.versuche;
    const n = Math.min(PRO_BILD, offen);
    if (n > 0) {
      const r = MCmod.runBatch(n, L.params, L.rng);
      for (let i = 0; i < r.values.length; i++) L.werte.push(r.values[i]);
      L.skipped += r.skipped;
      zeichnePunkte(L.g, L.werte, L.gezeichnet, L.versuche, L.versuche + n, L.lo, L.hi, basis.marketCap);
      L.gezeichnet = L.werte.length;
      L.versuche += n;
      setFortschritt({ done: L.versuche, skipped: L.skipped });
    }
    if (L.versuche >= GESAMT) {
      setErgebnis(MCmod.summarize(L.werte, basis.marketCap));
      setLaeuft(false);
      rafRef.current = 0;
      return;
    }
    rafRef.current = requestAnimationFrame(schritt);
  }

  const cur = d.currency || "";
  const pct = (x) => (x == null ? "—" : (x >= 0 ? "+" : "") + (x * 100).toFixed(1) + "%");
  // EIGENE Geldformatierung statt fmtCap. Grund: fmtCap haengt nur "B" oder "T"
  // an - zwei Buchstaben, die sich auf einem Bildschirm kaum unterscheiden,
  // obwohl zwischen ihnen der Faktor 1000 liegt. Bei einer Bewertung ist genau
  // das der Unterschied zwischen "plausibel" und "voelliger Unsinn", und man
  // sieht ihn der Zahl nicht an. Ausgeschriebene Einheiten (Mrd./Bio.) sind
  // unverwechselbar. Zusaetzlich zwei Nachkommastellen: fmtCap rundet in der
  // Milliarden-Stufe auf eine Stelle, aus 98,98 wird dort "99.0B".
  const geld = (x) => {
    if (x == null) return "—";
    const a = Math.abs(x);
    const zahl = (v, n) => v.toLocaleString("de-DE", { minimumFractionDigits: n, maximumFractionDigits: n });
    if (a >= 1e12) return zahl(x / 1e12, 2) + " Bio.";
    if (a >= 1e9) return zahl(x / 1e9, 2) + " Mrd.";
    if (a >= 1e6) return zahl(x / 1e6, 2) + " Mio.";
    return zahl(x, 0);
  };
  // Der exakte Betrag, ausgeschrieben. Steht klein unter dem freien Cashflow:
  // er ist der Ausgangswert der ganzen Rechnung, und wenn dort eine
  // Groessenordnung danebenliegt, ist jedes Ergebnis wertlos. Ziffern zaehlen
  // koennen schlaegt jede Abkuerzung.
  const geldExakt = (x) => (x == null ? "—" : Math.round(x).toLocaleString("de-DE"));

  // Handeingabe: steht sowohl als Rueckfallebene bei fehlenden Daten als auch
  // dauerhaft zum Ueberschreiben bereit (eigene Schaetzung statt Bilanzwert).
  const handFeld = (
    <div style={{ display: "flex", alignItems: "center", gap: 6, flexWrap: "wrap", marginTop: 8 }}>
      <span className="stat__k">FREIER CASHFLOW VON HAND</span>
      <input className="field" type="number" step="0.1" disabled={laeuft}
        value={manuellMrd} onChange={(e) => setManuellMrd(e.target.value)}
        placeholder="z.B. 2.4" style={{ width: 90, padding: "2px 4px" }} />
      <span className="muted" style={{ fontSize: "var(--fs-2xs)" }}>Mrd. {d.currency || ""} · überschreibt den Bilanzwert</span>
      {manuellMrd !== "" && <button className="btn btn--ghost" onClick={() => setManuellMrd("")} disabled={laeuft}>zurücksetzen</button>}
      {basis.handUngueltig && (
        <span style={{ color: C.amber, fontSize: "var(--fs-2xs)", width: "100%" }}>
          ⚠ Der Wert muss größer als 0 sein — ein negativer Ausgangswert ergibt im DCF keine sinnvolle Bewertung. Die Eingabe wird nicht verwendet.
        </span>
      )}
    </div>
  );

  return (
    <div className="page">
      <Panel title={<>◈ MONTE CARLO · {d.s} <span className="muted" style={{ fontWeight: 400 }}>Bewertungs-Bandbreite</span></>}>
        <div>
          {basis.negativ ? (<>
            <div className="note note--warn">
              <b>Der freie Cashflow ist negativ</b> — die Firma hat im letzten Geschäftsjahr mehr Geld ausgegeben als eingenommen
              ({basis.fcfLabel}).
              <div style={{ marginTop: 6 }}>
                Ein DCF rechnet den Ausgangswert in die Zukunft hoch. Ist er negativ, wird er durch das Wachstum nur negativer,
                und der Fortführungswert ebenso — heraus käme eine Zahl ohne Aussage. Deshalb wird hier nicht gerechnet.
              </div>
            </div>

            {basis.lage && basis.lage.serie.length > 0 && (
              <div style={{ marginTop: 10 }}>
                <div className="stat__k" style={{ marginBottom: 4 }}>FREIER CASHFLOW JE JAHR</div>
                {basis.lage.serie.map((j) => (
                  <Stat key={j.year} k={String(j.year)} v={geld(j.wert) + " " + cur} color={j.wert > 0 ? C.green : C.red} />
                ))}
                <div className="muted" style={{ marginTop: 6, lineHeight: 1.5 }}>
                  {basis.lage.positiveJahre} von {basis.lage.jahre} Jahren positiv · Durchschnitt {geld(basis.lage.schnitt)} {cur}
                </div>

                {basis.lage.schnittTaugt ? (
                  <div style={{ marginTop: 8 }}>
                    <div className="muted" style={{ lineHeight: 1.5, marginBottom: 6 }}>
                      Die Mehrzahl der Jahre ist positiv — das letzte Jahr sieht nach einem einzelnen Investitions- oder
                      Sonderjahr aus, nicht nach einem dauerhaft negativen Geschäft. Der Mehrjahresschnitt (die negativen
                      Jahre eingerechnet) ist als Ausgangswert vertretbar:
                    </div>
                    <button className="btn btn--go" disabled={laeuft}
                      onClick={() => setManuellMrd((basis.lage.schnitt / 1e9).toFixed(2))}>
                      ▶ Durchschnitt {geld(basis.lage.schnitt)} {cur} verwenden
                    </button>
                  </div>
                ) : (
                  <div className="muted" style={{ marginTop: 8, lineHeight: 1.5 }}>
                    Auch über mehrere Jahre kommt kein tragfähiger positiver Cashflow zusammen. Dann ist ein DCF hier das
                    falsche Werkzeug — nicht ungenau, sondern unanwendbar. Für solche Firmen bewertet man üblicherweise über
                    Umsatzmultiplikatoren oder wartet, bis der Cashflow dreht. Ein eigener Schätzwert lässt sich unten
                    eintragen, dann rechnet die Simulation damit.
                  </div>
                )}
              </div>
            )}
            <div style={{ marginTop: 10 }}>{handFeld}</div>
          </>) : basis.fehler ? (<>
            <div className="note note--warn">{basis.fehler}</div>
            {basis.brauchtHand && (
              <div style={{ marginTop: 10 }}>
                <div className="muted" style={{ lineHeight: 1.5 }}>
                  Der freie Cashflow lässt sich hier nicht aus den Daten ableiten. Du kannst ihn von Hand eintragen
                  (Geschäftsbericht: operativer Cashflow minus Investitionen) — die Simulation läuft dann damit.
                </div>
                {handFeld}
              </div>
            )}
          </>) : (<>
            <div className="muted" style={{ marginBottom: 10, lineHeight: 1.5 }}>
              Jeder Punkt ist <b>ein</b> kompletter Durchlauf mit zufällig gezogenen Annahmen.
              Die gestrichelte Linie ist der heutige Börsenwert: Punkte <span style={{ color: C.green }}>darüber</span> sind
              Durchläufe, in denen die Firma mehr wert wäre als sie kostet, <span style={{ color: C.red }}>darunter</span> weniger.
              Keine Prognose und keine Anlageberatung — eine Rechnung über Annahmen, die Sie selbst setzen.
            </div>

            <div className="grid-pair" style={{ gap: 10, marginBottom: 10 }}>
              <div>
                <MCAnnahmeZeile label="WACHSTUM p.a." gruppe="growth" ann={ann} setAnn={setAnn} disabled={laeuft}
                  hinweis={basis.p.histGrowth != null ? "historisch " + pct(basis.p.histGrowth) : "kein Vorjahr"} />
                <MCAnnahmeZeile label="KAPITALKOSTEN" gruppe="discountRate" ann={ann} setAnn={setAnn} disabled={laeuft} hinweis="Annahme" />
                <MCAnnahmeZeile label="EWIGES WACHSTUM" gruppe="terminalGrowth" ann={ann} setAnn={setAnn} disabled={laeuft} hinweis="nach 10 J." />
              </div>
              <div>
                <Stat k="FREIER CASHFLOW" v={geld(basis.p.fcf0) + " " + cur} />
                <div className="muted" style={{ fontSize: "var(--fs-2xs)", marginTop: -2, marginBottom: 4, color: basis.p.fcfGenau ? undefined : C.amber }}>
                  {basis.p.fcfGenau ? "Basis: " : "⚠ "}{basis.p.fcfLabel}
                  <span style={{ display: "block", color: C.muted }}>= {geldExakt(basis.p.fcf0)} {cur}</span>
                </div>
                <Stat k="NETTOSCHULDEN" v={geld(basis.netDebt) + " " + cur} />
                <Stat k="BÖRSENWERT HEUTE" v={basis.marketCap != null ? geld(basis.marketCap) + " " + cur : "—"} />
                <div style={{ display: "flex", gap: 6, marginTop: 8, alignItems: "center", flexWrap: "wrap" }}>
                  <button className="btn btn--go" onClick={laeuft ? stop : start}>
                    {laeuft ? "■ STOPP" : "▶ " + GESAMT.toLocaleString("de-DE") + " DURCHLÄUFE"}
                  </button>
                  <span className="stat__k">STARTWERT</span>
                  <input className="field" type="number" value={seed} disabled={laeuft}
                    onChange={(e) => setSeed(parseInt(e.target.value, 10) || 0)} style={{ width: 82, padding: "2px 4px" }} />
                </div>
              </div>
            </div>

            {/* Die Punktwolke */}
            <div style={{ position: "relative", border: "1px solid var(--line)", background: C.bg }}>
              <canvas ref={canvasRef} style={{ width: "100%", height: 260, display: "block" }} />
              {achse && (<>
                <span className="muted" style={{ position: "absolute", top: 3, left: 5, fontSize: "var(--fs-2xs)" }}>{geld(achse.hi)} {cur}</span>
                <span className="muted" style={{ position: "absolute", bottom: 3, left: 5, fontSize: "var(--fs-2xs)" }}>{geld(achse.lo)} {cur}</span>
                {achse.ausserhalb && (
                  <span style={{ position: "absolute", left: 5, fontSize: "var(--fs-2xs)", color: C.amber, fontWeight: 700,
                    top: achse.ausserhalb === "oben" ? 16 : undefined, bottom: achse.ausserhalb === "unten" ? 16 : undefined }}>
                    {achse.ausserhalb === "oben" ? "↑" : "↓"} Börsenwert {geld(basis.marketCap)} {cur} — außerhalb der Skala
                  </span>
                )}
              </>)}
              {!achse && !laeuft && (
                <div className="muted" style={{ position: "absolute", inset: 0, display: "flex", alignItems: "center", justifyContent: "center" }}>
                  Auf ▶ drücken — die Punkte erscheinen einzeln, während gerechnet wird.
                </div>
              )}
            </div>

            {achse && achse.ausserhalb && (
              <div className="muted" style={{ marginTop: 4, lineHeight: 1.5 }}>
                Der Börsenwert liegt weit {achse.ausserhalb === "oben" ? "über" : "unter"} allen errechneten Werten.
                Die Skala folgt deshalb der Punktwolke, damit sie lesbar bleibt — die dicke Linie am Rand zeigt nur
                die <b>Richtung</b>, nicht die Höhe. Bei so großem Abstand lohnt ein Blick auf den freien Cashflow:
                ein zu niedrig angesetzter Wert erzeugt genau dieses Bild.
              </div>
            )}
            <div style={{ display: "flex", gap: 14, marginTop: 6, flexWrap: "wrap" }} className="muted">
              <span>{fortschritt.done.toLocaleString("de-DE")} / {GESAMT.toLocaleString("de-DE")} Durchläufe</span>
              {fortschritt.skipped > 0 && (
                <span style={{ color: C.amber }}>
                  {fortschritt.skipped.toLocaleString("de-DE")} verworfen (Kapitalkosten unter dem ewigen Wachstum — dort ist die Formel nicht definiert)
                </span>
              )}
            </div>

            {ergebnis && (
