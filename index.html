<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="color-scheme" content="dark" />
<title>Terminal</title>
<style>
/* ============================================================================
   DESIGN-TOKENS
   Einzige Stelle, an der Farben, Schriftgroessen und Abstaende definiert sind.
   Die Farbwerte sind mit theme.js (Konstante C) gespiegelt - dort werden sie
   fuer die SVG-Charts gebraucht, wo CSS-Variablen nicht greifen. Beide Stellen
   muessen zusammen gepflegt werden.
   ========================================================================= */
:root{
  /* Flaechen: vier Ebenen statt vorher zwei, damit sich Panel, Panelkopf und
     Tabellenzeilen sichtbar voneinander abheben. */
  --bg:#000000;
  --surface:#0b0c0e;
  --surface-2:#07080a;
  --surface-3:#121316;
  --surface-4:#17191d;

  --line:#24262b;
  --line-strong:#34373d;

  --accent:#ff8a1e;
  --accent-2:#ffb000;
  --accent-dim:#7a5416;
  --accent-bg:#17140a;

  --up:#3fd07a;
  --down:#ff5252;
  --info:#4ea3ff;
  --violet:#c07af0;

  /* Vordergrund: --fg-3 ist bewusst heller als vorher (#7f858f), weil die
     kleinen Beschriftungen darin auf schwarzem Grund kaum lesbar waren. */
  --fg:#e8e9ec;
  --fg-2:#c9cbd0;
  --fg-3:#8f959f;

  /* Typo-Skala. Vorher gab es 13 willkuerliche Groessen von 8.5px bis 25px;
     jetzt sieben Stufen, die konsequent benutzt werden. */
  --fs-2xs:10px;
  --fs-xs:11px;
  --fs-sm:12px;
  --fs-md:13px;
  --fs-lg:15px;
  --fs-xl:19px;
  --fs-hero:26px;

  --sp-1:4px; --sp-2:6px; --sp-3:8px; --sp-4:12px; --sp-5:16px; --sp-6:24px;

  --mono:ui-monospace,'SF Mono','DejaVu Sans Mono',Menlo,monospace;
  --tap:26px;          /* Mindesthoehe klickbarer Elemente */
  --dur:120ms;
}

/* Handy: eine Stufe groesser und groessere Tap-Ziele. Die alten 8.5-10px
   waren auf einem 360px-Display praktisch nicht lesbar. */
@media (max-width:700px){
  :root{
    --fs-2xs:11px; --fs-xs:12px; --fs-sm:13px; --fs-md:14px;
    --fs-lg:16px; --fs-xl:20px; --fs-hero:30px;
    --tap:34px;
    --sp-3:10px; --sp-4:14px;
  }
}

*{box-sizing:border-box;}
html,body{
  margin:0; padding:0;
  background:var(--bg); color:var(--fg-2);
  font-family:var(--mono);
  /* 100dvh statt 100vh: auf Mobil zaehlt vh die ein-/ausblendende Adressleiste
     mit, wodurch das Layout beim Scrollen springt. */
  min-height:100vh; min-height:100dvh;
  -webkit-text-size-adjust:100%;
}
/* Zahlen mit fester Zeichenbreite - sonst "zappeln" Kurse bei jedem Tick,
   weil eine 1 schmaler ist als eine 8. Fuer ein Terminal essenziell. */
body{font-variant-numeric:tabular-nums;}

::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-track{background:var(--surface-2)}
::-webkit-scrollbar-thumb{background:var(--line-strong)}
::-webkit-scrollbar-thumb:hover{background:var(--fg-3)}

/* Sichtbarer Fokus fuer Tastaturbedienung - vorher war outline pauschal
   abgeschaltet, ohne Ersatz. */
:focus-visible{outline:2px solid var(--accent-2); outline-offset:1px;}

@keyframes tape{from{transform:translateX(0)}to{transform:translateX(-50%)}}
@keyframes blink{50%{opacity:0}}
.tape{animation:tape 46s linear infinite;white-space:nowrap;display:inline-block}
.tape-wrap:hover .tape{animation-play-state:paused}
.caret{animation:blink 1.1s step-end infinite}
/* Nutzer, die reduzierte Bewegung eingestellt haben, bekommen keine
   Dauerlaufschrift - die beiden Baender zeichnen sonst permanent neu. */
@media (prefers-reduced-motion:reduce){
  .tape{animation:none}
  .caret{animation:none}
  *{transition:none !important}
}

#boot{padding:var(--sp-6);font-size:var(--fs-lg);color:var(--accent-2);line-height:1.6}
#err{display:none;white-space:pre-wrap;padding:var(--sp-5);margin:var(--sp-4);
     border:1px solid var(--down);border-left:3px solid var(--down);
     color:#ff9c9c;font-size:var(--fs-sm);background:#140505;line-height:1.5}

/* ============================================================================
   BAUSTEINE
   ========================================================================= */

/* --- Panel ---------------------------------------------------------------- */
.panel{background:var(--surface);border:1px solid var(--line);}
.panel__hd{
  display:flex;justify-content:space-between;align-items:center;gap:var(--sp-3);
  padding:var(--sp-2) var(--sp-3);
  background:var(--surface-2);
  border-bottom:1px solid var(--line);
  /* Schmaler Akzentstreifen links - gibt jedem Panel eine klare Kante,
     ohne dass ein zweiter Rahmen noetig ist. */
  box-shadow:inset 2px 0 0 var(--accent-dim);
}
.panel__title{
  color:var(--accent);font-size:var(--fs-2xs);font-weight:700;
  letter-spacing:1.4px;text-transform:uppercase;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis;
}
.panel__bd{padding:var(--sp-3);}

/* --- Kennzahlen-Zeile ----------------------------------------------------- */
.stat{
  display:flex;justify-content:space-between;align-items:baseline;gap:var(--sp-3);
  padding:var(--sp-1) 0;border-bottom:1px solid var(--line);
}
.stat:last-child{border-bottom:none;}
.stat__k{color:var(--fg-3);font-size:var(--fs-2xs);letter-spacing:.4px;}
.stat__v{color:var(--fg);font-size:var(--fs-sm);text-align:right;}

/* --- Buttons -------------------------------------------------------------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;
  min-height:var(--tap);
  background:transparent;color:var(--fg-3);
  border:1px solid var(--line);
  font-family:var(--mono);font-size:var(--fs-2xs);
  padding:var(--sp-1) var(--sp-3);
  cursor:pointer;white-space:nowrap;
  transition:background var(--dur),color var(--dur),border-color var(--dur);
}
.btn:hover:not(:disabled){border-color:var(--accent-dim);color:var(--accent-2);}
.btn:disabled{opacity:.45;cursor:default;}
.btn--on{background:var(--accent-2);color:#000;border-color:var(--accent-2);font-weight:700;}
.btn--on:hover:not(:disabled){color:#000;}
/* Ein-/Ausschalter fuer Chart-Indikatoren: aktiv, aber bewusst leiser als die
   Zeitraum-Auswahl - sonst konkurrieren fuenf gleich laute Elemente ueber dem
   Chart um die Aufmerksamkeit. */
.btn--tog.btn--on{background:var(--accent-bg);color:var(--accent-2);border-color:var(--accent-dim);}
.btn--tog.btn--on:hover:not(:disabled){color:var(--accent-2);}
.btn--ghost{color:var(--accent-2);border-color:var(--accent-dim);}
.btn--solid{background:var(--accent);color:#000;border-color:var(--accent);font-weight:700;font-size:var(--fs-xs);}
.btn--solid:hover:not(:disabled){background:var(--accent-2);color:#000;}
.btn--go{background:var(--up);color:#000;border-color:var(--up);font-weight:700;font-size:var(--fs-sm);padding:var(--sp-2) var(--sp-5);}
.btn--block{width:100%;padding:var(--sp-3);font-size:var(--fs-md);}

/* --- Eingabefelder -------------------------------------------------------- */
.field{
  background:var(--surface-2);border:1px solid var(--line);
  color:var(--fg);font-family:var(--mono);
  /* 16px auf Mobil verhindert, dass iOS beim Antippen ins Feld hineinzoomt. */
  font-size:var(--fs-sm);
  padding:var(--sp-2) var(--sp-3);min-height:var(--tap);outline:none;
}
.field:focus{border-color:var(--accent-dim);}
.field::placeholder{color:var(--fg-3);opacity:.75;}
@media (max-width:700px){ .field, .field--cmd{font-size:16px;} }

/* --- Hinweisboxen --------------------------------------------------------- */
.note{
  padding:var(--sp-2) var(--sp-4);font-size:var(--fs-xs);line-height:1.5;
  border:1px solid var(--line);border-left:3px solid var(--line-strong);
  background:var(--surface-2);color:var(--fg-3);
}
.note--warn{background:var(--accent-bg);border-color:var(--accent-dim);border-left-color:var(--accent-2);color:var(--accent-2);}
.note--err{background:#140505;border-color:var(--down);border-left-color:var(--down);color:#ff9c9c;}
.note--info{border-left-color:var(--info);}

/* --- Tabellen ------------------------------------------------------------- */
.tbl-wrap{background:var(--surface);border:1px solid var(--line);overflow-x:auto;}
.tbl{width:100%;border-collapse:separate;border-spacing:0;font-size:var(--fs-sm);}
.tbl th{
  position:sticky;top:0;z-index:2;
  background:var(--surface-2);
  padding:var(--sp-2) var(--sp-3);
  color:var(--fg-3);font-size:var(--fs-2xs);font-weight:700;
  letter-spacing:.8px;text-align:left;white-space:nowrap;
  border-bottom:1px solid var(--accent-dim);
}
.tbl td{padding:var(--sp-2) var(--sp-3);border-bottom:1px solid var(--line);}
.tbl tbody tr:last-child td{border-bottom:none;}
.tbl .num{text-align:right;}
.tbl th.num{text-align:right;}
.tbl--zebra tbody tr:nth-child(even) td{background:var(--surface-3);}
.tbl--rows tbody tr{cursor:pointer;}
.tbl--rows tbody tr:hover td{background:var(--surface-4);}
/* Erste Spalte beim Querscrollen stehen lassen. Ohne das verliert man beim
   Peer-Vergleich sofort, welche Kennzahl man gerade liest. */
.tbl--stick-first th:first-child,
.tbl--stick-first td:first-child{
  position:sticky;left:0;z-index:1;
  background:var(--surface);
  border-right:1px solid var(--line);
}
.tbl--stick-first th:first-child{z-index:3;background:var(--surface-2);}
.tbl--stick-first.tbl--zebra tbody tr:nth-child(even) td:first-child{background:var(--surface-3);}
/* Auf dem Handy darf die stehenbleibende Spalte nicht die halbe Breite fressen,
   sonst bleibt fuer die eigentlichen Werte kaum Platz. Lange Bezeichnungen
   werden abgeschnitten - der volle Text steht im title-Attribut. */
@media (max-width:700px){
  .tbl--stick-first th:first-child,
  .tbl--stick-first td:first-child{max-width:38vw;overflow:hidden;text-overflow:ellipsis;}
}
.tbl__group td{
  background:var(--surface-2) !important;
  color:var(--info);font-size:var(--fs-2xs);letter-spacing:1.2px;font-weight:700;
  padding:var(--sp-2) var(--sp-3);
}

/* --- Chips / Tags --------------------------------------------------------- */
.chip{
  display:inline-block;color:var(--accent-2);font-size:var(--fs-2xs);
  border:1px solid var(--accent-dim);padding:1px var(--sp-2);white-space:nowrap;
}
.chip--btn{cursor:pointer;}
.chip--btn:hover{background:var(--accent-bg);}

/* --- Kopfleisten ---------------------------------------------------------- */
.topbar{
  display:flex;align-items:center;gap:var(--sp-3);flex-wrap:wrap;
  background:#000;border-bottom:1px solid var(--accent-dim);
  padding:var(--sp-2) var(--sp-4);
  padding-left:max(var(--sp-4),env(safe-area-inset-left));
  padding-right:max(var(--sp-4),env(safe-area-inset-right));
}
.brand{color:var(--accent);font-weight:700;letter-spacing:2px;font-size:var(--fs-md);white-space:nowrap;}
.cmdbox{position:relative;flex:1;min-width:0;}
.cmdbox__in{display:flex;align-items:center;gap:6px;background:var(--surface-2);border:1px solid var(--accent-dim);padding:0 var(--sp-3);}
/* min-width:0 ist hier zwingend: Flex-Kinder haben per Default min-width:auto
   und schrumpfen deshalb nicht unter ihre Inhaltsbreite - das lange Platzhalter-
   Wort hat die Statusanzeige daneben ueberlappt. */
.cmdbox__in input{flex:1;min-width:0;background:transparent;border:none;color:var(--accent-2);padding:var(--sp-2) 0;}
/* Auf dem Handy bekommt die Kommandozeile eine eigene volle Zeile, statt sich
   mit Uhr und Statusanzeige um dieselbe Zeile zu streiten. */
@media (max-width:700px){
  .cmdbox{flex-basis:100%;order:10;}
}
.fbar{
  display:flex;align-items:center;gap:var(--sp-2);flex-wrap:wrap;
  background:#000;border-bottom:1px solid var(--line);
  padding:var(--sp-2) var(--sp-4);
}
/* Auf dem Handy sind die F-Tasten das Wichtigste - sie duerfen scrollen,
   statt in vier Zeilen umzubrechen und den halben Schirm zu fressen. */
@media (max-width:700px){
  .fbar{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;}
  .fbar::-webkit-scrollbar{display:none;}
  .fbar > *{flex:0 0 auto;}
}
.tape-wrap{overflow:hidden;padding:var(--sp-1) 0;border-bottom:1px solid var(--line);}
.tape-wrap--idx{background:#050810;border-bottom-color:#16324d;}
.tape-wrap--wl{background:var(--surface-2);}
.tape__item{margin:0 var(--sp-5);font-size:var(--fs-xs);}

/* --- Layout --------------------------------------------------------------- */
.page{padding:var(--sp-3);
      padding-left:max(var(--sp-3),env(safe-area-inset-left));
      padding-right:max(var(--sp-3),env(safe-area-inset-right));}
.layout{display:grid;grid-template-columns:1fr;gap:var(--sp-3);}
@media (min-width:981px){
  .layout{grid-template-columns:200px minmax(0,1fr) 320px;}
}
/* minmax(0,1fr) statt 1fr: sonst sprengt ein breites Chart-SVG die Spalte,
   weil Grid-Elemente per Default min-width:auto haben. */
.layout > *{min-width:0;}

.grid-auto{display:grid;gap:var(--sp-3);grid-template-columns:repeat(auto-fill,minmax(260px,1fr));}
.grid-auto--sm{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));}
.grid-pair{display:grid;gap:var(--sp-3);grid-template-columns:1fr 1fr;}
/* Auf schmalen Schirmen war das hier fix zweispaltig - Kennzahlen und ihre
   Werte sind dadurch ineinandergelaufen. */
@media (max-width:700px){ .grid-pair{grid-template-columns:1fr;} }

.toolbar{display:flex;gap:var(--sp-2);align-items:center;flex-wrap:wrap;margin-bottom:var(--sp-3);}
.spacer{flex:1;}
.muted{color:var(--fg-3);font-size:var(--fs-xs);}
.empty{
  color:var(--fg-3);font-size:var(--fs-sm);padding:var(--sp-6);text-align:center;
  background:var(--surface);border:1px solid var(--line);
}

/* --- Watchlist ------------------------------------------------------------ */
.wl-row{
  display:grid;grid-template-columns:1fr auto auto auto auto;
  gap:var(--sp-2);align-items:center;
  padding:var(--sp-1) var(--sp-1);margin:0 calc(-1 * var(--sp-1));
  min-height:var(--tap);
  border-left:2px solid transparent;cursor:pointer;
}
.wl-row:hover{background:var(--surface-3);}
.wl-row--on{background:var(--accent-bg);border-left-color:var(--accent);}

/* --- Suchvorschlaege ------------------------------------------------------ */
.suggest{
  position:absolute;top:100%;left:0;right:0;z-index:30;
  background:var(--surface);border:1px solid var(--accent-dim);border-top:none;
  max-height:min(60vh,320px);overflow-y:auto;
}
.suggest__row{
  display:flex;justify-content:space-between;gap:var(--sp-3);
  padding:var(--sp-2) var(--sp-3);min-height:var(--tap);align-items:center;
  cursor:pointer;border-bottom:1px solid var(--line);
}
.suggest__row:last-child{border-bottom:none;}
.suggest__row:hover{background:var(--surface-3);}

/* --- Karten (Sektoren, Laender) ------------------------------------------- */
.card{background:var(--surface);border:1px solid var(--line);padding:var(--sp-3);cursor:pointer;
      transition:border-color var(--dur);}
.card:hover{border-color:var(--line-strong);}

/* --- Links ---------------------------------------------------------------- */
.link{color:var(--fg);text-decoration:none;line-height:1.4;}
.link:hover{color:var(--accent-2);text-decoration:underline;}
</style>
</head>
<body>
<div id="root"><div id="boot">◈ TERMINAL — lädt…<br><span style="color:#7f858f;font-size:12px">Wenn dieser Text hängen bleibt: Internet/Content-Blocker prüfen. Fehler erscheinen unten in Rot.</span></div></div>
<div id="err"></div>

<script>
  window.__err = function(msg){
    var e=document.getElementById('err'); if(!e)return;
    e.style.display='block'; e.textContent='FEHLER:\n'+msg+'\n\n(Screenshot an den Chat schicken.)';
  };
  window.addEventListener('error', function(ev){ window.__err((ev.error && ev.error.stack) || ev.message || String(ev)); });
  window.addEventListener('unhandledrejection', function(ev){ window.__err('Promise: '+((ev.reason && ev.reason.message) || ev.reason)); });
</script>

<!-- CDNs (jsdelivr – meist zuverlässiger auf Mobil) -->
<script src="https://cdn.jsdelivr.net/npm/react@18.2.0/umd/react.production.min.js" crossorigin></script>
<script src="https://cdn.jsdelivr.net/npm/react-dom@18.2.0/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://cdn.jsdelivr.net/npm/@babel/standalone@7.24.7/babel.min.js"></script>

<!-- Reine Rechenlogik: eigenstaendige, nicht transpilierte Dateien (kein Babel),
     Dual-Export fuer Wiederverwendung in Node-Tests. Siehe ratios.js/peers.js. -->
<script src="ratios.js"></script>
<script src="peers.js"></script>
<script src="theme.js"></script>
<script src="indicators.js"></script>
<script src="market-data.js"></script>

<!-- App-Quelltext (wird unten kontrolliert kompiliert) -->
<script type="text/plain" id="app-src">
const { useState, useMemo, useRef, useEffect } = React;

/* ================= Aus theme.js / indicators.js / market-data.js importiert ================= */
// mono/inp werden nicht mehr importiert: Schriftart und Feld-Optik kommen jetzt
// aus den CSS-Klassen (--mono bzw. .field). C bleibt noetig, weil die SVG-Charts
// Farben als Attributwerte brauchen, wo CSS-Variablen nicht greifen.
const { C, CUR, fmtCap, fmtVol, fmtMoney, fmtRatio, pctColor, ago, METRIC_META, RATIO_SUPPRESS_FOR_FINANCIALS, GEO_LEVEL_META, geoLevelMeta } = Theme;
const { sma, rsi } = Indicators;
const {
  EU_PRESETS, ASIA_PRESETS, MACRO_PRESETS, INDEX_PRESETS, US_UNIVERSE, US_NAME, SECTORS,
  FH, TD, YF, FRED_FN,
  jget, jgetTimeout, keyOf, fredGetBatch,
  fhQuote, tdQuote, tdSeries, yfGet, searchSymbol, localPresetMatch, resolveSymbol,
  CHART_RANGES, getChart, getQuoteLite, getDetail, askGroq,
} = MarketData;

/* ================= LocalStorage persistence (standalone file, no window.storage) ================= */
const LS = {
  get(k) { try { const v = localStorage.getItem("term_" + k); return v == null ? null : JSON.parse(v); } catch { return null; } },
  set(k, v) { try { localStorage.setItem("term_" + k, JSON.stringify(v)); } catch {} },
  del(k) { try { localStorage.removeItem("term_" + k); } catch {} },
};

/* ================= Hooks =================
   useMediaQuery: reagiert wirklich auf Groessenaenderungen. Vorher wurde
   window.innerWidth direkt im Render gelesen - React rendert bei einem Resize
   aber nicht von sich aus neu, das Layout hing also zufaellig daran, dass
   irgendein anderer State-Update (bis eben der Sekundentakt der Uhr) einen
   Re-Render ausloeste. Beim Drehen des Handys sprang das Layout deshalb
   verzoegert um. */
function useMediaQuery(query) {
  const [match, setMatch] = useState(() =>
    typeof window !== "undefined" && window.matchMedia ? window.matchMedia(query).matches : false);
  useEffect(() => {
    if (!window.matchMedia) return;
    const mq = window.matchMedia(query);
    const on = (e) => setMatch(e.matches);
    setMatch(mq.matches);
    // addEventListener erst ab Safari 14; addListener als Rueckfallebene.
    if (mq.addEventListener) { mq.addEventListener("change", on); return () => mq.removeEventListener("change", on); }
    mq.addListener(on); return () => mq.removeListener(on);
  }, [query]);
  return match;
}

/* Uhr als eigene Komponente: vorher lag der Sekundentakt als State in App und
   hat damit 1x pro Sekunde den kompletten Baum neu gerendert - inklusive
   Neuberechnung von SMA/RSI und Neuzeichnen aller Charts. Jetzt rendert nur
   noch dieses eine <span> neu. */
function Clock() {
  const [t, setT] = useState(() => new Date().toLocaleTimeString("de-DE"));
  useEffect(() => {
    const iv = setInterval(() => setT(new Date().toLocaleTimeString("de-DE")), 1000);
    return () => clearInterval(iv);
  }, []);
  return <span className="muted">{t}</span>;
}

/* ================= Chart (rendert Kursverlauf von Yahoo) ================= */
// height: Anzeigehoehe in px. Die Makro-Uebersicht zeigt zehn Kacheln
// nebeneinander und braucht flachere Verlaeufe, damit man sie ohne Scrollen
// vergleichen kann; im F1-Detailchart bleibt es bei der vollen Hoehe.
function SvgChart({ series, up, overlays, height }) {
  if (!series || series.length < 3) return null;
  const w = 600, h = 200, pad = 8;
  const px = height || 210;
  const vals = series.map((d) => d.p);
  const overlayVals = (overlays || []).flatMap((o) => o.vals.filter((v) => v != null));
  const allVals = [...vals, ...overlayVals];
  const min = Math.min(...allVals), max = Math.max(...allVals);
  const range = max - min || 1;
  const xAt = (i) => pad + (i / (series.length - 1)) * (w - pad * 2);
  const yAt = (v) => h - pad - ((v - min) / range) * (h - pad * 2);
  const pts = series.map((d, i) => [xAt(i), yAt(d.p)]);
  const line = pts.map((p, i) => (i === 0 ? `M${p[0]},${p[1]}` : `L${p[0]},${p[1]}`)).join(" ");
  const area = `${line} L${pts[pts.length - 1][0]},${h - pad} L${pts[0][0]},${h - pad} Z`;
  const col = up ? C.green : C.red;
  const gid = "grad" + Math.random().toString(36).slice(2, 8);
  return (
    <svg viewBox={`0 0 ${w} ${h}`} style={{ width: "100%", height: px, display: "block" }} preserveAspectRatio="none">
      <defs><linearGradient id={gid} x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stopColor={col} stopOpacity="0.35" /><stop offset="100%" stopColor={col} stopOpacity="0" /></linearGradient></defs>
      <path d={area} fill={`url(#${gid})`} />
      <path d={line} fill="none" stroke={col} strokeWidth="1.6" />
      {(overlays || []).map((o, oi) => {
        const segs = []; let cur = [];
        o.vals.forEach((v, i) => { if (v == null) { if (cur.length > 1) segs.push(cur); cur = []; return; } cur.push([xAt(i), yAt(v)]); });
        if (cur.length > 1) segs.push(cur);
        return segs.map((seg, si) => <path key={oi + "-" + si} d={seg.map((p, i) => (i === 0 ? `M${p[0]},${p[1]}` : `L${p[0]},${p[1]}`)).join(" ")} fill="none" stroke={o.color} strokeWidth="1.2" opacity="0.9" />);
      })}
    </svg>
  );
}
function VolumeChart({ series }) {
  const vols = series.map((d) => d.v).filter((v) => v != null);
  if (vols.length < 3) return null;
  const w = 600, h = 44;
  const max = Math.max(...vols) || 1;
  const bw = w / series.length;
  return (
    <svg viewBox={`0 0 ${w} ${h}`} style={{ width: "100%", height: 44, display: "block", marginTop: 4 }} preserveAspectRatio="none">
      {series.map((d, i) => d.v == null ? null : <rect key={i} x={i * bw} y={h - (d.v / max) * h} width={Math.max(bw - 1, 0.5)} height={(d.v / max) * h} fill={C.muted} opacity="0.55" />)}
    </svg>
  );
}
function RSIChart({ vals }) {
  const pts = vals.map((v, i) => (v == null ? null : [i, v])).filter(Boolean);
  if (pts.length < 3) return null;
  const w = 600, h = 46;
  const xAt = (i) => (i / (vals.length - 1)) * w;
  const yAt = (v) => h - (v / 100) * h;
  const line = pts.map((p, i) => `${i === 0 ? "M" : "L"}${xAt(p[0])},${yAt(p[1])}`).join(" ");
  return (
    <svg viewBox={`0 0 ${w} ${h}`} style={{ width: "100%", height: 46, display: "block", marginTop: 4 }} preserveAspectRatio="none">
      <line x1="0" y1={yAt(70)} x2={w} y2={yAt(70)} stroke={C.red} strokeWidth="0.6" strokeDasharray="3,3" opacity="0.5" />
      <line x1="0" y1={yAt(30)} x2={w} y2={yAt(30)} stroke={C.green} strokeWidth="0.6" strokeDasharray="3,3" opacity="0.5" />
      <path d={line} fill="none" stroke={C.blue} strokeWidth="1.3" />
    </svg>
  );
}

function FinancialsChart({ data }) {
  if (!data || data.length < 2) return null;
  const w = 600, h = 130, pad = 18;
  const vals = data.flatMap((d) => [d.revenue, d.earnings]).filter((v) => v != null);
  if (!vals.length) return null;
  const max = Math.max(...vals, 0), min = Math.min(...vals, 0);
  const range = (max - min) || 1;
  const zeroY = h - pad - ((0 - min) / range) * (h - pad * 2);
  const bw = (w - pad * 2) / data.length;
  return (
    <svg viewBox={`0 0 ${w} ${h}`} style={{ width: "100%", height: 130, display: "block" }} preserveAspectRatio="none">
      <line x1={pad} y1={zeroY} x2={w - pad} y2={zeroY} stroke={C.line} strokeWidth="1" />
      {data.map((d, i) => {
        const x0 = pad + i * bw;
        const rH = d.revenue != null ? (Math.abs(d.revenue) / range) * (h - pad * 2) : 0;
        const eH = d.earnings != null ? (Math.abs(d.earnings) / range) * (h - pad * 2) : 0;
        return (
          <g key={i}>
            {d.revenue != null && <rect x={x0 + bw * 0.15} y={d.revenue >= 0 ? zeroY - rH : zeroY} width={bw * 0.3} height={rH} fill={C.blue} opacity="0.85" />}
            {d.earnings != null && <rect x={x0 + bw * 0.55} y={d.earnings >= 0 ? zeroY - eH : zeroY} width={bw * 0.3} height={eH} fill={d.earnings >= 0 ? C.green : C.red} opacity="0.85" />}
            <text x={x0 + bw / 2} y={h - 4} fontSize="9" fill={C.muted} textAnchor="middle">{d.year}</text>
          </g>
        );
      })}
    </svg>
  );
}

/* ================= Atoms =================
   Optik steckt in den CSS-Klassen (siehe <style> im Kopf). Inline bleiben nur
   Werte, die wirklich von den Daten abhaengen - z.B. Gruen/Rot je nach
   Vorzeichen oder eine berechnete Balkenbreite. */
const Panel = ({ title, right, children, style, className }) => (
  <div className={"panel" + (className ? " " + className : "")} style={style}>
    {title && <div className="panel__hd"><span className="panel__title">{title}</span>{right}</div>}
    <div className="panel__bd">{children}</div>
  </div>
);
const Stat = ({ k, v, color }) => (
  <div className="stat"><span className="stat__k">{k}</span><span className="stat__v" style={color ? { color } : null}>{v}</span></div>
);
function DayRange({ d }) {
  if (d.low == null || d.high == null || d.high <= d.low) return <div className="muted">Keine Tagesdaten.</div>;
  const pos = (v) => Math.max(0, Math.min(100, ((v - d.low) / (d.high - d.low)) * 100));
  const upCol = (d.chg ?? 0) >= 0 ? C.green : C.red;
  return (<div style={{ paddingTop: 4 }}>
    <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 6 }} className="muted"><span>T {d.low}</span><span>TAGESSPANNE</span><span>{d.high}</span></div>
    <div style={{ position: "relative", height: 12, background: C.panel3, border: `1px solid ${C.line}` }}>
      <div style={{ position: "absolute", left: 0, width: pos(d.price) + "%", height: "100%", background: C.amberDim, opacity: 0.45 }} />
      {d.prevClose != null && <div style={{ position: "absolute", left: pos(d.prevClose) + "%", top: -3, width: 1, height: 18, background: C.muted }} />}
      <div style={{ position: "absolute", left: `calc(${pos(d.price)}% - 4px)`, top: -3, width: 8, height: 18, background: upCol }} />
    </div>
    <div style={{ display: "flex", justifyContent: "space-between", marginTop: 5 }} className="muted"><span>Open {d.open}</span><span style={{ color: upCol }}>Kurs {d.price}</span><span>Vortag {d.prevClose}</span></div>
  </div>);
}
function RecoBar({ recos }) {
  if (!recos?.length) return <div className="muted">Keine Empfehlungsdaten verfügbar.</div>;
  const cur = recos[0]; const segs = [["strongSell", C.red, "S.Sell"], ["sell", "#ff7a45", "Sell"], ["hold", C.muted, "Hold"], ["buy", C.green, "Buy"], ["strongBuy", "#17a760", "S.Buy"]];
  const total = segs.reduce((a, [k]) => a + (cur[k] || 0), 0) || 1;
  const score = (cur.strongBuy * 2 + cur.buy - cur.sell - cur.strongSell * 2) / total;
  const con = score > 0.7 ? ["KAUFEN", "#17a760"] : score > 0.15 ? ["MOD. KAUFEN", C.green] : score > -0.15 ? ["HALTEN", C.amber] : score > -0.7 ? ["MOD. VERKAUF", "#ff7a45"] : ["VERKAUFEN", C.red];
  return (<div>
    <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline", marginBottom: 8 }}>
      <span style={{ color: con[1], fontSize: "var(--fs-lg)", fontWeight: 700, letterSpacing: 0.5 }}>{con[0]}</span>
      <span className="muted">{total} Analysten</span>
    </div>
    <div style={{ display: "flex", height: 18, border: `1px solid ${C.line}` }}>{segs.map(([k, col]) => { const w = ((cur[k] || 0) / total) * 100; return w > 0 ? <div key={k} style={{ width: w + "%", background: col }} /> : null; })}</div>
    <div style={{ display: "flex", justifyContent: "space-between", marginTop: 7 }}>{segs.slice().reverse().map(([k, col, l]) => <div key={k} style={{ textAlign: "center", flex: 1 }}><div style={{ color: col, fontSize: "var(--fs-md)", fontWeight: 700 }}>{cur[k] || 0}</div><div className="stat__k">{l}</div></div>)}</div>
  </div>);
}
function NewsList({ items, onTag }) {
  if (!items?.length) return <div className="muted">Keine Meldungen.</div>;
  return items.map((n, i) => (<div key={i} style={{ padding: "9px 0", borderBottom: i < items.length - 1 ? `1px solid ${C.line}` : "none" }}>
    <div style={{ display: "flex", justifyContent: "space-between", gap: 8, marginBottom: 3 }}>
      <span style={{ color: C.blue, fontSize: "var(--fs-2xs)", letterSpacing: 0.5 }}>{n.source}</span>
      <span className="muted" style={{ whiteSpace: "nowrap" }}>{ago(n.ago)}{n.date ? " · " + n.date : ""}</span>
    </div>
    {n.url ? <a href={n.url} target="_blank" rel="noreferrer" className="link" style={{ fontSize: "var(--fs-sm)" }}>{n.headline}</a>
           : <div style={{ color: C.white, fontSize: "var(--fs-sm)", lineHeight: 1.4 }}>{n.headline}</div>}
    {n.summary && <div className="muted" style={{ marginTop: 3, lineHeight: 1.5 }}>{n.summary}</div>}
    {n.tags?.length > 0 && <div style={{ display: "flex", gap: 4, marginTop: 6, flexWrap: "wrap" }}>{n.tags.map((t) => <span key={t} onClick={() => onTag?.({ s: t, m: "US" })} className={"chip" + (onTag ? " chip--btn" : "")}>{t}</span>)}</div>}
  </div>));
}

/* ================= F5 RATIO ================= */
function RatioPanel({ ratioTickers, ratioData, ratioView, ratioBusy, ratioAddCmd, setRatioAddCmd, addRatioPeer, rmRatioPeer, openRatio, loadDetail, chartCell, setChartCell, dupontOpen, setDupontOpen }) {
  const isComps = ratioView === "comps";

  // Spalten bestimmen: bei COMPS = Firmen (je letztes GJ), sonst = Jahre einer einzelnen Firma.
  let columns = [];
  if (isComps) {
    columns = ratioTickers.map((e) => {
      const d = ratioData[keyOf(e)];
      const series = d && d.fundamentals ? window.Ratios.computeSeries(d.fundamentals) : [];
      return { key: keyOf(e), label: e.s, ratios: series[0] || null, current: series[0] || null, prior: series[1] || null, isFinancial: !!(d && d.isFinancial), error: d && d.error, loaded: !!d };
    });
  } else if (ratioTickers.length) {
    const e = ratioTickers[0]; const d = ratioData[keyOf(e)];
    const series = d && d.fundamentals ? window.Ratios.computeSeries(d.fundamentals) : [];
    const years = ratioView === "series" ? series.slice(0, 5) : series.slice(0, 1);
    columns = years.map((row, i) => ({ key: String(row.year), label: String(row.year), ratios: row, current: row, prior: series[i + 1] || null, isFinancial: !!(d && d.isFinancial), error: d && d.error, loaded: !!d }));
    if (!columns.length && d) columns = [{ key: "—", label: "—", ratios: null, current: null, prior: null, isFinancial: !!d.isFinancial, error: d.error || "Keine Jahresabschlussdaten verfügbar.", loaded: true }];
  }

  const peerTable = (isComps && columns.length > 1) ? window.Peers.buildPeerTable(columns.map((c) => ({ id: c.key, ratios: c.ratios }))) : null;
  const anyFinancial = columns.some((c) => c.isFinancial);
  // Welche Quellen haben die geladenen Datensaetze tatsaechlich geliefert? Bei einem
  // Yahoo-Ausfall greift die Ersatzquelle (Stooq), die aber gar keine Jahresabschluesse
  // kennt - dann gibt es hier zwangslaeufig keine Kennzahlen, und das muss man sehen.
  const loadedDetails = ratioTickers.map((e) => ratioData[keyOf(e)]).filter(Boolean);
  const usedSources = Array.from(new Set(loadedDetails.map((d) => d.source).filter(Boolean)));
  const partialNote = loadedDetails.map((d) => d.partial).filter(Boolean)[0] || null;
  const groupOrder = ["Marge", "Liquidität", "Verschuldung", "Working Capital", "Rendite"];
  const groups = {}; Object.keys(METRIC_META).forEach((k) => { const g = METRIC_META[k].group; (groups[g] = groups[g] || []).push(k); });

  const chartFor = ratioTickers.length ? (isComps ? ratioTickers.find((e) => keyOf(e) === (chartCell && chartCell.colKey)) : ratioTickers[0]) : null;
  const chartSeries = (() => {
    if (!chartCell || !chartFor) return [];
    const d = ratioData[keyOf(chartFor)]; if (!d || !d.fundamentals) return [];
    return window.Ratios.computeSeries(d.fundamentals).slice().reverse()
      .filter((r) => r[chartCell.metric] != null).map((r) => ({ t: String(r.year), p: r[chartCell.metric] }));
  })();

  return (<>
    <div className="toolbar">
      <span className="muted">{isComps ? "PEER-VERGLEICH" : ratioView === "series" ? "ZEITREIHE" : "KENNZAHLEN · LETZTES GJ"}</span>
      {ratioTickers.length > 0 && <span style={{ color: C.text, fontSize: "var(--fs-xs)" }}>· {ratioTickers.map((e) => e.s).join(", ")}</span>}
      <div className="spacer" />
      {ratioTickers.length === 1 && (
        <button className="btn btn--ghost" onClick={() => openRatio(ratioTickers, ratioView === "series" ? "single" : "series")}>
          {ratioView === "series" ? "NUR LETZTES GJ" : "5J ZEITREIHE"}
        </button>
      )}
      {ratioTickers.length > 0 && ratioTickers.length < 6 && (<>
        <input className="field" value={ratioAddCmd} onChange={(e) => setRatioAddCmd(e.target.value)} onKeyDown={(e) => e.key === "Enter" && addRatioPeer()} placeholder="+ Ticker/Name für Vergleich" style={{ width: 200 }} />
        <button className="btn btn--solid" onClick={() => addRatioPeer()}>+ COMPS</button>
      </>)}
    </div>

    {!ratioTickers.length && !ratioBusy && (
      <div className="empty">
        Noch keine Werte geladen. Kommandozeile oben: <span style={{ color: C.amber }}>AAPL RATIO</span>, <span style={{ color: C.amber }}>AAPL RATIO 5Y</span> oder <span style={{ color: C.amber }}>AAPL COMPS MSFT GOOGL</span>.
      </div>
    )}
    {ratioBusy && <div className="muted" style={{ padding: 12 }}>lädt…</div>}

    {ratioTickers.length > 0 && !ratioBusy && (<>
      {/* Dauerhaft sichtbares Datenpanel: Quelle, Stichtag, Zeitkonvention, Rechnungslegungsstandard */}
      <div className="note note--info" style={{ marginBottom: 8, display: "flex", gap: 16, flexWrap: "wrap" }}>
        <span><b style={{ color: C.text }}>QUELLE</b> {usedSources.length ? usedSources.join(" + ").toUpperCase() : "—"} (Jahresabschluss)</span>
        <span><b style={{ color: C.text }}>ZEITKONVENTION</b> Geschäftsjahr, keine TTM-Werte gemischt</span>
        <span><b style={{ color: C.text }}>RECHNUNGSLEGUNG</b> je Unternehmen ggf. abweichend (US-GAAP/IFRS)</span>
        {columns.map((c) => <span key={c.key}><b style={{ color: C.text }}>{isComps ? c.label : "GJ"} STICHTAG</b> {c.ratios ? c.ratios.year : "—"}</span>)}
      </div>

      {partialNote && (
        <div className="note note--warn" style={{ marginBottom: 8 }}>
          ⚠ {partialNote} Kennzahlen lassen sich daraus nicht berechnen.
        </div>
      )}

      {isComps && columns.length > 1 && (
        <div className="note note--warn" style={{ marginBottom: 8 }}>
          ⚠ Rechnungslegungsstandards können zwischen den verglichenen Unternehmen abweichen (z.B. IFRS vs. US-GAAP) — Kennzahlen sind dadurch nur eingeschränkt direkt vergleichbar.
        </div>
      )}

      {/* tbl--stick-first: die Kennzahlen-Spalte bleibt beim Querscrollen stehen.
          Beim Peer-Vergleich mit 4+ Firmen weiss man sonst nach zwei Wischern
          nicht mehr, welche Zeile man liest. */}
      <div className="tbl-wrap" style={{ marginBottom: 8 }}>
        <table className="tbl tbl--stick-first">
          <thead><tr>
            <th>KENNZAHL</th>
            {columns.map((c) => (
              <th key={c.key} className="num" style={{ color: C.orange, cursor: isComps ? "pointer" : "default" }}
                onClick={() => isComps && loadDetail(ratioTickers.find((e) => keyOf(e) === c.key))}>
                {c.label}{isComps && ratioTickers.length > 1 && <span onClick={(ev) => { ev.stopPropagation(); rmRatioPeer(ratioTickers.find((e) => keyOf(e) === c.key)); }} style={{ color: C.muted, marginLeft: 6, cursor: "pointer" }}>×</span>}
              </th>
            ))}
          </tr></thead>
          <tbody>
            {!columns.some((c) => c.ratios) && (
              <tr><td colSpan={columns.length + 1} style={{ padding: 20, textAlign: "center", color: C.muted }}>
                {columns.some((c) => c.error) ? "Fehler: " + columns.find((c) => c.error).error : "Keine Jahresabschlussdaten verfügbar."}
              </td></tr>
            )}
            {groupOrder.map((group) => {
              const keys = (groups[group] || []).filter((k) => !(anyFinancial && RATIO_SUPPRESS_FOR_FINANCIALS.includes(k)));
              if (!keys.length) return null;
              return (
                <React.Fragment key={group}>
                  <tr className="tbl__group"><td colSpan={columns.length + 1}>{group.toUpperCase()}</td></tr>
                  {keys.map((mk) => (
                    <tr key={mk}>
                      <td style={{ color: C.text, whiteSpace: "nowrap" }} title={METRIC_META[mk].label}>{METRIC_META[mk].label}</td>
                      {columns.map((c) => {
                        const v = c.ratios ? c.ratios[mk] : null;
                        const row = peerTable ? peerTable.rows.find((r) => r.id === c.key) : null;
                        const pct = row ? row.percentiles[mk] : null;
                        return (
                          <td key={c.key} className="num" onClick={() => v != null && setChartCell({ metric: mk, colKey: c.key })}
                            style={{ cursor: v != null ? "pointer" : "default", background: pctColor(pct), color: v == null ? C.muted : C.white }}>
                            {fmtRatio(v, METRIC_META[mk].fmt)}
                          </td>
                        );
                      })}
                    </tr>
                  ))}
                </React.Fragment>
              );
            })}
          </tbody>
        </table>
        {anyFinancial && <div className="muted" style={{ padding: "7px 12px", borderTop: `1px solid ${C.line}` }}>Working-Capital- und Verschuldungskennzahlen sind für Banken/Versicherer ausgeblendet (für dieses Geschäftsmodell nicht aussagekräftig).</div>}
      </div>

      {/* DuPont-Zerlegung, aufklappbar */}
      <Panel title="DUPONT-ZERLEGUNG" right={<span onClick={() => setDupontOpen(!dupontOpen)} style={{ color: C.amber, fontSize: 11, cursor: "pointer" }}>{dupontOpen ? "▾ zu" : "▸ auf"}</span>} style={{ marginBottom: 8 }}>
        {!dupontOpen ? (
          <div className="muted">ROE = Nettomarge × Kapitalumschlag × EK-Multiplikator. Aufklappen für die Zerlegung je {isComps ? "Unternehmen" : "Jahr"}.</div>
        ) : (
          <div style={{ overflowX: "auto" }}>
            <table className="tbl tbl--stick-first">
              <thead><tr>
                <th>DUPONT</th>
                {columns.map((c) => <th key={c.key} className="num" style={{ color: C.orange }}>{c.label}</th>)}
              </tr></thead>
              <tbody>
                {[["netMargin", "Nettomarge", "pct"], ["assetTurnover", "Kapitalumschlag", "x"], ["equityMultiplier", "EK-Multiplikator", "x"], ["roe", "= ROE", "pct"]].map(([k, label, fmt]) => (
                  <tr key={k}>
                    <td style={{ color: C.text, whiteSpace: "nowrap" }}>{label}</td>
                    {columns.map((c) => {
                      if (!c.current) return <td key={c.key} className="num" style={{ color: C.muted }}>n/a</td>;
                      const dp = window.Ratios.dupont(c.current, c.prior);
                      return <td key={c.key} className="num" style={{ color: C.white }}>{fmtRatio(dp[k], fmt)}</td>;
                    })}
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        )}
      </Panel>

      {chartCell && (
        <Panel title={`${METRIC_META[chartCell.metric].label} · ${chartFor ? chartFor.s : ""} · Verlauf`} right={<span onClick={() => setChartCell(null)} style={{ color: C.muted, fontSize: 11, cursor: "pointer" }}>× schließen</span>}>
          {chartSeries.length > 1 ? <SvgChart series={chartSeries} up={chartSeries[chartSeries.length - 1].p >= chartSeries[0].p} /> : <div style={{ color: C.muted, fontSize: 11 }}>Nicht genug Jahre für einen Verlauf (mind. 2 nötig).</div>}
        </Panel>
      )}
    </>)}
  </>);
}

/* ================= Diagnose-Panel =================
   Zeigt je Datenquelle Statuscode, Dauer und einen Auszug der Antwort. Bewusst
   ausfuehrlich und kopierbar: Ein Screenshot davon reicht, um einen Ausfall
   einzuordnen, ohne dass jemand Entwicklerwerkzeuge oeffnen muss. */
function DiagPanel({ diag, diagBusy, diagErr, runDiag }) {
  return (
    <Panel
      title="◆ DIAGNOSE DER DATENQUELLEN"
      right={<button className="btn btn--ghost" onClick={runDiag} disabled={diagBusy}>{diagBusy ? "prüfe…" : "▶ PRÜFEN"}</button>}
      style={{ marginBottom: 8 }}
    >
      {!diag && !diagBusy && !diagErr && (
        <div className="muted">Fragt jede Quelle (FRED, DBnomics, ReliefWeb, GDELT, Yahoo, Stooq, Frankfurter) einzeln ab und zeigt den echten Statuscode samt Antworttext. Dauert bis zu 30 Sekunden.</div>
      )}
      {diagBusy && <div className="muted">Prüfe alle Quellen nacheinander… das dauert bis zu 30 Sekunden.</div>}
      {diagErr && <div className="note note--err">{diagErr}</div>}
      {diag && (<>
        <div className="muted" style={{ marginBottom: 8 }}>
          Node {diag.laufzeitumgebung?.node} · Stand {diag.zeitpunkt ? new Date(diag.zeitpunkt).toLocaleString("de-DE") : "—"}
          {" · "}<span style={{ color: C.green }}>{diag.zusammenfassung?.ok?.length || 0} OK</span>
          {" · "}<span style={{ color: C.red }}>{diag.zusammenfassung?.fehlgeschlagen?.length || 0} fehlgeschlagen</span>
        </div>
        {diag.proben.map((p) => {
          const good = p.ok === true && !p.warning;
          const col = p.skipped ? C.muted : good ? C.green : C.red;
          return (
            <div key={p.key} style={{ borderLeft: `3px solid ${col}`, background: C.panel2, padding: "7px 10px", marginBottom: 6 }}>
              <div style={{ display: "flex", justifyContent: "space-between", gap: 8, flexWrap: "wrap" }}>
                <span style={{ color: C.white, fontSize: "var(--fs-sm)" }}>{p.label}</span>
                <span style={{ color: col, fontSize: "var(--fs-xs)", whiteSpace: "nowrap" }}>
                  {p.skipped ? "übersprungen" : (p.status != null ? "HTTP " + p.status : "kein Kontakt")}
                  {p.erwarteterStatus != null && (p.wieErwartet ? " (wie erwartet)" : ` (erwartet: ${p.erwarteterStatus})`)}
                  {p.ms != null ? ` · ${p.ms}ms` : ""}
                </span>
              </div>
              {p.error && <div style={{ color: C.red, fontSize: "var(--fs-xs)", marginTop: 3 }}>{p.error}{p.errorCause ? ` (${p.errorCause})` : ""}</div>}
              {p.warning && <div style={{ color: C.amber, fontSize: "var(--fs-xs)", marginTop: 3 }}>⚠ {p.warning}</div>}
              {p.jsonParseError && <div style={{ color: C.amber, fontSize: "var(--fs-xs)", marginTop: 3 }}>⚠ Antwort ist kein gültiges JSON: {p.jsonParseError}</div>}

/* ================= F6 WELTLAGE ================= */
// Echte Weltkarte als Erweiterung: laedt oeffentliche Laendergrenzen (GeoJSON)
// zur Laufzeit im Browser per CDN, genau wie React/Babel schon per <script src>
// geladen werden. Kann hier nicht getestet werden (kein Netzwerkzugriff in der
// Entwicklungsumgebung) - faellt deshalb bei jedem Fehler (Netzwerk, falsches
// Format, leere Antwort) still auf world=false zurueck. Die Elternkomponente
// (GeoPanel) zeigt in dem Fall einfach nur die Laenderliste, die unabhaengig
// davon funktioniert.
function GeoWorldMap({ geo, geoSel, setGeoSel }) {
  const [world, setWorld] = useState(null); // null=laedt, false=nicht verfuegbar, Array=Features

  useEffect(() => {
    let cancelled = false;
    (async () => {
      const ctrl = new AbortController();
      const to = setTimeout(() => ctrl.abort(), 10000); // ohne Timeout haengt "Weltkarte lädt…" ewig, falls der CDN nicht antwortet
      try {
        const res = await fetch("https://cdn.jsdelivr.net/gh/johan/world.geo.json@master/countries.geo.json", { signal: ctrl.signal });
        if (!res.ok) throw new Error("HTTP " + res.status);
        const gj = await res.json();
        const features = gj && Array.isArray(gj.features) ? gj.features : null;
        if (!features || !features.length) throw new Error("keine Features in der Antwort");
        if (!cancelled) setWorld(features);
      } catch (e) { if (!cancelled) setWorld(false); }
      finally { clearTimeout(to); }
    })();
    return () => { cancelled = true; };
  }, []);

  if (world === null) return <div className="muted" style={{ padding: "8px 0" }}>Weltkarte lädt…</div>;
  if (world === false) return null; // stiller Fallback, Liste unten deckt die Funktion weiterhin ab

  const W = 960, H = 500;
  const project = (lon, lat) => [((lon + 180) / 360) * W, ((90 - lat) / 180) * H];
  const ringPath = (ring) => ring.map((pt, i) => { const [x, y] = project(pt[0], pt[1]); return (i === 0 ? "M" : "L") + x.toFixed(1) + "," + y.toFixed(1); }).join(" ") + "Z";
  const geomPath = (geom) => {
    if (!geom) return "";
    if (geom.type === "Polygon") return geom.coordinates.map(ringPath).join(" ");
    if (geom.type === "MultiPolygon") return geom.coordinates.map((poly) => poly.map(ringPath).join(" ")).join(" ");
    return "";
  };
  const isoOf = (f) => String(f.id || (f.properties && (f.properties.iso_a3 || f.properties.ISO_A3 || f.properties.iso3)) || "").toUpperCase();

  return (
    <div className="panel" style={{ padding: 8, marginBottom: 8 }}>
      <svg viewBox={`0 0 ${W} ${H}`} style={{ width: "100%", height: "auto", display: "block", background: "#050608" }}>
        {world.map((f, i) => {
          const iso = isoOf(f);
          const entry = geo && geo.countries ? geo.countries[iso] : null;
          const d = geomPath(f.geometry);
          if (!d) return null;
          const on = iso === geoSel;
          return (
            <path key={i} d={d} fill={entry ? geoLevelMeta(entry.level).color : "#1b1d21"} fillOpacity={entry ? 0.85 : 0.5}
              stroke={on ? C.amber : "#000"} strokeWidth={on ? 1.2 : 0.4}
              onClick={() => entry && setGeoSel(on ? null : iso)} style={{ cursor: entry ? "pointer" : "default" }} />
          );
        })}
      </svg>
      <div style={{ display: "flex", gap: 14, flexWrap: "wrap", marginTop: 8 }}>
        {Object.entries(GEO_LEVEL_META).filter(([k]) => k !== "nicht geprüft").map(([k, m]) => (
          <span key={k} className="muted"><span style={{ display: "inline-block", width: 9, height: 9, background: m.color, marginRight: 5 }} />{m.label}</span>
        ))}
      </div>
    </div>
  );
}

}

      setNRows(data.slice(0, 30).map((n) => ({ headline: n.headline, source: (n.source || "NEWS").toUpperCase().slice(0, 10), ago: Math.max(1, Math.floor((now - n.datetime * 1000) / 6e4)), summary: n.summary || "", url: n.url, tags: n.related ? n.related.split(",").slice(0, 3) : [] })));
    } catch { setNErr("News-Abruf fehlgeschlagen."); } setNBusy(false);
  };
  const genDigest = async () => { if (digBusy || !nRows.length) return;
    if (!groqKey) { setDigest("Kein Groq-Key hinterlegt."); return; }
    setDigBusy(true); setDigest("");
    const feed = nRows.slice(0, 12).map((n, i) => `${i + 1}. ${n.headline}`).join("\n");
    try { const txt = await askGroq(groqKey, "Analyst. Fasse Schlagzeilen zu 2-3 Themen zusammen, ordne ein, 'Was beobachten?'. Deutsch, knapp. KEINE Anlageberatung.", [], `Ordne ein:\n${feed}`); setDigest(txt); }
    catch (e) { setDigest("Einordnung fehlgeschlagen: " + e.message); } setDigBusy(false);
  };
  useEffect(() => { if (connected && tab === "news" && !nRows.length) loadNews(); }, [connected, tab]);

  /* Makro (FRED) */
  const [macro, setMacro] = useState({}); const [macroBusy, setMacroBusy] = useState(false); const [macroErr, setMacroErr] = useState("");
  const loadMacro = async () => {
    setMacroBusy(true); setMacroErr("");
    try {
      const out = await fredGetBatch(MACRO_PRESETS.map((m) => m.id));
      if (!out || typeof out !== "object") throw new Error("Leere/ungültige Antwort vom Server");
      if (out.error) throw new Error(out.error);
      setMacro((p) => ({ ...p, ...out }));
    } catch (e) { setMacroErr((e && e.message) || "Unbekannter Fehler beim Laden"); }
    setMacroBusy(false);
  };
  useEffect(() => { if (connected && tab === "makro" && !Object.keys(macro).length) loadMacro(); }, [connected, tab]);

  /* F6 WELTLAGE: Geopolitische Risikoübersicht (GDELT + ReliefWeb) */
  const [geo, setGeo] = useState(null); const [geoBusy, setGeoBusy] = useState(false); const [geoErr, setGeoErr] = useState("");
  const [geoSel, setGeoSel] = useState(null);
  const loadGeo = async () => {
    setGeoBusy(true); setGeoErr("");
    try {
      const out = await jgetTimeout("/.netlify/functions/geopolitics", 15000);
      if (!out || typeof out !== "object" || !out.countries) throw new Error("Leere/ungültige Antwort vom Server");
      setGeo(out);
    } catch (e) { setGeoErr((e && e.message) || "Unbekannter Fehler beim Laden"); }
    setGeoBusy(false);
  };
  useEffect(() => { if (connected && tab === "geo" && !geo) loadGeo(); }, [connected, tab]);

  /* Diagnose: fragt jede externe Datenquelle einzeln ab und zeigt, was wirklich
     zurueckkommt. Hintergrund: In der Entwicklungsumgebung sind fred.stlouisfed.org,
     api.reliefweb.int und api.db.nomics.world per Egress-Richtlinie gesperrt -
     Fehler wie "ReliefWeb nicht erreichbar" lassen sich dort nicht nachstellen.
     Auf Netlify laeuft der Aufruf dagegen echt, und dieses Panel macht den
     konkreten Grund (Statuscode + Antworttext) sichtbar. */
  const [diag, setDiag] = useState(null); const [diagBusy, setDiagBusy] = useState(false); const [diagErr, setDiagErr] = useState("");
  const runDiag = async () => {
    setDiagBusy(true); setDiagErr(""); setDiag(null);
    try {
      const out = await jgetTimeout("/.netlify/functions/diag", 30000);
      if (!out || !Array.isArray(out.proben)) throw new Error("Unerwartete Antwort vom Diagnose-Endpunkt");
      setDiag(out);
    } catch (e) { setDiagErr((e && e.message) || "Diagnose fehlgeschlagen"); }
    setDiagBusy(false);
  };

  /* F5 RATIO: Kennzahlen / Zeitreihe / Peer-Vergleich (COMPS) */
  const [ratioTickers, setRatioTickers] = useState([]); // [{s,y}, ...] - 1 Ticker (single/series) oder mehrere (comps)
  const [ratioData, setRatioData] = useState({}); // keyOf -> getDetail()-Ergebnis (inkl. fundamentals/isFinancial)
  const [ratioView, setRatioView] = useState("single"); // "single" | "series" | "comps"
  const [ratioBusy, setRatioBusy] = useState(false);
  const [ratioAddCmd, setRatioAddCmd] = useState("");
  const [chartCell, setChartCell] = useState(null); // { metric, colKey } - fuer Klick-auf-Zelle -> 5J-Chart
  const [dupontOpen, setDupontOpen] = useState(false);

  const loadRatioData = async (list) => {
    setRatioBusy(true);
    const out = {};
    await Promise.all(list.map(async (e) => {
      try { out[keyOf(e)] = await getDetail(e, fhKey); }
      catch (er) { out[keyOf(e)] = { s: e.s, error: er.message, fundamentals: [] }; }
    }));
    setRatioData((p) => ({ ...p, ...out }));
    setRatioBusy(false);
  };
  const openRatio = (list, view) => {
    setTab("ratio"); setRatioView(view); setRatioTickers(list); setChartCell(null);
    loadRatioData(list);
  };
  const addRatioPeer = async (q) => {
    const query = (q ?? ratioAddCmd).trim(); if (!query || ratioTickers.length >= 6) return; setRatioAddCmd("");
    const resolved = await resolveSymbol(query);
    if (resolved && !ratioTickers.find((x) => keyOf(x) === keyOf(resolved))) {
      const list = [...ratioTickers, resolved];
      setRatioTickers(list); setRatioView("comps"); loadRatioData([resolved]);
    }
  };
  const rmRatioPeer = (e) => setRatioTickers((p) => p.filter((x) => keyOf(x) !== keyOf(e)));

  /* Chart-Ableitungen memoisieren. Vorher standen sma()/rsi() direkt im JSX und
     liefen bei JEDEM Render ueber alle ~140 Punkte - zusammen mit dem alten
     Sekundentakt der Uhr also einmal pro Sekunde, obwohl sich die Kursreihe nur
     beim Laden aendert. */
  // Nur Eintraege mit echtem Kurs kommen ins Laufband (siehe Kommentar am Band).
  const idxTape = useMemo(() => INDEX_PRESETS.filter((e) => idxQ[e.s] && idxQ[e.s].chgPct != null), [idxQ]);
  const wlTape = useMemo(() => watch.filter((e) => wlQ[keyOf(e)] && wlQ[keyOf(e)].chgPct != null), [watch, wlQ]);

  const chartVals = useMemo(() => chart.series.map((s) => s.p), [chart.series]);
  // Veraenderung ueber den GEWAEHLTEN Zeitraum (erster vs. letzter Punkt der
  // geladenen Chart-Reihe). d.chgPct kommt dagegen direkt aus der Quote und ist
  // IMMER die Tagesveraenderung - blieb bisher beim Umschalten auf 1M/6M/1J
  // unveraendert stehen, obwohl der Chart einen ganz anderen Zeitraum zeigt.
  const periodChg = useMemo(() => {
    if (chartVals.length < 2) return null;
    const first = chartVals[0], last = chartVals[chartVals.length - 1];
    if (!first) return null;
    return { abs: +(last - first).toFixed(2), pct: +(((last - first) / first) * 100).toFixed(2) };
  }, [chartVals]);
  const chartRangeLabel = (CHART_RANGES.find(([r]) => r === chartRange) || [, chartRange])[1];
  const smaOverlays = useMemo(() => (
    showSMA && chartVals.length > 3
      ? [{ vals: sma(chartVals, 20), color: C.blue }, { vals: sma(chartVals, 50), color: C.amber }]
      : []
  ), [showSMA, chartVals]);
  const rsiVals = useMemo(() => (
    showRSI && chartVals.length > 3 ? rsi(chartVals, 14) : null
  ), [showRSI, chartVals]);

  if (!booted) return <div style={{ minHeight: "100dvh", color: C.amber, display: "flex", alignItems: "center", justifyContent: "center" }}>lädt…</div>;

  if (!connected) return (
    <div style={{ minHeight: "100dvh", display: "flex", alignItems: "center", justifyContent: "center", padding: "var(--sp-5)" }}>
      <div style={{ maxWidth: 480, width: "100%", border: `1px solid ${C.amberDim}`, background: C.panel }}>
        <div style={{ background: "#000", borderBottom: `1px solid ${C.amberDim}`, padding: "12px 16px", color: C.orange, fontWeight: 700, letterSpacing: 2, fontSize: "var(--fs-md)" }}>◈ TERMINAL — LOGIN</div>
        <div style={{ padding: "var(--sp-5)", lineHeight: 1.6, fontSize: "var(--fs-md)" }}>
          <p style={{ marginTop: 0, color: C.white }}>Alle Keys einmal eingeben – danach US- und Europa-Aktien plus KI-Analyst. Wird lokal in deinem Browser gespeichert.</p>
          <div style={{ marginBottom: 14 }}>
            <div style={{ color: C.amber, fontSize: "var(--fs-xs)", marginBottom: 5 }}>1 · FINNHUB-KEY <span className="muted">(Pflicht · US-Kurse, Empfehlungen, News)</span></div>
            <input className="field" style={{ width: "100%" }} type="password" value={fhIn} onChange={(e) => setFhIn(e.target.value)} placeholder="finnhub.io – Gratis-Key" />
          </div>
          <div style={{ marginBottom: 14 }}>
            <div style={{ color: C.amber, fontSize: "var(--fs-xs)", marginBottom: 5 }}>2 · TWELVE-DATA-KEY <span className="muted">(empfohlen · für den Kursverlauf/Chart)</span></div>
            <input className="field" style={{ width: "100%" }} type="password" value={tdIn} onChange={(e) => setTdIn(e.target.value)} placeholder="twelvedata.com – Gratis-Key" />
          </div>
          <div style={{ marginBottom: 16 }}>
            <div style={{ color: C.amber, fontSize: "var(--fs-xs)", marginBottom: 5 }}>3 · GROQ-KEY <span className="muted">(optional · KI-Analyst)</span></div>
            <input className="field" style={{ width: "100%" }} type="password" value={groqIn} onChange={(e) => setGmIn(e.target.value)} onKeyDown={(e) => e.key === "Enter" && connect()} placeholder="console.groq.com – Gratis-Key (keine Kreditkarte)" />
          </div>
          <button className="btn btn--solid btn--block" onClick={connect} disabled={connecting}>{connecting ? "VERBINDE…" : "▶ VERBINDEN"}</button>
          {connErr && <div className="note note--err" style={{ marginTop: 10 }}>{connErr}</div>}
        </div>
      </div>
    </div>
  );

  const d = detail || { s: active.s, name: "", recos: [], news: [] };
  const up = (d.chg ?? 0) >= 0; const cur = CUR[d.currency] || d.currency || "";
  const Fkey = (label, k, col) => <button onClick={() => setTab(k)} className="btn" style={tab === k ? { background: col, color: "#000", borderColor: col, fontWeight: 700 } : { color: col, borderColor: col, fontWeight: 700 }}>{label}</button>;
  const Th = ({ k, label, a }) => <th onClick={() => { setScSort(k); setScDir(scSort === k ? -scDir : -1); }} className={a === "right" ? "num" : null} style={{ color: scSort === k ? C.orange : null, cursor: "pointer" }}>{label}{scSort === k ? (scDir === -1 ? " ▼" : " ▲") : ""}</th>;

  const WL = (
    <Panel title="WATCHLIST" style={{ height: "100%" }}>
      {watch.map((e) => { const q = wlQ[keyOf(e)]; const on = keyOf(e) === keyOf(active); const u = (q?.chgPct ?? 0) >= 0;
        return <div key={keyOf(e)} onClick={() => loadDetail(e)} className={"wl-row" + (on ? " wl-row--on" : "")}>
          <span style={{ color: on ? C.orange : C.white, fontSize: "var(--fs-sm)" }}>{e.s}</span>
          <span style={{ fontSize: "var(--fs-sm)", color: q ? (u ? C.green : C.red) : C.muted }}>{q ? (u ? "▲" : "▼") : "·"}</span>
          <span style={{ fontSize: "var(--fs-xs)", color: C.text }}>{q?.price ?? "—"}</span>
          <span style={{ fontSize: "var(--fs-xs)", color: u ? C.green : C.red }}>{q?.chgPct != null ? (u ? "+" : "") + q.chgPct + "%" : ""}</span>
          <span onClick={(ev) => { ev.stopPropagation(); rmWatch(e); }} style={{ color: C.muted, fontSize: "var(--fs-sm)", cursor: "pointer", padding: "0 4px" }}>×</span>
        </div>; })}
      {watch.length === 0 && <div className="muted">Leer.</div>}
    </Panel>
  );

  return (
    <div style={{ minHeight: "100dvh" }}>
      <div className="topbar">
        <span className="brand">◈ TERMINAL</span>
        <div className="cmdbox">
          <div className="cmdbox__in">
            <span style={{ color: C.orange }}>{">"}</span>
            <input className="field field--cmd" value={cmd} onChange={(e) => setCmd(e.target.value)} onKeyDown={(e) => e.key === "Enter" && goCmd()} onBlur={() => setTimeout(() => setSuggestions([]), 150)} placeholder="TICKER + GO, oder AAPL RATIO / AAPL COMPS MSFT" />
            <span className="caret" style={{ color: C.orange }}>▊</span>
          </div>
          {cmd.trim().length >= 2 && (suggestions.length > 0 || suggestDone) && (
            <div className="suggest">
              {suggestions.length === 0 && suggestDone && <div className="muted" style={{ padding: "9px 10px" }}>Keine Treffer für "{cmd.trim()}".</div>}
              {suggestions.map((s, i) => (
                <div key={s.symbol + i} onMouseDown={() => selectSuggestion(s)} className="suggest__row">
                  <span style={{ color: C.white, fontSize: "var(--fs-sm)" }}>{s.name}</span>
                  <span className="muted" style={{ whiteSpace: "nowrap" }}>{s.symbol}{s.exchange ? " · " + s.exchange : ""}</span>
                </div>
              ))}
            </div>
          )}
        </div>
        <span style={{ color: C.green, fontSize: "var(--fs-xs)", whiteSpace: "nowrap" }}>● WELT{groqKey ? " · AI" : ""}</span>
        <Clock />
        <span onClick={disconnect} className="btn" style={{ fontSize: "var(--fs-2xs)" }}>LOGOUT</span>
      </div>
      <div className="fbar">
        {Fkey("F1 MARKT", "markt", C.amber)}{Fkey("F2 SCANNER", "scanner", C.green)}{Fkey("F3 NEWS", "news", C.red)}{Fkey("F4 MAKRO", "makro", C.blue)}{Fkey("F5 RATIO", "ratio", C.violet)}{Fkey("F6 WELTLAGE", "geo", "#ff6b6b")}
        <span className="stat__k" style={{ marginLeft: 6 }}>EU:</span>
        {EU_PRESETS.slice(0, 8).map((p) => <button key={p.y} onClick={() => loadDetail(p)} title={p.label} className="btn" style={{ color: C.blue }}>{p.s}</button>)}
        <span className="stat__k" style={{ marginLeft: 6 }}>ASIA:</span>
        {ASIA_PRESETS.map((p) => <button key={p.y} onClick={() => loadDetail(p)} title={p.label} className="btn" style={{ color: C.blue }}>{p.label}</button>)}
      </div>
      {/* Nur zeigen, wenn wirklich ein Kurs drinsteht. Vorher reichte es, dass die
          Abfrage GEANTWORTET hat - bei einem Ausfall liefert getQuoteLite aber
          {price:null,chgPct:null} statt zu werfen, wodurch zwei leere farbige
          Balken stehen blieben. */}
      {idxTape.length > 0 && (
        <div className="tape-wrap tape-wrap--idx">
          <div className="tape">{[...idxTape, ...idxTape].map((e, i) => { const q = idxQ[e.s]; const u = q.chgPct >= 0; return <span key={i} className="tape__item"><span style={{ color: C.blue }}>{e.label}</span> <span style={{ color: C.white }}>{q.price}</span> <span style={{ color: u ? C.green : C.red }}>{u ? "▲" : "▼"}{q.chgPct}%</span></span>; })}</div>
        </div>
      )}
      {wlTape.length > 0 && (
        <div className="tape-wrap tape-wrap--wl">
          <div className="tape">{[...wlTape, ...wlTape].map((e, i) => { const q = wlQ[keyOf(e)]; const u = q.chgPct >= 0; return <span key={i} className="tape__item"><span style={{ color: C.orange }}>{e.s}</span> <span style={{ color: C.white }}>{q.price}</span> <span style={{ color: u ? C.green : C.red }}>{u ? "▲" : "▼"}{q.chgPct}%</span></span>; })}</div>
        </div>
      )}

      {tab === "markt" && (
        <div className="layout page">
          {wide && <div>{WL}</div>}
          <div>
            <Panel style={{ marginBottom: 8 }}>
              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-end", flexWrap: "wrap", gap: 10 }}>
                <div style={{ minWidth: 0 }}>
                  <div style={{ color: C.orange, fontSize: "var(--fs-xl)", fontWeight: 700, letterSpacing: 0.5 }}>{d.s} <span className="muted" style={{ fontWeight: 400 }}>{d.name}</span></div>
                  <div className="muted" style={{ marginTop: 2 }}>{d.sector}{d.region === "US" ? " · US" : ""} {dLoad ? "· lädt…" : ""}</div>
                </div>
                <div style={{ display: "flex", alignItems: "flex-end", gap: 12 }}>
                  {d.price != null && <div style={{ textAlign: "right" }}>
                    <div style={{ fontSize: "var(--fs-hero)", color: up ? C.green : C.red, fontWeight: 700, lineHeight: 1.1 }}>{d.price} <span className="muted" style={{ fontWeight: 400 }}>{cur}</span></div>
                    <div style={{ fontSize: "var(--fs-md)", color: up ? C.green : C.red }}>{up ? "▲ +" : "▼ "}{d.chg} ({up ? "+" : ""}{d.chgPct}%) <span className="muted" style={{ fontSize: "var(--fs-2xs)" }}>HEUTE</span></div>
                    {d.currency && d.currency !== "EUR" && fxRates[d.currency] != null && <div className="muted" style={{ marginTop: 2 }}>≈ {(d.price * fxRates[d.currency]).toFixed(2)} €</div>}
                  </div>}
                  <button className="btn btn--ghost" onClick={() => addWatch({ s: d.s, y: active.y })}>+WL</button>
                </div>
              </div>
              {d.error && <div className="note note--err" style={{ marginTop: 10 }}>Fehler: {d.error} — Ticker/Börse prüfen.</div>}
              {d.partial && <div className="note note--warn" style={{ marginTop: 10 }}>⚠ {d.partial}</div>}
            </Panel>

            <Panel
              title={<>CHART · {d.s}{periodChg && (
                <span style={{ color: periodChg.pct >= 0 ? C.green : C.red, marginLeft: 8 }}>
                  {periodChg.pct >= 0 ? "▲ +" : "▼ "}{periodChg.pct}% <span className="muted" style={{ fontSize: "var(--fs-2xs)" }}>({chartRangeLabel})</span>
                </span>
              )}</>}
              right={<div style={{ display: "flex", gap: 3 }}>{CHART_RANGES.map(([r, l]) => <button key={r} onClick={() => changeChartRange(r)} className={"btn" + (chartRange === r ? " btn--on" : "")}>{l}</button>)}</div>}
              style={{ marginBottom: 8 }}>
              {chart.ok && chart.series.length > 3 ? (<>
                <div style={{ display: "flex", gap: 4, marginBottom: 8, flexWrap: "wrap" }}>
                  <button onClick={() => setShowSMA((v) => !v)} className={"btn btn--tog" + (showSMA ? " btn--on" : "")}>SMA 20/50</button>
                  <button onClick={() => setShowVol((v) => !v)} className={"btn btn--tog" + (showVol ? " btn--on" : "")}>VOL</button>
                  <button onClick={() => setShowRSI((v) => !v)} className={"btn btn--tog" + (showRSI ? " btn--on" : "")}>RSI(14)</button>
                </div>
                <SvgChart series={chart.series} up={up} overlays={smaOverlays} />
                {showVol && <VolumeChart series={chart.series} />}
                {showRSI && rsiVals && <RSIChart vals={rsiVals} />}
              </>) : <div className="muted" style={{ padding: "8px 0" }}>Chart lädt / für diesen Ticker nicht verfügbar.</div>}
              <DayRange d={d} />
            </Panel>

            <div className="grid-pair" style={{ marginBottom: 8 }}>
              <Panel title="KENNZAHLEN">
                <Stat k="OPEN" v={d.open ?? "—"} /><Stat k="HOCH" v={d.high ?? "—"} color={C.green} /><Stat k="TIEF" v={d.low ?? "—"} color={C.red} /><Stat k="VORTAG" v={d.prevClose ?? "—"} /><Stat k="WÄHRUNG" v={d.currency || "—"} /><Stat k="MKT CAP" v={fmtCap(d.mktcap)} />
                <Stat k="52W HOCH" v={d.week52High ?? "—"} color={C.green} /><Stat k="52W TIEF" v={d.week52Low ?? "—"} color={C.red} />
                <Stat k="VOLUMEN" v={fmtVol(d.volume)} /><Stat k="Ø VOLUMEN" v={fmtVol(d.avgVolume)} /><Stat k="BETA" v={d.beta ?? "—"} />
                <Stat k="KGV" v={d.pe ?? "—"} /><Stat k="EPS" v={d.eps ?? "—"} /><Stat k="DIV.-RENDITE" v={d.divYield != null ? d.divYield + "%" : "—"} />
                <Stat k="KURSZIEL" v={d.target ?? "—"} /><Stat k="NÄCHSTE ZAHLEN" v={d.earningsDate || "—"} />
              </Panel>
              <Panel title="ANALYSTEN-EMPFEHLUNG"><RecoBar recos={d.recos} /></Panel>
            </div>
            {d.financials?.length > 1 && (
              <Panel title="UMSATZ & GEWINN (JÄHRLICH)" style={{ marginBottom: 8 }}>
                <div style={{ display: "flex", gap: 14, marginBottom: 6 }} className="muted">
                  <span><span style={{ color: C.blue }}>■</span> Umsatz</span>
                  <span><span style={{ color: C.green }}>■</span> Gewinn</span>
                </div>
                <FinancialsChart data={d.financials} />
              </Panel>
            )}
            <Panel title={`NEWS · ${d.s}`} style={{ marginBottom: 8 }}><NewsList items={d.news} onTag={loadDetail} /></Panel>
            {!wide && <div>{WL}</div>}
          </div>

          <Panel title="◆ AI-ANALYST" right={<span className="stat__k">Groq</span>}>
            <div style={{ display: "flex", flexDirection: "column", minHeight: 340 }}>
              <div style={{ display: "flex", gap: 4, flexWrap: "wrap", marginBottom: 8 }}>{["Zusammenfassung", "Chart deuten", "Bull vs. Bear"].map((c) => <button key={c} onClick={() => askAI(`${c} für ${d.s}`)} disabled={aiBusy} className="btn btn--ghost">{c}</button>)}</div>
              <div style={{ flex: 1, overflowY: "auto", fontSize: "var(--fs-sm)", lineHeight: 1.55, minHeight: 180, maxHeight: 340 }}>
                {msgs.length === 0 && <div className="muted">Frag zu {d.s}. Analyse, keine Anlageberatung.{!groqKey && " (Groq-Key im Login nötig)"}</div>}
                {msgs.map((m, i) => <div key={i} style={{ marginBottom: 10 }}><div style={{ color: m.role === "user" ? C.blue : C.orange, fontSize: "var(--fs-2xs)", letterSpacing: 0.8, marginBottom: 3 }}>{m.role === "user" ? "YOU" : "ANALYST"}</div><div style={{ whiteSpace: "pre-wrap" }}>{m.content}</div></div>)}
                {aiBusy && <div style={{ color: C.orange }}>▍analysiere…</div>}<div ref={chatEnd} />
              </div>
              <div style={{ display: "flex", gap: 6, marginTop: 10 }}>
                <input className="field" value={aiIn} onChange={(e) => setAiIn(e.target.value)} onKeyDown={(e) => e.key === "Enter" && askAI()} placeholder="Frage…" style={{ flex: 1, minWidth: 0 }} />
                <button className="btn btn--solid" onClick={() => askAI()} disabled={aiBusy} style={{ padding: "0 14px" }}>➤</button>
              </div>
            </div>
          </Panel>
        </div>
      )}

      {tab === "scanner" && (
        <div className="page">
          <div className="panel" style={{ display: "flex", gap: 10, alignItems: "flex-end", flexWrap: "wrap", padding: 12, marginBottom: 8 }}>
            <div style={{ display: "flex", flexDirection: "column", gap: 4 }}><span className="stat__k">SEKTOR</span><select className="field" value={scSec} onChange={(e) => setScSec(e.target.value)}>{SECTORS.map((s) => <option key={s} style={{ background: C.panel }}>{s}</option>)}</select></div>
            <div style={{ display: "flex", flexDirection: "column", gap: 4 }}><span className="stat__k">%CHG MIN</span><input className="field" value={scChg} onChange={(e) => setScChg(e.target.value)} placeholder="-99" style={{ width: 100 }} /></div>
            <button className="btn btn--go" onClick={runScan} disabled={scanning}>{scanning ? `SCANNE… (${scProgress ? scProgress.done : 0}/${scProgress ? scProgress.total : US_UNIVERSE.length})` : "▶ MARKT SCANNEN"}</button>
            <span className="muted">{scan.length ? scanView.length + " Treffer" : `US-Werte · ${US_UNIVERSE.length} Aufrufe`}</span>
          </div>
          {scan.length > 0 && (
            <div className="toolbar">
              <span className="stat__k">SCHNELLFILTER:</span>
              <button className="btn btn--tog" onClick={() => scanPreset("chg", -1)}>▲ TOP GEWINNER</button>
              <button className="btn btn--tog" onClick={() => scanPreset("chg", 1)}>▼ TOP VERLIERER</button>
              <button className="btn btn--tog" onClick={() => scanPreset("absChg", -1)}>◆ GRÖSSTE BEWEGUNG</button>
            </div>
          )}
          {sectorHeat.length > 0 && (
            <div className="grid-auto grid-auto--sm" style={{ marginBottom: 8 }}>
              {sectorHeat.map((s) => (
                <div key={s.sector} onClick={() => setScSec(s.sector)} title="Nach Sektor filtern" className="card" style={{ background: heatColor(s.avg), textAlign: "center" }}>
                  <div style={{ fontSize: "var(--fs-xs)", color: C.white, marginBottom: 5 }}>{s.sector}</div>
                  <div style={{ fontSize: "var(--fs-lg)", fontWeight: 700, color: s.avg >= 0 ? C.green : C.red }}>{s.avg >= 0 ? "+" : ""}{s.avg}%</div>
                  <div className="stat__k">{s.n} Werte</div>
                </div>
              ))}
            </div>
          )}
          <div className="tbl-wrap">
            <table className="tbl tbl--zebra tbl--rows">
              <thead><tr><Th k="s" label="SYM" /><Th k="name" label="NAME" /><Th k="sector" label="SEKTOR" /><Th k="price" label="PREIS" a="right" /><Th k="chg" label="%CHG" a="right" /></tr></thead>
              <tbody>{scanView.map((x) => <tr key={x.s} onClick={() => loadDetail({ s: x.s, m: "US" })}><td style={{ color: C.orange }}>{x.s}</td><td style={{ whiteSpace: "nowrap" }}>{x.name}</td><td style={{ color: C.blue }}>{x.sector}</td><td className="num">{x.price ?? "—"}</td><td className="num" style={{ color: (x.chg ?? 0) >= 0 ? C.green : C.red }}>{x.chg == null ? "—" : (x.chg >= 0 ? "+" : "") + x.chg + "%"}</td></tr>)}</tbody>
            </table>
            {!scan.length && <div className="empty" style={{ border: "none" }}>„MARKT SCANNEN" holt Live-Kurse. EU-Werte einzeln über Kommandozeile/Presets laden.</div>}
          </div>
        </div>
      )}

      {tab === "news" && (
        <div className="page">
          <div className="note note--warn" style={{ marginBottom: 8 }}>⚠ Information &amp; Analyse – KEINE Anlageberatung.</div>
          <div className="toolbar">
            {[["general", "MARKT"], ["crypto", "KRYPTO"], ["merger", "M&A"], ["forex", "FOREX"]].map(([k, l]) => <button key={k} onClick={() => { setNCat(k); loadNews(k); }} className={"btn" + (nCat === k ? " btn--on" : "")}>{l}</button>)}
            <div className="spacer" /><button className="btn btn--ghost" onClick={() => loadNews()} disabled={nBusy}>{nBusy ? "…" : "↻ AKTUALISIEREN"}</button>
          </div>
          {nErr && <div className="note note--err" style={{ marginBottom: 8 }}>{nErr}</div>}
          <div className="panel" style={{ borderColor: C.amberDim, padding: 12, marginBottom: 8 }}>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", gap: 8, flexWrap: "wrap", marginBottom: digest || digBusy ? 10 : 0 }}>
              <span style={{ color: C.orange, fontSize: "var(--fs-xs)", letterSpacing: 1.2, fontWeight: 700 }}>◆ KI-EINORDNUNG</span>
              <button className="btn btn--ghost" onClick={genDigest} disabled={digBusy || !nRows.length}>{digBusy ? "analysiere…" : "Einordnung generieren"}</button>
            </div>
            {digest && <div style={{ fontSize: "var(--fs-md)", lineHeight: 1.6, whiteSpace: "pre-wrap" }}>{digest}</div>}
          </div>
          <div className="panel" style={{ padding: "2px 12px" }}><NewsList items={nRows} onTag={loadDetail} /></div>
        </div>
      )}

      {tab === "makro" && (
        <div className="page">
          <div className="toolbar">
            <span className="muted">US-Konjunkturdaten · Quelle: FRED (St. Louis Fed)</span>
            <div className="spacer" />
            <button className="btn btn--ghost" onClick={loadMacro} disabled={macroBusy}>{macroBusy ? "…" : "↻ AKTUALISIEREN"}</button>
          </div>
          {macroErr && <div className="note note--err" style={{ marginBottom: 8 }}>Fehler beim Laden der Makrodaten: {macroErr}</div>}
          {/* Diagnose nur einblenden, wenn es tatsaechlich klemmt - im Normalbetrieb
              soll das Panel den Blick auf die Daten nicht verstellen. */}
          {(macroErr || Object.values(macro).some((m) => m && m.error)) && (
            <DiagPanel diag={diag} diagBusy={diagBusy} diagErr={diagErr} runDiag={runDiag} />
          )}
          <div className="grid-auto">
            {MACRO_PRESETS.map((m) => {
              const d = macro[m.id]; const dUp = (d?.chg ?? 0) >= 0;
              return (
                <Panel key={m.id} title={m.label}>
                  {!d && <div className="muted">{macroBusy ? "lädt…" : "—"}</div>}
                  {d?.error && <div style={{ color: C.red, fontSize: "var(--fs-xs)" }}>Fehler: {d.error}</div>}
                  {d && !d.error && (<>
                    <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline", gap: 8, marginBottom: 6 }}>
                      <span style={{ fontSize: "var(--fs-xl)", fontWeight: 700, color: C.white }}>{d.latest ?? "—"} <span className="muted" style={{ fontWeight: 400 }}>{m.unit}</span></span>
                      {d.chg != null && <span style={{ fontSize: "var(--fs-sm)", color: dUp ? C.green : C.red }}>{dUp ? "+" : ""}{d.chg}</span>}
                    </div>
                    <div className="muted" style={{ marginBottom: 6 }}>
                      Stand: {d.latestDate || "—"}
                      {d.source && <span style={{ color: d.source === "fred" ? null : C.blue }}> · Quelle: {d.source.toUpperCase()}</span>}
                      {d.stale && <span style={{ color: C.amber }}> · veraltet (Cache)</span>}
                    </div>
                    {d.series?.length > 3 ? <SvgChart series={d.series.map((s) => ({ t: s.t, p: s.v }))} up={dUp} height={120} /> : <div className="muted">Kein Chart.</div>}
                  </>)}
                </Panel>
              );
            })}
          </div>
        </div>
      )}

      {tab === "ratio" && (
        <div className="page">
          {(typeof window.Ratios === "undefined" || typeof window.Peers === "undefined") ? (
            <div className="note note--err">
              Kennzahlen-Modul (ratios.js/peers.js) konnte nicht geladen werden.
            </div>
          ) : (
            <RatioPanel
              ratioTickers={ratioTickers} ratioData={ratioData} ratioView={ratioView} ratioBusy={ratioBusy}
              ratioAddCmd={ratioAddCmd} setRatioAddCmd={setRatioAddCmd} addRatioPeer={addRatioPeer} rmRatioPeer={rmRatioPeer}
              openRatio={openRatio} loadDetail={loadDetail} chartCell={chartCell} setChartCell={setChartCell}
              dupontOpen={dupontOpen} setDupontOpen={setDupontOpen}
            />
          )}
        </div>
      )}

      {tab === "geo" && <GeoPanel geo={geo} geoBusy={geoBusy} geoErr={geoErr} geoSel={geoSel} setGeoSel={setGeoSel} loadGeo={loadGeo}
        diag={diag} diagBusy={diagBusy} diagErr={diagErr} runDiag={runDiag} />}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>

<script>
  (function(){
    function fail(m){ window.__err(m); var b=document.getElementById('boot'); if(b) b.textContent='◈ TERMINAL — Start fehlgeschlagen (siehe Fehler unten).'; }
    if (typeof React==='undefined' || typeof ReactDOM==='undefined') { fail('React konnte nicht geladen werden (CDN blockiert?). Ohne Internet/mit Content-Blocker startet die App nicht.'); return; }
    if (typeof Babel==='undefined') { fail('Babel (Compiler) konnte nicht geladen werden (CDN blockiert?).'); return; }
    try {
      var src = document.getElementById('app-src').textContent;
      var out = Babel.transform(src, { presets: ['react'] }).code;
      (0, eval)(out);
    } catch(e){ fail((e && e.stack) || (e && e.message) || String(e)); }
  })();
</script>
</body>
</html>
