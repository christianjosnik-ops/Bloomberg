<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Terminal</title>
<style>
  html,body{margin:0;padding:0;background:#000;color:#c9cbd0;font-family:ui-monospace,Menlo,monospace;}
  *{box-sizing:border-box;}
  ::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-thumb{background:#2a2b2e}
  @keyframes tape{from{transform:translateX(0)}to{transform:translateX(-50%)}}
  @keyframes blink{50%{opacity:0}}
  .tape{animation:tape 34s linear infinite;white-space:nowrap;display:inline-block}
  .caret{animation:blink 1s step-end infinite}
  #boot{padding:20px;font-size:14px;color:#ffb000;}
  #err{display:none;white-space:pre-wrap;padding:16px;margin:12px;border:1px solid #ff4d4d;color:#ff8a8a;font-size:12px;background:#140505;}
</style>
</head>
<body>
<div id="root"><div id="boot">◈ TERMINAL — lädt…<br><span style="color:#7f858f;font-size:12px">Wenn dieser Text hängen bleibt: Internet/Content-Blocker prüfen. Fehler erscheinen unten in Rot.</span></div></div>
<div id="err"></div>

<script>
  window.__err = function(msg){
    var e=document.getElementById('err'); if(!e)return;
    e.style.display='block'; e.textContent='FEHLER:\n'+msg+'\n\n(Screenshot an den Chat schicken.)';
  };
  window.addEventListener('error', function(ev){ window.__err((ev.error && ev.error.stack) || ev.message || String(ev)); });
  window.addEventListener('unhandledrejection', function(ev){ window.__err('Promise: '+((ev.reason && ev.reason.message) || ev.reason)); });
</script>

<script type="text/plain" id="app-src">
const { useState, useMemo, useRef, useEffect } = React;

/* ================= Theme ================= */
const C = {
  bg: "#000", panel: "#0a0b0c", panel2: "#050506", line: "#2a2b2e",
  orange: "#ff8a1e", amber: "#ffb000", amberDim: "#8a5e15",
  green: "#3fd07a", red: "#ff4d4d", blue: "#4ea3ff", white: "#e6e7ea", text: "#c9cbd0", muted: "#7f858f",
};
const mono = "ui-monospace, 'SF Mono', 'DejaVu Sans Mono', Menlo, monospace";
const inp = { background: C.panel2, border: `1px solid ${C.line}`, color: C.amber, padding: "6px 8px", fontFamily: mono, fontSize: 12, outline: "none" };

const CUR = { USD: "$", EUR: "€", GBP: "£", CHF: "Fr", JPY: "¥", HKD: "HK$", KRW: "₩", "": "" };
// Weltweite Presets. `y` = Yahoo-Ticker (läuft über die Netlify-Funktion, weltweit).
// Ohne `y` = reiner US-Wert über Finnhub (mit Analysten-Empfehlungen + News).
const EU_PRESETS = [
  { s: "RHM", y: "RHM.DE", label: "Rheinmetall" }, { s: "SAP", y: "SAP.DE", label: "SAP" },
  { s: "PUM", y: "PUM.DE", label: "Puma" }, { s: "VOW3", y: "VOW3.DE", label: "Volkswagen" },
  { s: "BMW", y: "BMW.DE", label: "BMW" }, { s: "MBG", y: "MBG.DE", label: "Mercedes" },
  { s: "AIR", y: "AIR.PA", label: "Airbus" }, { s: "MC", y: "MC.PA", label: "LVMH" },
  { s: "ASML", y: "ASML.AS", label: "ASML" }, { s: "NESN", y: "NESN.SW", label: "Nestlé" },
];
const ASIA_PRESETS = [
  { s: "TOYOTA", y: "7203.T", label: "Toyota" }, { s: "SONY", y: "6758.T", label: "Sony" },
  { s: "SAMSUNG", y: "005930.KS", label: "Samsung" }, { s: "TENCENT", y: "0700.HK", label: "Tencent" },
  { s: "ALIBABA", y: "9988.HK", label: "Alibaba HK" }, { s: "TSMC-TW", y: "2330.TW", label: "TSMC Taiwan" },
];
const US_UNIVERSE = [
  ["AAPL", "Apple Inc", "Technology"], ["MSFT", "Microsoft", "Technology"], ["NVDA", "NVIDIA", "Technology"], ["GOOGL", "Alphabet", "Technology"],
  ["META", "Meta Platforms", "Technology"], ["AMD", "Adv Micro Dev", "Technology"], ["AVGO", "Broadcom", "Technology"], ["TSM", "TSMC", "Technology"],
  ["QCOM", "Qualcomm", "Technology"], ["ORCL", "Oracle", "Technology"], ["TSLA", "Tesla", "Automotive"], ["F", "Ford Motor", "Automotive"],
  ["GM", "General Motors", "Automotive"], ["AMZN", "Amazon", "Consumer"], ["NKE", "Nike", "Consumer"], ["MCD", "McDonald's", "Consumer"],
  ["KO", "Coca-Cola", "Consumer"], ["JPM", "JPMorgan", "Financials"], ["V", "Visa", "Financials"], ["MA", "Mastercard", "Financials"],
  ["GS", "Goldman Sachs", "Financials"], ["JNJ", "Johnson&Johnson", "Healthcare"], ["PFE", "Pfizer", "Healthcare"], ["LLY", "Eli Lilly", "Healthcare"],
  ["UNH", "UnitedHealth", "Healthcare"], ["XOM", "Exxon Mobil", "Energy"], ["CVX", "Chevron", "Energy"], ["CAT", "Caterpillar", "Industrials"],
  ["BA", "Boeing", "Industrials"], ["GE", "GE Aerospace", "Industrials"],
];
const US_NAME = Object.fromEntries(US_UNIVERSE.map(([s, n, sec]) => [s, [n, sec]]));
const SECTORS = ["Alle", ...Array.from(new Set(US_UNIVERSE.map((u) => u[2])))];
const fmtCap = (b) => (b == null ? "—" : b >= 1000 ? (b / 1000).toFixed(2) + "T" : b.toFixed(1) + "B");
const ago = (m) => (m < 60 ? m + "m" : Math.floor(m / 60) + "h");
const FH = "https://finnhub.io/api/v1", TD = "https://api.twelvedata.com";
const jget = (u) => fetch(u).then((r) => r.json());
const keyOf = (e) => e.y || e.s;
const YF = "/.netlify/functions/quote";

/* ================= LocalStorage persistence (standalone file, no window.storage) ================= */
const LS = {
  get(k) { try { const v = localStorage.getItem("term_" + k); return v == null ? null : JSON.parse(v); } catch { return null; } },
  set(k, v) { try { localStorage.setItem("term_" + k, JSON.stringify(v)); } catch {} },
  del(k) { try { localStorage.removeItem("term_" + k); } catch {} },
};

/* ================= Data layer (nur Finnhub/US — läuft garantiert im Browser) ================= */
async function fhQuote(sym, k) { return jget(`${FH}/quote?symbol=${sym}&token=${k}`); }
async function tdQuote(sym, k) { return jget(`${TD}/quote?symbol=${sym}&apikey=${k}`); }
async function tdSeries(sym, k) {
  const r = await jget(`${TD}/time_series?symbol=${sym}&interval=1day&outputsize=140&apikey=${k}`);
  if (r?.status === "ok" && Array.isArray(r.values)) return { ok: true, series: r.values.map((v) => ({ t: v.datetime, p: +v.close })).reverse() };
  return { ok: false, series: [] };
}
async function yfGet(yticker) {
  const r = await jget(`${YF}?symbol=${encodeURIComponent(yticker)}`);
  if (r?.error) throw new Error(r.error);
  return r;
}
async function getChart(e, tdKey) {
  if (e.y) { try { const r = await yfGet(e.y); return { ok: Array.isArray(r.series) && r.series.length > 3, series: r.series || [] }; } catch { return { ok: false, series: [] }; } }
  if (tdKey) { const r = await tdSeries(e.s, tdKey); if (r.ok) return r; }
  return { ok: false, series: [] };
}
async function getQuoteLite(e, fhKey) {
  if (e.y) { try { const r = await yfGet(e.y); return { price: r.price, chgPct: r.chgPct }; } catch { return { price: null, chgPct: null }; } }
  const q = await fhQuote(e.s, fhKey); return { price: q?.c ?? null, chgPct: q?.dp != null ? +(+q.dp).toFixed(2) : null };
}
async function getDetail(e, fhKey) {
  // Globaler Wert (Europa/Asien) über Yahoo-Proxy
  if (e.y) {
    const r = await yfGet(e.y);
    return {
      s: e.s, y: e.y, region: "GLOBAL", name: r.name || e.s, sector: r.exchange || "—", currency: r.currency || "",
      price: r.price, chg: r.chg, chgPct: r.chgPct, open: r.open, high: r.high, low: r.low, prevClose: r.prevClose,
      mktcap: null, recos: [], news: [], _series: r.series || [],
    };
  }
  // US-Wert über Finnhub (mit Empfehlungen + News)
  const to = new Date().toISOString().slice(0, 10), from = new Date(Date.now() - 14 * 864e5).toISOString().slice(0, 10);
  const [q, p, rec, news] = await Promise.all([
    fhQuote(e.s, fhKey), jget(`${FH}/stock/profile2?symbol=${e.s}&token=${fhKey}`),
    jget(`${FH}/stock/recommendation?symbol=${e.s}&token=${fhKey}`), jget(`${FH}/company-news?symbol=${e.s}&from=${from}&to=${to}&token=${fhKey}`),
  ]);
  if (!q || q.c == null) throw new Error("Kein Kurs — US-Ticker prüfen, oder für Nicht-US den Preset/Börsen-Ticker nutzen (z.B. RHM.DE).");
  const [nm, sec] = US_NAME[e.s] || [e.s, "—"]; const now = Date.now();
  return {
    s: e.s, region: "US", name: p?.name || nm, sector: p?.finnhubIndustry || sec, currency: "USD",
    price: q?.c ?? null, chg: q?.d != null ? +(+q.d).toFixed(2) : null, chgPct: q?.dp != null ? +(+q.dp).toFixed(2) : null,
    open: q?.o, high: q?.h, low: q?.l, prevClose: q?.pc, mktcap: p?.marketCapitalization ? +(p.marketCapitalization / 1000).toFixed(1) : null,
    recos: Array.isArray(rec) ? rec.slice(0, 4).map((x) => ({ period: x.period, strongBuy: x.strongBuy, buy: x.buy, hold: x.hold, sell: x.sell, strongSell: x.strongSell })) : [],
    news: Array.isArray(news) ? news.slice(0, 8).map((n) => ({ headline: n.headline, source: (n.source || "NEWS").toUpperCase().slice(0, 10), ago: Math.max(1, Math.floor((now - n.datetime * 1000) / 6e4)), summary: n.summary || "", url: n.url, tags: [e.s] })) : [],
  };
}

/* ================= Groq AI (OpenAI-kompatibel, kostenlos, kein Kreditkarte nötig) ================= */
async function askGroq(groqKey, systemPrompt, historyMsgs, latest) {
  const messages = [
    { role: "system", content: systemPrompt },
    ...historyMsgs.map((m) => ({ role: m.role === "assistant" ? "assistant" : "user", content: m.content })),
    { role: "user", content: latest },
  ];
  const res = await fetch("https://api.groq.com/openai/v1/chat/completions", {
    method: "POST",
    headers: { "Content-Type": "application/json", "Authorization": `Bearer ${groqKey}` },
    body: JSON.stringify({ model: "llama-3.3-70b-versatile", messages, max_tokens: 700, temperature: 0.4 }),
  });
  const data = await res.json();
  if (data?.error) throw new Error(data.error.message || "Groq-Fehler");
  return data?.choices?.[0]?.message?.content?.trim() || "Keine Antwort.";
}

/* ================= Chart (rendert Kursverlauf von Twelve Data) ================= */
function SvgChart({ series, up }) {
  if (!series || series.length < 3) return null;
  const w = 600, h = 200, pad = 8;
  const vals = series.map((d) => d.p);
  const min = Math.min(...vals), max = Math.max(...vals);
  const range = max - min || 1;
  const pts = series.map((d, i) => {
    const x = pad + (i / (series.length - 1)) * (w - pad * 2);
    const y = h - pad - ((d.p - min) / range) * (h - pad * 2);
    return [x, y];
  });
  const line = pts.map((p, i) => (i === 0 ? `M${p[0]},${p[1]}` : `L${p[0]},${p[1]}`)).join(" ");
  const area = `${line} L${pts[pts.length - 1][0]},${h - pad} L${pts[0][0]},${h - pad} Z`;
  const col = up ? C.green : C.red;
  const gid = "grad" + Math.random().toString(36).slice(2, 8);
  return (
    <svg viewBox={`0 0 ${w} ${h}`} style={{ width: "100%", height: 210, display: "block" }} preserveAspectRatio="none">
      <defs><linearGradient id={gid} x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stopColor={col} stopOpacity="0.35" /><stop offset="100%" stopColor={col} stopOpacity="0" /></linearGradient></defs>
      <path d={area} fill={`url(#${gid})`} />
      <path d={line} fill="none" stroke={col} strokeWidth="1.6" />
    </svg>
  );
}

/* ================= Atoms ================= */
const Panel = ({ title, right, children, style }) => (
  <div style={{ background: C.panel, border: `1px solid ${C.line}`, ...style }}>
    {title && <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", padding: "5px 9px", borderBottom: `1px solid ${C.line}`, background: C.panel2 }}><span style={{ color: C.orange, fontSize: 10.5, letterSpacing: 1.5, fontWeight: 700 }}>{title}</span>{right}</div>}
    <div style={{ padding: 9 }}>{children}</div>
  </div>
);
const Stat = ({ k, v, color }) => (<div style={{ borderBottom: `1px solid ${C.line}`, padding: "4px 0", display: "flex", justifyContent: "space-between" }}><span style={{ color: C.muted, fontSize: 10.5 }}>{k}</span><span style={{ color: color || C.white, fontSize: 12 }}>{v}</span></div>);
function DayRange({ d }) {
  if (d.low == null || d.high == null || d.high <= d.low) return <div style={{ color: C.muted, fontSize: 11 }}>Keine Tagesdaten.</div>;
  const pos = (v) => Math.max(0, Math.min(100, ((v - d.low) / (d.high - d.low)) * 100));
  return (<div style={{ padding: "4px 2px 2px" }}>
    <div style={{ display: "flex", justifyContent: "space-between", fontSize: 10, color: C.muted, marginBottom: 6 }}><span>T {d.low}</span><span>TAGESSPANNE</span><span>{d.high}</span></div>
    <div style={{ position: "relative", height: 10, background: "#141518", border: `1px solid ${C.line}` }}>
      <div style={{ position: "absolute", left: 0, width: pos(d.price) + "%", height: "100%", background: C.amberDim, opacity: 0.5 }} />
      {d.prevClose != null && <div style={{ position: "absolute", left: pos(d.prevClose) + "%", top: -3, width: 1, height: 16, background: C.muted }} />}
      <div style={{ position: "absolute", left: `calc(${pos(d.price)}% - 4px)`, top: -3, width: 8, height: 16, background: (d.chg ?? 0) >= 0 ? C.green : C.red }} />
    </div>
    <div style={{ display: "flex", justifyContent: "space-between", fontSize: 9.5, color: C.muted, marginTop: 4 }}><span>Open {d.open}</span><span style={{ color: (d.chg ?? 0) >= 0 ? C.green : C.red }}>Kurs {d.price}</span><span>Vortag {d.prevClose}</span></div>
  </div>);
}
function RecoBar({ recos, region }) {
  if (region === "EU") return <div style={{ color: C.muted, fontSize: 11, lineHeight: 1.5 }}>Analysten-Empfehlungen nur für US-Werte (Datenquelle Finnhub).</div>;
  if (!recos?.length) return <div style={{ color: C.muted, fontSize: 11 }}>Keine Empfehlungsdaten.</div>;
  const cur = recos[0]; const segs = [["strongSell", C.red, "S.Sell"], ["sell", "#ff7a45", "Sell"], ["hold", C.muted, "Hold"], ["buy", C.green, "Buy"], ["strongBuy", "#17a760", "S.Buy"]];
  const total = segs.reduce((a, [k]) => a + (cur[k] || 0), 0) || 1;
  const score = (cur.strongBuy * 2 + cur.buy - cur.sell - cur.strongSell * 2) / total;
  const con = score > 0.7 ? ["KAUFEN", "#17a760"] : score > 0.15 ? ["MOD. KAUFEN", C.green] : score > -0.15 ? ["HALTEN", C.amber] : score > -0.7 ? ["MOD. VERKAUF", "#ff7a45"] : ["VERKAUFEN", C.red];
  return (<div>
    <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline", marginBottom: 7 }}><span style={{ color: con[1], fontSize: 15, fontWeight: 700 }}>{con[0]}</span><span style={{ color: C.muted, fontSize: 10 }}>{total} Analysten</span></div>
    <div style={{ display: "flex", height: 18, border: `1px solid ${C.line}` }}>{segs.map(([k, col]) => { const w = ((cur[k] || 0) / total) * 100; return w > 0 ? <div key={k} style={{ width: w + "%", background: col }} /> : null; })}</div>
    <div style={{ display: "flex", justifyContent: "space-between", marginTop: 6 }}>{segs.slice().reverse().map(([k, col, l]) => <div key={k} style={{ textAlign: "center", flex: 1 }}><div style={{ color: col, fontSize: 13, fontWeight: 700 }}>{cur[k] || 0}</div><div style={{ color: C.muted, fontSize: 8 }}>{l}</div></div>)}</div>
  </div>);
}
function NewsList({ items, onTag, region }) {
  if (region === "EU") return <div style={{ color: C.muted, fontSize: 11, lineHeight: 1.5 }}>Firmen-News nur für US-Werte. Allgemeine Marktnews im News-Tab (F3).</div>;
  if (!items?.length) return <div style={{ color: C.muted, fontSize: 11 }}>Keine Meldungen.</div>;
  return items.map((n, i) => (<div key={i} style={{ padding: "8px 0", borderBottom: i < items.length - 1 ? `1px solid ${C.line}` : "none" }}>
    <div style={{ display: "flex", justifyContent: "space-between", fontSize: 9, marginBottom: 2 }}><span style={{ color: C.blue }}>{n.source}</span><span style={{ color: C.muted }}>{ago(n.ago)}</span></div>
    {n.url ? <a href={n.url} target="_blank" rel="noreferrer" style={{ color: C.white, fontSize: 12, lineHeight: 1.35, textDecoration: "none" }}>{n.headline}</a> : <div style={{ color: C.white, fontSize: 12, lineHeight: 1.35 }}>{n.headline}</div>}
    {n.summary && <div style={{ color: C.muted, fontSize: 10, marginTop: 2, lineHeight: 1.4 }}>{n.summary}</div>}
    {n.tags?.length > 0 && <div style={{ display: "flex", gap: 4, marginTop: 4, flexWrap: "wrap" }}>{n.tags.map((t) => <span key={t} onClick={() => onTag?.({ s: t, m: "US" })} style={{ color: C.amber, fontSize: 8.5, border: `1px solid ${C.amberDim}`, padding: "1px 4px", cursor: onTag ? "pointer" : "default" }}>{t}</span>)}</div>}
  </div>));
}

/* ================= App ================= */
function App() {
  const [booted, setBooted] = useState(false);
  const [connected, setConnected] = useState(false);
  const [fhKey, setFhKey] = useState(""); const [tdKey, setTdKey] = useState(""); const [groqKey, setGroqKey] = useState("");
  const [fhIn, setFhIn] = useState(""); const [tdIn, setTdIn] = useState(""); const [groqIn, setGmIn] = useState("");
  const [connecting, setConnecting] = useState(false); const [connErr, setConnErr] = useState("");
  const [clock, setClock] = useState("");
  const [tab, setTab] = useState("markt");
  const [watch, setWatch] = useState([{ s: "NVDA" }, { s: "AAPL" }, { s: "RHM", y: "RHM.DE" }, { s: "TOYOTA", y: "7203.T" }]);
  const [wlQ, setWlQ] = useState({});
  const [active, setActive] = useState({ s: "NVDA" });
  const [detail, setDetail] = useState(null); const [dLoad, setDLoad] = useState(false);
  const [chart, setChart] = useState({ ok: false, series: [] });
  const [cmd, setCmd] = useState("");

  useEffect(() => {
    const fk = LS.get("fh_key") || "", tk = LS.get("td_key") || "", gk = LS.get("groq_key") || "", wl = LS.get("watch2");
    if (wl?.length) { setWatch(wl); setActive(wl[0]); }
    if (fk) { setFhKey(fk); setTdKey(tk); setGroqKey(gk); setConnected(true); const use = wl?.length ? wl : watch; loadWatch(fk, use); loadDetail(use[0], fk, tk); }
    setBooted(true);
    const iv = setInterval(() => setClock(new Date().toLocaleTimeString("de-DE")), 1000);
    return () => clearInterval(iv);
  }, []);

  const persistWatch = (wl) => { setWatch(wl); LS.set("watch2", wl); };
  const loadWatch = async (fk, wl) => {
    const out = {};
    for (const e of wl) { try { out[keyOf(e)] = await getQuoteLite(e, fk); } catch {} }
    setWlQ((p) => ({ ...p, ...out }));
  };
  const loadDetail = async (e, fk = fhKey, tk = tdKey) => {
    if (!e?.s) return; const ent = { s: e.s.toUpperCase().trim(), y: e.y };
    setActive(ent); setTab("markt"); setDLoad(true); setChart({ ok: false, series: [] });
    try {
      const det = await getDetail(ent, fk); setDetail(det);
      if (det._series && det._series.length > 3) setChart({ ok: true, series: det._series });
      else getChart(ent, tk).then(setChart);
    } catch (er) { setDetail({ ...ent, name: ent.s, error: er.message, recos: [], news: [] }); getChart(ent, tk).then(setChart); }
    setDLoad(false);
  };
  const connect = async () => {
    const fk = fhIn.trim(); if (!fk) { setConnErr("Finnhub-Key ist Pflicht (US-Daten)."); return; }
    setConnecting(true); setConnErr("");
    try {
      const q = await fhQuote("AAPL", fk);
      if (q && q.c != null) {
        const tk = tdIn.trim(), gk = groqIn.trim();
        setFhKey(fk); setTdKey(tk); setGroqKey(gk); setConnected(true);
        LS.set("fh_key", fk); LS.set("td_key", tk); LS.set("groq_key", gk);
        loadWatch(fk, watch); loadDetail(active || watch[0], fk, tk);
      } else throw new Error("ungültig");
    } catch { setConnErr("Finnhub-Verbindung fehlgeschlagen – Key prüfen."); }
    setConnecting(false);
  };
  const disconnect = () => { setConnected(false); setFhKey(""); setTdKey(""); setGroqKey(""); setDetail(null); LS.del("fh_key"); LS.del("td_key"); LS.del("groq_key"); };
  const addWatch = (e) => { if (!watch.find((x) => keyOf(x) === keyOf(e))) { const wl = [e, ...watch].slice(0, 20); persistWatch(wl); loadWatch(fhKey, [e]); } };
  const rmWatch = (e) => persistWatch(watch.filter((x) => keyOf(x) !== keyOf(e)));

  /* AI analyst (Groq) */
  const [msgs, setMsgs] = useState([]); const [aiIn, setAiIn] = useState(""); const [aiBusy, setAiBusy] = useState(false); const chatEnd = useRef(null);
  useEffect(() => { chatEnd.current?.scrollIntoView({ behavior: "smooth" }); }, [msgs, aiBusy]);
  const askAI = async (q) => {
    const question = (q || aiIn).trim(); if (!question || aiBusy || !detail) return;
    if (!groqKey) { setMsgs((m) => [...m, { role: "user", content: question }, { role: "assistant", content: "Kein Groq-Key hinterlegt. Trag ihn im Login ein, um den Analysten zu nutzen." }]); setAiIn(""); return; }
    setAiIn("");
    const next = [...msgs, { role: "user", content: question }]; setMsgs(next); setAiBusy(true);
    const r = detail.recos?.[0];
    const snap = `${detail.s} (${detail.name}, ${detail.sector}, ${detail.region}). Kurs ${detail.price} ${detail.currency}, ${detail.chgPct}% heute. Tagesspanne ${detail.low}-${detail.high}.${r ? ` Analysten: SB ${r.strongBuy}, B ${r.buy}, H ${r.hold}, S ${r.sell}, SS ${r.strongSell}.` : ""}`;
    try {
      const txt = await askGroq(groqKey, "Analyst eines Finanz-Terminals. Deutsch, knapp, sachlich. Erkläre & ordne ein, Argumente pro/contra. KEINE Anlageberatung.", next, `[LIVE] ${snap}`);
      setMsgs((m) => [...m, { role: "assistant", content: txt }]);
    } catch (e) { setMsgs((m) => [...m, { role: "assistant", content: "Analyst nicht erreichbar: " + e.message }]); }
    setAiBusy(false);
  };

  /* Scanner (US) */
  const [scan, setScan] = useState([]); const [scanning, setScanning] = useState(false);
  const [scSec, setScSec] = useState("Alle"); const [scChg, setScChg] = useState(""); const [scSort, setScSort] = useState("chg"); const [scDir, setScDir] = useState(-1);
  const runScan = async () => { setScanning(true);
    const rows = await Promise.all(US_UNIVERSE.map(async ([sym, name, sec]) => { try { const q = await fhQuote(sym, fhKey); return { s: sym, name, sector: sec, price: q.c, chg: +(+q.dp).toFixed(2) }; } catch { return { s: sym, name, sector: sec, price: null, chg: null }; } }));
    setScan(rows); setScanning(false);
  };
  const scanView = useMemo(() => { let r = scan.filter((x) => (scSec === "Alle" || x.sector === scSec) && (!scChg || (x.chg != null && x.chg >= +scChg))); r.sort((a, b) => ((a[scSort] ?? -9e9) > (b[scSort] ?? -9e9) ? scDir : (a[scSort] ?? -9e9) < (b[scSort] ?? -9e9) ? -scDir : 0)); return r; }, [scan, scSec, scChg, scSort, scDir]);

  /* News */
  const [nCat, setNCat] = useState("general"); const [nRows, setNRows] = useState([]); const [nBusy, setNBusy] = useState(false); const [nErr, setNErr] = useState("");
  const [digest, setDigest] = useState(""); const [digBusy, setDigBusy] = useState(false);
  const loadNews = async (cat = nCat) => { setNBusy(true); setNErr("");
    try { const data = await jget(`${FH}/news?category=${cat}&token=${fhKey}`); if (!Array.isArray(data)) throw 0; const now = Date.now();
      setNRows(data.slice(0, 30).map((n) => ({ headline: n.headline, source: (n.source || "NEWS").toUpperCase().slice(0, 10), ago: Math.max(1, Math.floor((now - n.datetime * 1000) / 6e4)), summary: n.summary || "", url: n.url, tags: n.related ? n.related.split(",").slice(0, 3) : [] })));
    } catch { setNErr("News-Abruf fehlgeschlagen."); } setNBusy(false);
  };
  const genDigest = async () => { if (digBusy || !nRows.length) return;
    if (!groqKey) { setDigest("Kein Groq-Key hinterlegt."); return; }
    setDigBusy(true); setDigest("");
    const feed = nRows.slice(0, 12).map((n, i) => `${i + 1}. ${n.headline}`).join("\n");
    try { const txt = await askGroq(groqKey, "Analyst. Fasse Schlagzeilen zu 2-3 Themen zusammen, ordne ein, 'Was beobachten?'. Deutsch, knapp. KEINE Anlageberatung.", [], `Ordne ein:\n${feed}`); setDigest(txt); }
    catch (e) { setDigest("Einordnung fehlgeschlagen: " + e.message); } setDigBusy(false);
  };
  useEffect(() => { if (connected && tab === "news" && !nRows.length) loadNews(); }, [connected, tab]);

  if (!booted) return <div style={{ background: C.bg, minHeight: "100vh", color: C.amber, fontFamily: mono, display: "flex", alignItems: "center", justifyContent: "center" }}>lädt…</div>;

  if (!connected) return (
    <div style={{ background: C.bg, minHeight: "100vh", fontFamily: mono, color: C.text, display: "flex", alignItems: "center", justifyContent: "center", padding: 16 }}>
      <div style={{ maxWidth: 480, width: "100%", border: `1px solid ${C.amberDim}`, background: C.panel }}>
        <div style={{ background: "#000", borderBottom: `1px solid ${C.amberDim}`, padding: "10px 14px", color: C.orange, fontWeight: 700, letterSpacing: 2 }}>◈ TERMINAL — LOGIN</div>
        <div style={{ padding: 18, lineHeight: 1.55, fontSize: 13 }}>
          <p style={{ marginTop: 0, color: C.white }}>Alle Keys einmal eingeben – danach US- und Europa-Aktien plus KI-Analyst. Wird lokal in deinem Browser gespeichert.</p>
          <div style={{ marginBottom: 12 }}>
            <div style={{ color: C.amber, fontSize: 11, marginBottom: 4 }}>1 · FINNHUB-KEY <span style={{ color: C.muted }}>(Pflicht · US-Kurse, Empfehlungen, News)</span></div>
            <input type="password" value={fhIn} onChange={(e) => setFhIn(e.target.value)} placeholder="finnhub.io – Gratis-Key" style={{ ...inp, width: "100%", boxSizing: "border-box" }} />
          </div>
          <div style={{ marginBottom: 12 }}>
            <div style={{ color: C.amber, fontSize: 11, marginBottom: 4 }}>2 · TWELVE-DATA-KEY <span style={{ color: C.muted }}>(empfohlen · für den Kursverlauf/Chart)</span></div>
            <input type="password" value={tdIn} onChange={(e) => setTdIn(e.target.value)} placeholder="twelvedata.com – Gratis-Key" style={{ ...inp, width: "100%", boxSizing: "border-box" }} />
          </div>
          <div style={{ marginBottom: 14 }}>
            <div style={{ color: C.amber, fontSize: 11, marginBottom: 4 }}>3 · GROQ-KEY <span style={{ color: C.muted }}>(optional · KI-Analyst)</span></div>
            <input type="password" value={groqIn} onChange={(e) => setGmIn(e.target.value)} onKeyDown={(e) => e.key === "Enter" && connect()} placeholder="console.groq.com – Gratis-Key (kein Kreditkarte)" style={{ ...inp, width: "100%", boxSizing: "border-box" }} />
          </div>
          <button onClick={connect} disabled={connecting} style={{ width: "100%", background: C.orange, color: "#000", border: "none", padding: "9px", fontFamily: mono, fontWeight: 700, cursor: "pointer", fontSize: 13 }}>{connecting ? "VERBINDE…" : "▶ VERBINDEN"}</button>
          {connErr && <div style={{ color: C.red, fontSize: 11, marginTop: 8 }}>{connErr}</div>}
        </div>
      </div>
    </div>
  );

  const d = detail || { s: active.s, name: "", recos: [], news: [] };
  const up = (d.chg ?? 0) >= 0; const cur = CUR[d.currency] || d.currency || "";
  const Fkey = (label, k, col) => <button onClick={() => setTab(k)} style={{ background: tab === k ? col : "#000", color: tab === k ? "#000" : col, border: `1px solid ${col}`, fontSize: 10, padding: "3px 10px", cursor: "pointer", fontFamily: mono, fontWeight: 700 }}>{label}</button>;
  const Th = ({ k, label, a }) => <th onClick={() => { setScSort(k); setScDir(scSort === k ? -scDir : -1); }} style={{ textAlign: a || "left", padding: "6px 8px", color: scSort === k ? C.orange : C.muted, fontSize: 10, cursor: "pointer", borderBottom: `1px solid ${C.amberDim}`, whiteSpace: "nowrap" }}>{label}{scSort === k ? (scDir === -1 ? " ▼" : " ▲") : ""}</th>;

  const WL = (
    <Panel title="WATCHLIST" style={{ height: "100%" }}>
      {watch.map((e) => { const q = wlQ[keyOf(e)]; const on = keyOf(e) === keyOf(active); const u = (q?.chgPct ?? 0) >= 0;
        return <div key={keyOf(e)} onClick={() => loadDetail(e)} style={{ display: "grid", gridTemplateColumns: "1fr auto auto auto", gap: 5, alignItems: "center", padding: "5px 4px", margin: "0 -4px", background: on ? "#17140a" : "transparent", borderLeft: `2px solid ${on ? C.orange : "transparent"}`, cursor: "pointer" }}>
          <span style={{ color: on ? C.orange : C.white, fontSize: 12 }}>{e.s}</span>
          <span style={{ fontSize: 11, color: C.text }}>{q?.price ?? "—"}</span>
          <span style={{ fontSize: 11, color: u ? C.green : C.red }}>{q?.chgPct != null ? (u ? "+" : "") + q.chgPct + "%" : ""}</span>
          <span onClick={(ev) => { ev.stopPropagation(); rmWatch(e); }} style={{ color: C.muted, fontSize: 12, cursor: "pointer" }}>×</span>
        </div>; })}
      {watch.length === 0 && <div style={{ color: C.muted, fontSize: 11 }}>Leer.</div>}
    </Panel>
  );

  return (
    <div style={{ background: C.bg, minHeight: "100vh", fontFamily: mono, color: C.text }}>
      <div style={{ background: "#000", borderBottom: `1px solid ${C.amberDim}`, padding: "6px 12px", display: "flex", alignItems: "center", gap: 8, flexWrap: "wrap" }}>
        <span style={{ color: C.orange, fontWeight: 700, letterSpacing: 2, fontSize: 13 }}>◈ TERMINAL</span>
        <div style={{ flex: 1, minWidth: 150, display: "flex", alignItems: "center", gap: 6, background: C.panel2, border: `1px solid ${C.amberDim}`, padding: "4px 8px" }}>
          <span style={{ color: C.orange }}>{">"}</span>
          <input value={cmd} onChange={(e) => setCmd(e.target.value)} onKeyDown={(e) => e.key === "Enter" && (loadDetail({ s: cmd }), setCmd(""))} placeholder="TICKER + GO" style={{ flex: 1, background: "transparent", border: "none", color: C.amber, fontFamily: mono, fontSize: 12, outline: "none", textTransform: "uppercase" }} />
          <span className="caret" style={{ color: C.orange }}>▊</span>
        </div>
        <span style={{ color: C.green, fontSize: 11 }}>● WELT{groqKey ? " · AI" : ""}</span>
        <span style={{ color: C.muted, fontSize: 11 }}>{clock}</span>
        <span onClick={disconnect} style={{ color: C.muted, fontSize: 10, cursor: "pointer", border: `1px solid ${C.line}`, padding: "2px 6px" }}>LOGOUT</span>
      </div>
      <div style={{ background: "#000", borderBottom: `1px solid ${C.line}`, padding: "5px 12px", display: "flex", gap: 6, flexWrap: "wrap", alignItems: "center" }}>
        {Fkey("F1 MARKT", "markt", C.amber)}{Fkey("F2 SCANNER", "scanner", C.green)}{Fkey("F3 NEWS", "news", C.red)}
        <span style={{ color: C.muted, fontSize: 9, marginLeft: 6 }}>EU:</span>
        {EU_PRESETS.slice(0, 8).map((p) => <button key={p.y} onClick={() => loadDetail(p)} title={p.label} style={{ background: "transparent", color: C.blue, border: `1px solid ${C.line}`, fontSize: 9, padding: "2px 6px", cursor: "pointer", fontFamily: mono }}>{p.s}</button>)}
        <span style={{ color: C.muted, fontSize: 9, marginLeft: 6 }}>ASIA:</span>
        {ASIA_PRESETS.map((p) => <button key={p.y} onClick={() => loadDetail(p)} title={p.label} style={{ background: "transparent", color: C.blue, border: `1px solid ${C.line}`, fontSize: 9, padding: "2px 6px", cursor: "pointer", fontFamily: mono }}>{p.label}</button>)}
      </div>
      {Object.keys(wlQ).length > 0 && (
        <div style={{ background: C.panel2, borderBottom: `1px solid ${C.line}`, overflow: "hidden", padding: "3px 0" }}>
          <div className="tape">{[...watch, ...watch].map((e, i) => { const q = wlQ[keyOf(e)]; if (!q || q.chgPct == null) return null; const u = q.chgPct >= 0; return <span key={i} style={{ margin: "0 18px", fontSize: 11 }}><span style={{ color: C.orange }}>{e.s}</span> <span style={{ color: C.white }}>{q.price}</span> <span style={{ color: u ? C.green : C.red }}>{u ? "▲" : "▼"}{q.chgPct}%</span></span>; })}</div>
        </div>
      )}

      {tab === "markt" && (
        <div style={{ display: "grid", gridTemplateColumns: window.innerWidth > 980 ? "185px 1fr 305px" : "1fr", gap: 8, padding: 8 }}>
          {window.innerWidth > 980 && <div>{WL}</div>}
          <div>
            <Panel style={{ marginBottom: 8 }}>
              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-end", flexWrap: "wrap", gap: 8 }}>
                <div><div style={{ color: C.orange, fontSize: 22, fontWeight: 700 }}>{d.s} <span style={{ color: C.muted, fontSize: 12, fontWeight: 400 }}>{d.name}</span></div><div style={{ color: C.muted, fontSize: 10.5 }}>{d.sector}{d.region === "US" ? " · US" : ""} {dLoad ? "· lädt…" : ""}</div></div>
                <div style={{ display: "flex", alignItems: "flex-end", gap: 10 }}>
                  {d.price != null && <div style={{ textAlign: "right" }}><div style={{ fontSize: 25, color: up ? C.green : C.red, fontWeight: 700 }}>{d.price} <span style={{ fontSize: 12, color: C.muted }}>{cur}</span></div><div style={{ fontSize: 13, color: up ? C.green : C.red }}>{up ? "▲ +" : "▼ "}{d.chg} ({up ? "+" : ""}{d.chgPct}%)</div></div>}
                  <button onClick={() => addWatch({ s: d.s })} style={{ background: "transparent", color: C.amber, border: `1px solid ${C.amberDim}`, fontSize: 10, padding: "4px 8px", cursor: "pointer", fontFamily: mono }}>+WL</button>
                </div>
              </div>
              {d.error && <div style={{ color: C.red, fontSize: 10.5, marginTop: 6 }}>Fehler: {d.error} — Ticker/Börse prüfen.</div>}
            </Panel>

            <Panel title={`CHART · ${d.s}`} style={{ marginBottom: 8 }}>
              {chart.ok && chart.series.length > 3 ? <SvgChart series={chart.series} up={up} /> : <div style={{ color: C.muted, fontSize: 11, padding: "8px 0" }}>Chart lädt / für diesen Ticker nicht verfügbar.</div>}
              <DayRange d={d} />
            </Panel>

            <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 8, marginBottom: 8 }}>
              <Panel title="KENNZAHLEN"><Stat k="OPEN" v={d.open ?? "—"} /><Stat k="HOCH" v={d.high ?? "—"} color={C.green} /><Stat k="TIEF" v={d.low ?? "—"} color={C.red} /><Stat k="VORTAG" v={d.prevClose ?? "—"} /><Stat k="WÄHRUNG" v={d.currency || "—"} /><Stat k="MKT CAP" v={fmtCap(d.mktcap)} /></Panel>
              <Panel title="ANALYSTEN-EMPFEHLUNG"><RecoBar recos={d.recos} region={d.region === "US" ? "US" : "EU"} /></Panel>
            </div>
            <Panel title={`NEWS · ${d.s}`} style={{ marginBottom: 8 }}><NewsList items={d.news} onTag={loadDetail} region={d.region === "US" ? "US" : "EU"} /></Panel>
            {window.innerWidth <= 980 && <div>{WL}</div>}
          </div>

          <Panel title="◆ AI-ANALYST" right={<span style={{ fontSize: 9, color: C.muted }}>Groq</span>} style={{ display: "flex", flexDirection: "column" }}>
            <div style={{ display: "flex", flexDirection: "column", minHeight: 340 }}>
              <div style={{ display: "flex", gap: 4, flexWrap: "wrap", marginBottom: 8 }}>{["Zusammenfassung", "Chart deuten", "Bull vs. Bear"].map((c) => <button key={c} onClick={() => askAI(`${c} für ${d.s}`)} disabled={aiBusy} style={{ background: "transparent", color: C.amber, border: `1px solid ${C.amberDim}`, fontSize: 10, padding: "3px 7px", cursor: "pointer", fontFamily: mono }}>{c}</button>)}</div>
              <div style={{ flex: 1, overflowY: "auto", fontSize: 12, lineHeight: 1.5, minHeight: 180, maxHeight: 340 }}>
                {msgs.length === 0 && <div style={{ color: C.muted, fontSize: 11 }}>Frag zu {d.s}. Analyse, keine Anlageberatung.{!groqKey && " (Groq-Key im Login nötig)"}</div>}
                {msgs.map((m, i) => <div key={i} style={{ marginBottom: 9 }}><div style={{ color: m.role === "user" ? C.blue : C.orange, fontSize: 9, marginBottom: 2 }}>{m.role === "user" ? "YOU" : "ANALYST"}</div><div style={{ whiteSpace: "pre-wrap" }}>{m.content}</div></div>)}
                {aiBusy && <div style={{ color: C.orange, fontSize: 11 }}>▍analysiere…</div>}<div ref={chatEnd} />
              </div>
              <div style={{ display: "flex", gap: 6, marginTop: 8 }}><input value={aiIn} onChange={(e) => setAiIn(e.target.value)} onKeyDown={(e) => e.key === "Enter" && askAI()} placeholder="Frage…" style={{ flex: 1, ...inp, color: C.white }} /><button onClick={() => askAI()} disabled={aiBusy} style={{ background: C.orange, color: "#000", border: "none", padding: "0 12px", cursor: "pointer", fontFamily: mono, fontWeight: 700 }}>➤</button></div>
            </div>
          </Panel>
        </div>
      )}

      {tab === "scanner" && (
        <div style={{ padding: 8 }}>
          <div style={{ display: "flex", gap: 8, alignItems: "flex-end", flexWrap: "wrap", background: C.panel, border: `1px solid ${C.line}`, padding: 12, marginBottom: 8 }}>
            <div style={{ display: "flex", flexDirection: "column", gap: 3 }}><span style={{ color: C.muted, fontSize: 9 }}>SEKTOR</span><select value={scSec} onChange={(e) => setScSec(e.target.value)} style={{ ...inp, color: C.white }}>{SECTORS.map((s) => <option key={s} style={{ background: C.panel }}>{s}</option>)}</select></div>
            <div style={{ display: "flex", flexDirection: "column", gap: 3 }}><span style={{ color: C.muted, fontSize: 9 }}>%CHG MIN</span><input value={scChg} onChange={(e) => setScChg(e.target.value)} placeholder="-99" style={{ ...inp, color: C.white, width: 90 }} /></div>
            <button onClick={runScan} disabled={scanning} style={{ background: C.green, color: "#000", border: "none", padding: "7px 14px", cursor: "pointer", fontFamily: mono, fontWeight: 700, fontSize: 12 }}>{scanning ? "SCANNE…" : "▶ MARKT SCANNEN"}</button>
            <span style={{ color: C.muted, fontSize: 10 }}>{scan.length ? scanView.length + " Treffer" : "US-Werte · ~30 Aufrufe"}</span>
          </div>
          <div style={{ background: C.panel, border: `1px solid ${C.line}`, overflowX: "auto" }}>
            <table style={{ width: "100%", borderCollapse: "collapse", fontSize: 12 }}>
              <thead><tr><Th k="s" label="SYM" /><Th k="name" label="NAME" /><Th k="sector" label="SEKTOR" /><Th k="price" label="PREIS" a="right" /><Th k="chg" label="%CHG" a="right" /></tr></thead>
              <tbody>{scanView.map((x, i) => <tr key={x.s} onClick={() => loadDetail({ s: x.s, m: "US" })} style={{ background: i % 2 ? "#0e0f11" : "transparent", cursor: "pointer" }}><td style={{ padding: "6px 8px", color: C.orange }}>{x.s}</td><td style={{ padding: "6px 8px", whiteSpace: "nowrap" }}>{x.name}</td><td style={{ padding: "6px 8px", color: C.blue, fontSize: 11 }}>{x.sector}</td><td style={{ padding: "6px 8px", textAlign: "right" }}>{x.price ?? "—"}</td><td style={{ padding: "6px 8px", textAlign: "right", color: (x.chg ?? 0) >= 0 ? C.green : C.red }}>{x.chg == null ? "—" : (x.chg >= 0 ? "+" : "") + x.chg + "%"}</td></tr>)}</tbody>
            </table>
            {!scan.length && <div style={{ padding: 24, textAlign: "center", color: C.muted, fontSize: 12 }}>„MARKT SCANNEN" holt Live-Kurse. EU-Werte einzeln über Kommandozeile/Presets laden.</div>}
          </div>
        </div>
      )}

      {tab === "news" && (
        <div style={{ padding: 8 }}>
          <div style={{ background: "#17140a", border: `1px solid ${C.amberDim}`, padding: "6px 12px", fontSize: 10.5, color: C.amber, marginBottom: 8 }}>⚠ Information &amp; Analyse – KEINE Anlageberatung.</div>
          <div style={{ display: "flex", gap: 6, flexWrap: "wrap", alignItems: "center", marginBottom: 8 }}>
            {[["general", "MARKT"], ["crypto", "KRYPTO"], ["merger", "M&A"], ["forex", "FOREX"]].map(([k, l]) => <button key={k} onClick={() => { setNCat(k); loadNews(k); }} style={{ background: nCat === k ? C.amber : "transparent", color: nCat === k ? "#000" : C.muted, border: `1px solid ${nCat === k ? C.amber : C.line}`, fontSize: 10, padding: "3px 9px", cursor: "pointer", fontFamily: mono }}>{l}</button>)}
            <div style={{ flex: 1 }} /><button onClick={() => loadNews()} disabled={nBusy} style={{ background: "transparent", color: C.amber, border: `1px solid ${C.amberDim}`, fontSize: 10, padding: "4px 10px", cursor: "pointer", fontFamily: mono }}>{nBusy ? "…" : "↻ AKTUALISIEREN"}</button>
          </div>
          {nErr && <div style={{ color: C.red, fontSize: 11, marginBottom: 8 }}>{nErr}</div>}
          <div style={{ background: C.panel, border: `1px solid ${C.amberDim}`, padding: 12, marginBottom: 8 }}>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: digest || digBusy ? 8 : 0 }}><span style={{ color: C.orange, fontSize: 11, letterSpacing: 1, fontWeight: 700 }}>◆ KI-EINORDNUNG</span><button onClick={genDigest} disabled={digBusy || !nRows.length} style={{ background: "transparent", color: C.amber, border: `1px solid ${C.amberDim}`, fontSize: 10, padding: "4px 10px", cursor: "pointer", fontFamily: mono }}>{digBusy ? "analysiere…" : "Einordnung generieren"}</button></div>
            {digest && <div style={{ fontSize: 12.5, lineHeight: 1.55, whiteSpace: "pre-wrap" }}>{digest}</div>}
          </div>
          <div style={{ background: C.panel, border: `1px solid ${C.line}`, padding: "2px 12px" }}><NewsList items={nRows} onTag={loadDetail} region="US" /></div>
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>

<script>
  (function(){
    function fail(m){ window.__err(m); var b=document.getElementById('boot'); if(b) b.textContent='◈ TERMINAL — Start fehlgeschlagen (siehe Fehler unten).'; }
    if (typeof React==='undefined' || typeof ReactDOM==='undefined') { fail('React konnte nicht geladen werden (CDN blockiert?). Ohne Internet/mit Content-Blocker startet die App nicht.'); return; }
    if (typeof Babel==='undefined') { fail('Babel (Compiler) konnte nicht geladen werden (CDN blockiert?).'); return; }
    try {
      var src = document.getElementById('app-src').textContent;
      var out = Babel.transform(src, { presets: ['react'] }).code;
      (0, eval)(out);
    } catch(e){ fail((e && e.stack) || (e && e.message) || String(e)); }
  })();
</script>
</body>
</html>
